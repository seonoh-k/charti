<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}"
      th:with="userService=${@userService}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${board.title}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<th:block layout:fragment="content">
    <div class="container mx-auto p-6 bg-white shadow rounded-lg">
        <h1 class="text-3xl font-bold text-[#628C73] mb-4" th:text="${board.title}">제목</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-gray-700 mb-6">
            <p><span class="font-medium">하위카테고리:</span>
                <span th:text="${board.category2}">카테고리</span></p>
            <p><span class="font-medium">연령대:</span>
                <span th:text="${board.ageGroup.displayName}">0~1세</span></p>
            <p><span class="font-medium">조회수:</span>
                <span th:text="${board.views}">0</span></p>
            <p><span class="font-medium">작성자:</span>
                <span th:text="${userService.getNicknameByUsersId(board.usersId)}">닉네임</span></p>
            <p><span class="font-medium">작성일:</span>
                <span th:text="${#temporals.format(board.createdAt,'yyyy.MM.dd HH:mm')}">2025.06.27 16:00</span></p>
        </div>

        <hr class="my-4"/>

        <div class="prose max-w-none mb-8" th:utext="${board.content}">본문</div>

        <h3 class="text-2xl font-semibold text-gray-800 mb-4">댓글</h3>
        <div class="space-y-4 mb-6">
            <div th:each="c : ${commentsPage.content}" class="border-b pb-2">
                <p>
                    <strong class="text-[#7CA48C]"
                            th:text="${userService.getNicknameByUsersId(c.usersId)} ?: '손님'">닉네임</strong>:
                    <span th:text="${c.content}">댓글</span>
                    <small class="text-gray-500 ml-2"
                           th:text="${#temporals.format(c.createdAt,'yyyy.MM.dd HH:mm')}">시간</small>
                </p>
            </div>
        </div>

        <!-- 댓글 페이징 (댓글이 있을 때만) -->
        <nav th:if="${commentsPage.totalElements > 0}" class="flex justify-center space-x-2 mb-6">
      <span th:if="${commentsPage.hasPrevious()}">
        <a th:href="@{/community/policy/{id}(id=${board.communityId},commentPage=${commentsPage.number-1})}"
           class="px-3 py-1 bg-gray-200 text-[#E3A67A] rounded hover:bg-gray-300 transition">&lt; 이전</a>
      </span>
            <span th:each="i : ${#numbers.sequence(0,commentsPage.totalPages-1)}">
        <a th:href="@{/community/policy/{id}(id=${board.communityId},commentPage=${i})}"
           th:text="${i+1}"
           th:classappend="${i == commentsPage.number} ?
             ' bg-[#E3A67A] text-white' : ' bg-gray-200 text-[#E3A67A]'"
           class="px-3 py-1 rounded hover:bg-[#E3A67A] hover:text-white transition"/>
      </span>
            <span th:if="${commentsPage.hasNext()}">
        <a th:href="@{/community/policy/{id}(id=${board.communityId},commentPage=${commentsPage.number+1})}"
           class="px-3 py-1 bg-gray-200 text-[#E3A67A] rounded hover:bg-gray-300 transition">다음 &gt;</a>
      </span>
        </nav>

        <!-- 댓글 등록 -->
        <form th:action="@{/community/policy/{id}/comments(id=${board.communityId})}"
              method="post" class="mb-6">
      <textarea name="content" rows="3" placeholder="댓글을 입력하세요."
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                required></textarea>
            <button type="submit"
                    class="mt-2 bg-[#E3A67A] text-white font-semibold px-5 py-2 rounded hover:opacity-90 transition">
                등록하기
            </button>
        </form>

        <div class="flex gap-4 mb-6">
            <a th:href="@{/community/policy/{id}/edit(id=${board.communityId})}"
               class="inline-flex items-center bg-[#7CA48C] active:bg-[#628C73] text-white font-semibold px-5 py-2 rounded hover:opacity-90 transition">
                <i class="fas fa-edit mr-2"></i>수정
            </a>
            <form th:action="@{/community/policy/{id}/delete(id=${board.communityId})}"
                  method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                <button type="submit"
                        class="inline-flex items-center bg-red-500 text-white font-semibold px-5 py-2 rounded hover:bg-red-600 transition">
                    <i class="fas fa-trash mr-2"></i>삭제
                </button>
            </form>
        </div>

        <a th:href="@{/community/policy/list}"
           class="inline-block text-[#E3A67A] hover:underline">◀ 목록으로 돌아가기</a>
    </div>
</th:block>
</html>
