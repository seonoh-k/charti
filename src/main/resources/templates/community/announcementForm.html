<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${board.communityId} == null ? '공지 작성' : '공지 수정'">공지 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet"/>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<th:block layout:fragment="content">
    <div class="container mx-auto p-6 bg-white shadow rounded-lg max-w-3xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-6"
            th:text="${board.communityId} == null ? '공지 작성' : '공지 수정'">
            공지 작성
        </h1>

        <form th:action="${board.communityId} == null
                     ? @{/community/announcement}
                     : @{/community/announcement/{id}(id=${board.communityId})}"
              method="post" class="space-y-6">

            <!-- 로그인 사용자 ID -->
            <input type="hidden" name="usersId" th:value="${currentUser.id}" />

            <!-- 하위 카테고리 -->
            <div class="flex flex-col">
                <label class="mb-1 font-medium text-gray-700">하위카테고리</label>
                <select name="category2" required
                        class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option th:each="c : ${subCategories}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${c == board.category2}"/>
                </select>
            </div>

            <!-- 제목 -->
            <div class="flex flex-col">
                <label class="mb-1 font-medium text-gray-700">제목</label>
                <input type="text" name="title"
                       th:value="${board.title}"
                       required
                       class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>

            <!-- 내용 -->
            <div class="flex flex-col">
                <label class="mb-1 font-medium text-gray-700">내용</label>
                <textarea name="content" rows="8" required
                          th:text="${board.content}"
                          class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-vertical"/>
            </div>

            <div class="flex justify-end">
                <button type="submit"
                        class="bg-[#7CA48C] text-white font-semibold px-6 py-2 rounded hover:opacity-90 transition">
                    저장
                </button>
            </div>
        </form>
    </div>
</th:block>
</html>
