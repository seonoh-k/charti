<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비밀번호 재설정</title>
<script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SMS 인증  -->
<script type="module" src="/js/smsAuth.js"></script>

</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">비밀번호 재설정</h2>

        <!-- ① 아이디 입력 -->
        <div class="mb-4">
            <label for="username" class="block mb-1">아이디 (이메일)</label>
            <input type="text" id="username" class="w-full p-2 rounded border border-gray-300" required />
        </div>

        <!-- ② 전화번호 입력 -->
        <div class="mb-4">
            <label class="block mb-1">전화번호</label>
            <div class="flex space-x-2">
            <select id="phone1" class="border p-2 rounded w-20">
                <option value="010">010</option>
                <option value="011">011</option>
                <option value="016">016</option>
                <option value="017">017</option>
            </select>
            <input id="phone2" type="text" maxlength="4" class="border p-2 rounded w-20" placeholder="1234" />
            <input id="phone3" type="text" maxlength="4" class="border p-2 rounded w-20" placeholder="5678" />
            <button type="button" id="send-otp-btn" onclick="sendSmsOtp('find')"
                    class="px-3 bg-blue-600 text-white rounded" >
                인증번호<br>받기</button>
            </div>
        </div>

        <!-- ③ 인증번호 입력 -->
        <div class="mb-4">
            <label class="block mb-1">인증번호</label>
            <input id="otp" type="text" class="border p-2 rounded w-full" placeholder="6자리" disabled />
            <button type="button" id="verify-otp-btn" onclick="verifySmsOtp('find')"
            class="mt-2 px-3 py-1 bg-green-600 text-white rounded" disabled>
            인증 확인
            </button>
        </div>

        <!-- ④ 비밀번호 입력 (처음엔 readonly) -->

            <div class="mb-4">
            <label class="block mb-1">새 비밀번호</label>
            <input id="newPassword" type="password" class="border p-2 rounded w-full"
                    placeholder="새 비밀번호" readonly />
            </div>

            <!-- 🔒 비밀번호 확인 -->
            <div class="mb-4">
            <label class="block mb-1">비밀번호 확인</label>
            <input id="confirmPassword" type="password" class="border p-2 rounded w-full"
                placeholder="비밀번호 확인" readonly />
            </div>

        <!-- ⑤ 제출 -->
        <div class="mt-6">
            <button onclick="resetPassword()" class="w-full bg-black text-white py-2 rounded hover:bg-gray-800">
            비밀번호 재설정
            </button>
        </div>
  <div id="pwMessage" class="text-red-600 mt-2"></div>
        <div id="resetResult" class="mt-4 text-center text-green-700 font-semibold"></div>
        <div id="recaptcha-container"></div>
    </div>

<script>
    // 비밀번호 필드 유호성검사
    function validatePasswordFields() {
        const pw    = document.getElementById('newPassword').value.trim();
        const pw2   = document.getElementById('confirmPassword').value.trim();
        const msgEl = document.getElementById('pwMessage');

        const pwRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\W)[^\s]{8,16}$/;

        if (!pwRegex.test(pw)) {
            msgEl.textContent = '비밀번호는 8~16자, 대/소문자, 특수문자를 포함해야 하며 공백은 허용되지 않습니다.';
            return false;
        }

        if (pw !== pw2) {
            msgEl.textContent = '비밀번호가 일치하지 않습니다.';
            return false;
        }

        msgEl.textContent = ''; // 유효
        return true;
    }

    async function resetPassword() {
        if (!validatePasswordFields()) return;

        const token = getVerifiedSmsToken();
        if (!token) {
            alert("먼저 전화번호 인증을 완료해주세요.");
            return;
        }
        const username = document.getElementById('username').value.trim(); 
        const newPassword = document.getElementById('newPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();

        if (!newPassword || newPassword.length < 8) {
            alert("비밀번호는 최소 8자리 이상이어야 합니다.");
            return;
        }

        if (newPassword !== confirmPassword) {
            alert("비밀번호가 일치하지 않습니다.");
            return;
        }


        try {

                const res = await fetch('/api/resetPassword', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                        body: JSON.stringify({
                            username,
                            newPassword
                        })
                });

            const data = await res.json();
            if (res.ok) {
                alert(data.data || '비밀번호가 변경되었습니다.');  
                 window.location.href = '/loginForm'; 
            } else {
            alert(data.message || '사용자 정보를 찾을 수 없습니다.');
            }
        } catch (err) {
            console.error(err);
            alert("요청 처리 중 오류가 발생했습니다.");
        }
    }

    window.resetPassword = resetPassword;
</script>
</body>
</html>
