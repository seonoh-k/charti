<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데일리 문진 결과</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <h1 class="text-2xl font-bold mb-4">데일리 문진 결과</h1>
    <div id="result-container" class="space-y-6 mb-6"></div>
    <button onclick="goHome()"
            class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">
        홈으로 돌아가기
    </button>

    <script>
        // 1) URL 파라미터
        const params       = new URLSearchParams(window.location.search);
        const riskParam    = params.get("riskScores");
        const childId      = params.get("childId");
        const ageGroup     = params.get("ageGroup");
        const needsSpecial = params.get("needsSpecial") === 'true';

        let resultData;
        try {
          resultData = JSON.parse(decodeURIComponent(riskParam));
        } catch (e) {
          console.error("파싱 실패:", e);
          document.getElementById("result-container").innerHTML =
            `<p class="text-red-500">결과를 불러오는 데 실패했습니다.</p>`;
          throw e;
        }

        const { categoryScores = {}, totalRiskScore = 0 } = resultData;
        const container = document.getElementById("result-container");

        // Enum 매핑
        const categoryEnumMap = {
          "의사소통/정서/심리": "COMMUNICATION",
          "운동/인지 발달":     "MOTOR_COGNITIVE",
          "사회성/인지/창의":   "SOCIAL_COGNITIVE",
          "생활습관":           "LIFESTYLE"
        };

        // 2) 카테고리별 카드
        Object.entries(categoryScores).forEach(([catName, score]) => {
          const pct    = score.toFixed(2);
          const isHigh = score >= 60;
          const card   = document.createElement("div");
          card.className = `p-4 rounded-lg border ${
            isHigh ? "border-orange-300 bg-orange-50" : "border-gray-200 bg-white"
          }`;

          let html = `
            <div class="flex justify-between items-center">
              <p class="font-semibold text-lg">${catName}</p>
              <p class="text-2xl font-bold ${
                isHigh ? "text-orange-600" : "text-green-700"
              }">${pct}%</p>
            </div>
          `;

          // 3) 60% 이상 & needsSpecial = true일 때만 버튼 추가
          if (isHigh && needsSpecial && childId && ageGroup) {
            const enumName = categoryEnumMap[catName];
            if (enumName) {
              const sp = new URLSearchParams({
                childId,
                ageGroup,
                categories: enumName
              });
              html += `
                <div class="mt-3 pt-3 border-t border-orange-200">
                  <p class="text-sm text-orange-800 mb-1">
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <strong>'${catName}'</strong> 항목에 대한 심층적인 확인이 권장됩니다.
                  </p>
                  <a href="/specialSurvey/by-risk?${sp.toString()}"
                     class="inline-block bg-orange-500 text-white px-4 py-1 rounded hover:bg-orange-600 text-sm font-bold">
                    특별 문진 시작하기
                  </a>
                </div>
              `;
            }
          }

          card.innerHTML = html;
          container.appendChild(card);
        });

        function goHome() {
          window.location.href = "/dailySurvey";
        }
    </script>
</th:block>
</html>
