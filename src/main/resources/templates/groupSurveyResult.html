<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데일리 문진 결과</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <h1 class="text-2xl font-bold mb-4">문진 결과</h1>
    <div id="result-container" class="space-y-4 mb-6"></div>
    <button onclick="goHome()"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        다시 문진하기
    </button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const riskScoresParam = params.get("riskScores");
        const childId      = params.get("childId");
        const ageGroup     = params.get("ageGroup");
        const needsSpecial = true; // 서버에서 내려주는 값에 맞춰 세팅하세요

        let data;
        try {
          data = JSON.parse(decodeURIComponent(riskScoresParam));
        } catch {
          document.getElementById("result-container").innerHTML =
            `<p class="text-red-500">결과를 불러오는 데 실패했습니다.</p>`;
          throw new Error("파싱 실패");
        }

        const { categoryScores = {}, totalRiskScore = 0 } = data;
        const mapEnum = {
          "의사소통/정서/심리": "COMMUNICATION",
          "운동/인지 발달":     "MOTOR_COGNITIVE",
          "사회성/인지/창의":   "SOCIAL_COGNITIVE",
          "생활습관":           "LIFESTYLE"
        };
        const container = document.getElementById("result-container");

        Object.entries(categoryScores).forEach(([name, score]) => {
          const pct = score.toFixed(2);
          const high = score >= 60;
          const div = document.createElement("div");
          div.className = `rounded-lg overflow-hidden border ${
            high ? 'border-orange-300 bg-orange-50' : 'border-gray-200 bg-white'
          }`;

          // 카드 내부 HTML
          let html = `
            <div class="px-4 py-3 flex justify-between items-center">
              <span class="font-semibold">${name}</span>
              <span class="text-xl font-bold ${high ? 'text-orange-600' : 'text-green-700'}">
                ${pct}%</span>
            </div>
          `;

          if (high && needsSpecial && childId && ageGroup) {
            const enumName = mapEnum[name];
            const sp = new URLSearchParams({
              childId, ageGroup, categories: enumName
            });
            html += `
              <div class="px-4 pb-4 pt-2 border-t border-orange-200">
                <p class="flex items-center text-sm text-orange-800 mb-2">
                  <i class="fas fa-exclamation-circle mr-2"></i>
                  <strong>'${name}'</strong> 항목에 대해 심층 확인이 권장됩니다.
                </p>
                <a href="/specialSurvey/by-risk?${sp}"
                   class="inline-block bg-orange-500 text-white px-4 py-1 rounded hover:bg-orange-600 text-sm font-bold">
                  특별 문진 시작하기
                </a>
              </div>
            `;
          }

          div.innerHTML = html;
          container.appendChild(div);
        });

        // 통합 위험도
        const overall = document.createElement("div");
        overall.className = "mt-6 text-lg font-bold";
        const count = Object.keys(categoryScores).length || 1;
        overall.textContent = `통합 위험도: ${(totalRiskScore / count).toFixed(2)}%`;
        container.appendChild(overall);

        function goHome() {
          window.location.href = "/dailySurvey";
        }
    </script>
</th:block>
</html>
