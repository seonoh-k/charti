<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 문진</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">

    <div class="max-w-5xl mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">[상담 신청]
            <span th:text="${category.displayName}" class="text-grey-600 font-semibold">생활습관</span></h1>

        <!-- 2) 자녀 정보 출력 -->
        <div class="mb-4">
            <p><strong>자녀 이름:</strong> <span th:text="${child.name}"></span></p>
            <p><strong>나이:</strong> <span th:text="${child.age}"></span>세</p>
        </div>

        <!-- 3) 상담 제목, 내용 입력 -->
        <form th:action="@{/matching}"
              th:object="${matchingRequest}"
              method="post"
              enctype="multipart/form-data">
            <input type="hidden" th:field="*{childId}" />
            <input type="hidden" th:field="*{category}" />
            <input type="hidden" th:field="*{type}" />

            <!-- 전체 질문/답변 아코디언 -->
            <details class="mb-6 border rounded-lg overflow-hidden">
                <!-- summary 클릭 시 펼쳐짐/닫힘 -->
                <summary class="px-4 py-3 bg-gray-100 cursor-pointer hover:bg-gray-200 font-medium">
                    질문 및 답변 보기
                </summary>
                <div class="px-4 py-4 space-y-4 bg-white">
                    <div th:each="ans : ${answers}">
                        <!-- 각 답변 ID를 hidden 으로 폼 전송 -->
                        <input type="hidden" name="answerIds" th:value="${ans.id}" />

                        <p class="font-semibold" th:text="${ans.question}">질문</p>
                        <p class="ml-2"      th:text="${ans.answer}">답변</p>
                        <hr/>
                    </div>
                </div>
            </details>

            <div class="mb-4">
                <label class="block font-semibold mb-1" for="title">제목</label>
                <input id="title" type="text" th:field="*{title}"
                       class="w-full border p-2 rounded" placeholder="상담 제목을 입력하세요" required />
            </div>

            <div class="mb-6">
                <label class="block font-semibold mb-1" for="content">내용</label>
                <textarea id="content" th:field="*{content}"
                          class="w-full border p-2 rounded h-32"
                          placeholder="상담 내용을 상세히 입력하세요" required></textarea>
            </div>

            <!-- 이미지 업로드 -->
            <div class="mb-4">
                <label class="block font-semibold mb-1" for="images">이미지 첨부</label>
                <input id="images"
                       type="file"
                       th:field="*{image}"
                       multiple
                       accept="image/*"
                       class="w-full"/>
            </div>

            <button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                상담 신청
            </button>
        </form>
    </div>

</th:block>
</html>
