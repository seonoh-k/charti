<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <title>상담 내역</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<th:block layout:fragment="content">
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">상담 내역</h1>

        <!-- 필터 폼 -->
        <form th:action="@{/matching}" method="get"
              class="mb-6 flex flex-wrap items-center space-x-3">
            <label class="font-semibold">상태:</label>
            <select name="status" class="border p-1 rounded">
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:selected="${s == currentStatus}"
                        th:text="|${s == 'ALL' ? '전체' : T(com.example.demo.enums.MatchingStatus).valueOf(s).displayName}|"/>
            </select>

            <label class="font-semibold">자녀:</label>
            <select name="childId" class="border p-1 rounded">
                <option value="">전체</option>
                <option th:each="c : ${children}"
                        th:value="${c.id}"
                        th:selected="${c.id == currentChildId}"
                        th:text="${c.name}"/>
            </select>

            <label class="font-semibold">제목:</label>
            <input type="text" name="keyword" placeholder="제목 검색"
                   th:value="${keyword}"
                   class="border p-1 rounded flex-1 min-w-[200px]"/>

            <button type="submit"
                    class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">
                조회
            </button>
        </form>

        <!-- 결과 테이블 -->
        <table class="min-w-full border-collapse">
            <thead>
            <tr class="bg-gray-100">
                <th class="border p-2">ID</th>
                <th class="border p-2">자녀</th>
                <th class="border p-2">카테고리</th>
                <th class="border p-2">제목</th>
                <th class="border p-2">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${matchings}" class="odd:bg-white even:bg-gray-50">
                <td class="border p-2" th:text="${m.id}"/>
                <td class="border p-2" th:text="${m.child.name}"/>
                <td class="border p-2" th:text="${m.category.displayName}"/>
                <td class="border p-2">
                    <a th:href="@{/matching/detail/{id}(id=${m.id})}"
                       th:text="${m.title}"
                       class="text-blue-600 hover:underline"/>
                </td>
                <td class="border p-2" th:text="${m.status.displayName}"/>
            </tr>

            <!-- 필터 결과가 없을 경우 -->
            <tr th:if="${matchings.empty}">
                <td class="border p-2 text-center" colspan="5">
                    조회된 상담이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>

        <!-- 페이징 -->
        <div th:if="${matchings.totalPages > 1}"
             class="mt-4 flex justify-center space-x-2">
            <a th:if="${matchings.hasPrevious()}"
               th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=${matchings.number-1})}"
               class="px-2 py-1 border rounded">이전</a>
            <span th:each="i : ${#numbers.sequence(0,matchings.totalPages-1)}">
        <a th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=${i})}"
           th:text="${i+1}"
           th:classappend="${i==matchings.number} ? ' font-bold underline' : ''"
           class="px-2 py-1 border rounded"/>
      </span>
            <a th:if="${matchings.hasNext()}"
               th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=${matchings.number+1})}"
               class="px-2 py-1 border rounded">다음</a>
        </div>
    </div>
</th:block>
</html>
