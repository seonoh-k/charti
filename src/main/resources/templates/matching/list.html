<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <title>상담 내역</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<th:block layout:fragment="content">
    <div class="flex gap-6 m-10">
        <aside class="w-[20%] p-4">
            <th:block th:replace="~{fragments/subMenu :: subMenuFragment}"></th:block>
        </aside>

        <main class="w-[75%] p-6 space-y-6 bg-white rounded-lg shadow">
            <h1 class="text-3xl font-bold mb-4">상담 내역</h1>

            <!-- 필터 폼 -->
            <form th:action="@{/matching}" method="get"
                  class="mb-6 flex flex-wrap items-center space-x-3">
                <label class="font-semibold">상태:</label>
                <select name="status" class="border p-1 rounded">
                    <option th:each="s : ${statuses}"
                            th:value="${s}"
                            th:selected="${s == currentStatus}"
                            th:text="|${s == 'ALL' ? '전체' : T(com.example.demo.enums.MatchingStatus).valueOf(s).displayName}|"/>
                </select>

                <label class="font-semibold">자녀:</label>
                <select name="childId" class="border p-1 rounded">
                    <option value="">전체</option>
                    <option th:each="c : ${children}"
                            th:value="${c.id}"
                            th:selected="${c.id == currentChildId}"
                            th:text="${c.name}"/>
                </select>

                <label class="font-semibold">제목:</label>
                <input type="text" name="keyword" placeholder="제목 검색"
                       th:value="${keyword}"
                       class="border p-1 rounded flex-1 min-w-[200px]"/>

                <button type="submit"
                        class="bg-[#E3A67A] text-white px-3 py-1 rounded hover:opacity-90">
                    조회
                </button>
            </form>

            <!-- 결과 테이블 -->
            <table class="min-w-full border-collapse">
                <thead>
                <tr class="bg-gray-100">
                    <th class="border p-2">ID</th>
                    <th class="border p-2">자녀</th>
                    <th class="border p-2">카테고리</th>
                    <th class="border p-2">제목</th>
                    <th class="border p-2">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${matchings}" class="odd:bg-white even:bg-gray-50">
                    <td class="border p-2" th:text="${m.id}"/>
                    <td class="border p-2" th:text="${m.child.name}"/>
                    <td class="border p-2" th:text="${m.category.displayName}"/>
                    <td class="border p-2">
                        <a th:href="@{/matching/detail/{id}(id=${m.id})}"
                           th:text="${m.title}"
                           class="text-blue-600 hover:underline"/>
                    </td>
                    <td class="border p-2" th:text="${m.status.displayName}"/>
                </tr>

                <!-- 필터 결과가 없을 경우 -->
                <tr th:if="${matchings.empty}">
                    <td class="border p-2 text-center" colspan="5">
                        조회된 상담이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- 페이징 -->
            <div class="mt-4 flex justify-center space-x-2">
                <a th:if="${matchings.hasPrevious()}"
                   th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=0)}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-double-left"></i>
                </a>
                <a th:if="${matchings.hasPrevious()}"
                   th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=${matchings.number -1})}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-left"></i>
                </a>

                <a th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, matchings.number - 4),
                    T(java.lang.Math).min(matchings.totalPages - 1, matchings.number+4))}"
                   th:href="@{/community/parenting/list(
                        page=${i},
                        sort=${sort},
                        subCategory=${subCategory},
                        ageGroup=${ageGroup},
                        keyword=${keyword})}"
                   th:classappend="${i == matchings.number} ? 'bg-[#E3A67A] text-white' : 'bg-gray-200 text-[#E3A67A]'"
                   th:text="${i+1}" class="px-3 py-1 rounded hover:bg-[#E3A67A] hover:text-white transition">
                    1
                </a>

                <a th:if="${matchings.hasNext()}"
                   th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=${matchings.number+1})}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-right"></i>
                </a>
                <a th:if="${matchings.hasNext()}"
                   th:href="@{/matching(status=${currentStatus},childId=${currentChildId},keyword=${keyword},page=${matchings.totalPages})}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-double-right"></i>
                </a>
            </div>
        </main>
    </div>
</th:block>
</html>
