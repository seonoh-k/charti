<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 문진</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-2xl mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">상담 상세</h1>

        <!-- 기본 정보 -->
        <section class="mb-6 border p-4 rounded bg-white">
            <p><strong>카테고리:</strong> <span th:text="${matching.category.displayName}"/></p>
            <p><strong>자녀:</strong> <span th:text="${matching.child.name}"/> (<span th:text="${matching.child.age}"/>세)</p>
            <p><strong>제목:</strong> <span th:text="${matching.title}"/></p>
            <p><strong>내용:</strong></p>
            <div class="mt-2 p-2 bg-gray-50 rounded" th:text="${matching.content}"/>

            <!-- 첨부 이미지 -->
            <div th:if="${photos != null and !photos.isEmpty()}">
                <h2 class="font-semibold mb-2">첨부 이미지</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <!-- photos 리스트에는 fileName 문자열이 들어있습니다 -->
                    <div th:each="fileName : ${photos}">
                        <img
                                th:src="@{/api/proxy/image(filename='thumbnail/' + ${fileName})}"
                                th:data-full="@{/api/proxy/image(filename='original/'  + ${fileName})}"
                                class="w-full h-32 object-cover rounded cursor-pointer thumbnail"
                                th:alt="${fileName}" />
                    </div>
                </div>
            </div>

            <!-- 모달 (한 번만 선언) -->
            <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
                <button id="image-modal-close"
                        class="absolute top-4 right-4 text-white text-2xl font-bold focus:outline-none">&times;</button>
                <img id="image-modal-img" src="" alt="원본 이미지"
                     class="max-h-[90%] max-w-[90%] rounded shadow-lg"/>
            </div>
        </section>

        <!-- 문진 질문/답변 아코디언 -->
        <details class="mb-6 border rounded">
            <summary class="px-4 py-2 bg-gray-100 cursor-pointer">문진 질문/답변</summary>
            <div class="p-4 space-y-4 bg-white">
                <div th:each="ans : ${matching.answers}">
                    <p class="font-semibold" th:text="${ans.question}"/>
                    <p class="ml-2" th:text="${ans.answer}"/>
                    <hr/>
                </div>
            </div>
        </details>

        <!-- 신청완료인 경우: 전문가 배정 폼 -->
        <div th:if="${matching.status.name() == 'REQUESTED'}" class="mb-6 border p-4 rounded bg-yellow-50">
            <h2 class="text-xl font-semibold mb-2">전문가 배정</h2>
            <form th:action="@{/admin/matching/{id}/assign(id=${matching.id})}" method="post" class="space-y-3">
                <label for="expert" class="block font-semibold">전문가 선택</label>
                <select id="expert" name="expertId" required class="w-full border p-2 rounded">
                    <option value="" disabled selected>배정할 전문가를 선택하세요</option>
                    <option th:each="e : ${experts}"
                            th:value="${e.id}"
                            th:text="${e.users.name + ' (' + e.users.nickname + ')'}">
                    </option>
                </select>
                <button type="submit"
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    배정 완료
                </button>
            </form>
        </div>

        <!-- 전문가가 배정된 이후: 부모용 상담 답변 보기 -->
        <div th:if="${matching.status.name() != 'REQUESTED'}" class="mb-6">
            <h2 class="text-xl font-semibold mb-2">전문가의 답변</h2>
            <div th:if="${#lists.isEmpty(answers)}">
                <p class="text-gray-600">아직 답변이 등록되지 않았습니다.</p>
            </div>
            <div th:each="a : ${answers}" class="border p-4 rounded bg-green-50">
                <p th:text="${a.content}"/>
                <p class="text-sm text-gray-500 mt-2"
                   th:text="${a.createdAt.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd HH:mm'))}"/>
            </div>
        </div>

    </div>

    <!-- 모달 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          const modal = document.getElementById('image-modal');
          const modalImg = document.getElementById('image-modal-img');
          const btnClose = document.getElementById('image-modal-close');

          document.querySelectorAll('.thumbnail').forEach(el => {
            el.addEventListener('click', () => {
              modalImg.src = el.dataset.full;
              modal.classList.remove('hidden');
              modal.classList.add('flex');
            });
          });

          btnClose.addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modalImg.src = '';
          });

          modal.addEventListener('click', e => {
            if (e.target === modal) btnClose.click();
          });
        });
    </script>

</th:block>
</html>
