<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <div class="flex gap-6 m-10">
        <aside class="w-[20%] p-4">
            <th:block th:replace="~{fragments/subMenu :: subMenuFragment}"></th:block>
        </aside>

        <main class="w-[75%] p-6 space-y-6 bg-white rounded-lg shadow">
            <div class="flex items-center mb-4">
                <!-- 제목 -->
                <h2 th:text="${matching.title}"
                    class="text-2xl font-bold mr-3">
                </h2>
                <!-- 카테고리 -->
                <span th:text="${matching.category.displayName}"
                      class="text-sm font-medium bg-gray-100 px-2 py-1 rounded">
                </span>
            </div>
            <!-- 기본 정보 -->
            <section class="mb-6 border p-4 rounded bg-white">
                <div class="mb-6 p-4 border rounded bg-gray-50">
                    <h2 class="text-lg font-semibold mb-2">자녀 정보</h2>
                    <p><strong>이름:</strong> <span th:text="${matching.child.name}"/></p>
                    <p><strong>성별:</strong>
                        <span th:switch="${matching.child.gender}">
                            <span th:case="'남'">남자</span>
                            <span th:case="'여'">여자</span>
                        </span>
                    </p>
                    <p><strong>나이:</strong> <span th:text="${matching.child.age}"/>세</p>
                    <p><strong>신장:</strong> <span th:text="${matching.child.height}"/></p>
                    <p><strong>체중:</strong> <span th:text="${matching.child.weight}"/></p>
                </div>

                <p><strong>내용</strong></p>
                <div class="mt-2 p-2 bg-gray-50 rounded mb-5"
                     th:text="${matching.content}"/>

                <!-- 문진 질문/답변 -->
                <details class="mb-6 border rounded">
                    <summary class="px-4 py-2 bg-gray-100 cursor-pointer">문진 질문/답변</summary>
                    <div class="p-4 space-y-4 bg-white">
                        <div th:each="ans : ${matching.answers}">
                            <p class="font-semibold" th:text="${ans.question}"/>
                            <p class="ml-2" th:text="${ans.answer}"/>
                            <hr/>
                        </div>
                    </div>
                </details>

                <!-- 첨부 이미지 -->
                <div th:if="${photos != null and !photos.isEmpty()}">
                    <h2 class="font-semibold mb-2">첨부 이미지</h2>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div th:each="fileName : ${photos}">
                            <img th:src="@{/api/proxy/image(filename='thumbnail/' + ${fileName})}"
                                 th:data-full="@{/api/proxy/image(filename='original/' + ${fileName})}"
                                 class="w-full h-32 object-cover rounded cursor-pointer thumbnail"
                                 th:alt="${fileName}"/>
                        </div>
                    </div>
                    <!-- 모달 -->
                    <div id="image-modal"
                         class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
                        <button id="image-modal-close"
                                class="absolute top-4 right-4 text-white text-2xl font-bold">&times;</button>
                        <img id="image-modal-img" src="" alt="원본 이미지"
                             class="max-h-[90%] max-w-[90%] rounded shadow-lg"/>
                    </div>
                </div>
            </section>

            <!-- 매칭 전 안내 -->
            <div th:if="${matching.status.name() == 'REQUESTED'}" class="mb-6 p-4 bg-yellow-50 rounded">
                <p class="text-gray-700">아직 전문가 매칭이 되지 않았습니다.</p>
            </div>

            <!-- 전문가 답변 (배정된 이후) -->
            <div th:if="${matching.status.name() != 'REQUESTED'}" class="mb-6">
                <h2 class="text-xl font-semibold mb-2">전문가의 답변</h2>

                <!-- 아직 답변이 없으면 -->
                <div th:if="${#lists.isEmpty(expertAnswers)}" class="p-4 bg-gray-50 rounded">
                    <p class="text-gray-600">아직 전문가가 답변하지 않았습니다.</p>
                </div>

                <!-- 답변이 있으면 -->
                <div th:each="ea : ${expertAnswers}" class="border p-4 rounded bg-green-50 mt-4">
                    <p th:text="${ea.content}"/>
                    <p class="text-sm text-gray-500 mt-2"
                       th:text="${#temporals.format(ea.createdAt, 'yyyy-MM-dd HH:mm')}"/>
                </div>
            </div>

            <div class="flex justify-center mt-6">
                <a href="/matching" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow">목록</a>
            </div>
        </main>
    </div>

    <!-- 이미지 모달 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('image-modal-img');
            const btnClose = document.getElementById('image-modal-close');
            document.querySelectorAll('.thumbnail').forEach(el => {
                el.addEventListener('click', () => {
                    modalImg.src = el.dataset.full;
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                });
            });
            btnClose.addEventListener('click', () => {
                modal.classList.add('hidden');
                modalImg.src = '';
            });
            modal.addEventListener('click', e => {
                if (e.target === modal) btnClose.click();
            });
        });
    </script>
</th:block>
</html>
