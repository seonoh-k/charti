<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특별 문진 결과</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>

<th:block layout:fragment="content">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6">특별 문진 결과</h1>

        <div id="resultContainer" class="space-y-6">
        </div>

        <div class="mt-8">
            <button onclick="history.back()"
                    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                다시 문진하기
            </button>
        </div>
    </div>

    <script>
        // URL에서 결과 데이터 파싱
        const params = new URLSearchParams(window.location.search);
        const dataParam = params.get("data");
        let result;
        try {
          result = JSON.parse(decodeURIComponent(dataParam));
        } catch (e) {
          console.error("결과 파싱 실패", e);
          document.getElementById("resultContainer").innerHTML = `<p class="text-red-500">결과를 불러오는 데 실패했습니다.</p>`;
          throw e;
        }

        const { categoryScores, needsMatching, childId, category, answerIds } = result;
        const container = document.getElementById("resultContainer");
        container.innerHTML = ''; // 컨테이너 초기화

        // 카테고리별 결과 표시
        for (const [catDisplayName, score] of Object.entries(categoryScores)) {
            const isHighRisk = score >= 60;

            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = `p-4 border rounded-lg ${isHighRisk ? 'border-red-300 bg-red-50' : 'border-gray-200 bg-white'}`;

            let contentHTML = `
                <div class="flex justify-between items-center">
                    <p class="font-semibold text-lg">${catDisplayName}</p>
                    <p class="text-2xl font-bold ${isHighRisk ? 'text-red-600' : 'text-green-700'}">${score.toFixed(2)}%</p>
                </div>
            `;

            // [핵심 수정] 'needsMatching'이 true이고, answerIds가 있을 때만 버튼 생성
            if (needsMatching && answerIds && answerIds.length > 0) {
                // answerId 목록을 쿼리 스트링으로 변환 (e.g., &answerId=1&answerId=2)
                const answerIdQuery = answerIds.map(id => `answerId=${id}`).join('&');

                // 최종 매칭 요청 URL 생성 (category는 ENUM 이름이어야 함)
                const matchingUrl = `/matching/${category}/request?childId=${childId}&${answerIdQuery}`;

                contentHTML += `
                    <div class="mt-3 pt-3 border-t border-red-200">
                        <p class="text-sm text-red-800">
                            <i class="fas fa-exclamation-triangle mr-1"></i>
                            <strong>'${catDisplayName}'</strong> 항목에 대한 전문가의 심층 상담이 필요할 수 있습니다.
                        </p>
                        <p class="text-xs text-gray-600 mt-1">아래 버튼을 눌러 전문가 매칭을 요청하세요.</p>
                        <a href="${matchingUrl}" class="mt-2 inline-block bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600 text-sm font-bold">
                            전문가 상담 신청하기
                        </a>
                    </div>
                `;
            }

            wrapperDiv.innerHTML = contentHTML;
            container.appendChild(wrapperDiv);
        }
    </script>
</th:block>
</html>
