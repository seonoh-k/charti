<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Special Survey 통합 테스트</title>
    <style>
        section { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Special Survey 통합 테스트</h2>

<!-- 1. 신규 문진 등록 -->
<section>
    <h3>1. 신규 문진 등록</h3>
    <input placeholder="문항" id="newSpecialQuestion" style="width:300px">
    <select id="newSpecialAgeGroup">
        <option value="">연령대 선택</option>
        <option value="0~12개월">0~12개월</option>
        <option value="1~2세">1~2세</option>
        <option value="3~4세">3~4세</option>
        <option value="5세">5세</option>
    </select>
    <select id="newSpecialCategory">
        <option value="">카테고리 선택</option>
        <option value="의사소통/정서/심리">의사소통/정서/심리</option>
        <option value="운동/인지 발달">운동/인지 발달</option>
        <option value="사회성/인지/창의">사회성/인지/창의</option>
        <option value="생활습관">생활습관</option>
    </select>
    <input id="newSpecialWeight" placeholder="가중치" type="number">
    <br>
    <input placeholder="답변1" id="sa1">
    <input placeholder="답변2" id="sa2">
    <input placeholder="답변3" id="sa3">
    <input placeholder="답변4" id="sa4">
    <input placeholder="답변5" id="sa5">
    <br>
    <input placeholder="선택된 답변" id="specialSelectedAnswer">
    <input placeholder="계산 점수" id="specialCalculatedScore" type="number">
    <br>
    <input placeholder="세트 ID (연결할 survey_set_id)" id="specialSurveySetId">
    <button onclick="registerSpecialSurvey()">등록</button>
</section>

<!-- 2. 연령대 문진 조회 -->
<section>
    <h3>2. 연령대 문진 조회</h3>
    <select id="specialAgeGroup">
        <option value="">-- 선택 --</option>
        <option value="0~12개월">0~12개월</option>
        <option value="1~2세">1~2세</option>
        <option value="3~4세">3~4세</option>
        <option value="5세">5세</option>
    </select>
    <button onclick="loadSpecialByAge()">불러오기</button>
    <div id="specialAgeSurveyContainer"></div>
</section>

<!-- 3. 카테고리 문진 조회 -->
<section>
    <h3>3. 카테고리 문진 조회</h3>
    <select id="specialCategory">
        <option value="">-- 선택 --</option>
        <option value="의사소통/정서/심리">의사소통/정서/심리</option>
        <option value="운동/인지 발달">운동/인지 발달</option>
        <option value="사회성/인지/창의">사회성/인지/창의</option>
        <option value="생활습관">생활습관</option>
    </select>
    <button onclick="loadSpecialByCategory()">불러오기</button>
    <div id="specialCategorySurveyContainer"></div>
</section>

<!-- 4. 문진 삭제 -->
<section>
    <h3>4. 문진 삭제</h3>
    <input placeholder="삭제할 ID" id="deleteSpecialId">
    <button onclick="deleteSpecialSurvey()">삭제</button>
</section>

<script>
    function registerSpecialSurvey() {
        const dto = {
            ageGroup: document.getElementById("newSpecialAgeGroup").value,
            category: document.getElementById("newSpecialCategory").value,
            question: document.getElementById("newSpecialQuestion").value,
            weight: +document.getElementById("newSpecialWeight").value,
            answer1: document.getElementById("sa1").value,
            answer2: document.getElementById("sa2").value,
            answer3: document.getElementById("sa3").value,
            answer4: document.getElementById("sa4").value,
            answer5: document.getElementById("sa5").value,
            selectedAnswer: document.getElementById("specialSelectedAnswer").value,
            calculatedScore: +document.getElementById("specialCalculatedScore").value
        };

        const surveySetId = +document.getElementById("specialSurveySetId").value;

        fetch(`/api/special-surveys?surveySetId=${surveySetId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=UTF-8" },
            body: JSON.stringify(dto)
        }).then(() => alert("Special 문진 등록 및 세트 연동 완료"));
    }

    function renderSpecialSurveyList(surveys, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        surveys.forEach((s, idx) => {
            container.innerHTML += `<p><strong>${idx + 1}.</strong> ${s.question}</p><hr>`;
        });
    }

    function loadSpecialByAge() {
        const ageGroup = document.getElementById("specialAgeGroup").value;
        fetch(`/api/special-surveys/by-age/${ageGroup}`)
            .then(r => r.json())
            .then(data => renderSpecialSurveyList(data, "specialAgeSurveyContainer"));
    }

    function loadSpecialByCategory() {
        const category = document.getElementById("specialCategory").value;
        fetch(`/api/special-surveys?category=${category}`)
            .then(r => r.json())
            .then(data => renderSpecialSurveyList(data, "specialCategorySurveyContainer"));
    }

    function deleteSpecialSurvey() {
        const id = document.getElementById("deleteSpecialId").value;
        fetch(`/api/special-surveys/${id}`, { method: "DELETE" })
            .then(() => alert("삭제 완료"));
    }
</script>
</body>
</html>
