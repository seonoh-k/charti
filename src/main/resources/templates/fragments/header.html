<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Charti</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard & Inter 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: 'Pretendard', 'Inter', sans-serif; }
    </style>
</head>
<th:block th:fragment="headerFragment">
    <header id="header" th:fragment="fragment-header" class="sticky top-0 bg-white z-50 shadow">
        <!-- 상단: 로고 + 로그인/회원가입 -->
        <div class="container mx-auto flex justify-between items-center py-4 px-6 mb-3">
            <img id="homeLogo" th:src="@{/images/logo02.png}" onclick="location.href='/'"
                 class="w-[150px] h-auto cursor-pointer"/>
            <nav id="hdNav" class="mt-6">
                <ul id="hdUl" class="flex gap-6 items-center">
                    <li><a id="joinBtn" href="/JoinForm">회원가입</a></li>
                    <li><a id="loginBtn" href="/loginForm">로그인</a></li>
                    <li><span id="welcomeText" class="hidden text-gray-700 font-semibold"></span></li>
                    <li><a id="mypagenBtn" href="/mypage" class="hidden">마이페이지</a></li>
                    <li><a id="logoutBtn" href="/logout" class="hidden">로그아웃</a></li>
                    <!-- 알림 아이콘 -->
                    <div th:insert="fragments/notice :: noticeBell"></div>
                </ul>
            </nav>
        </div>

        <!-- 하단 메뉴바 -->
        <nav class="bg-[#B78E68] text-white">
            <div class="container mx-auto flex justify-center items-center py-1 px-8">
                <ul class="flex space-x-12">
                    <button>
                        <a href="/" class="block p-4 text-md hover:text-[#FEF9F3] whitespace-nowrap">홈</a>
                    </button>
                    <button>
                        <a href="/about" class="block p-4 text-md hover:text-[#FEF9F3] whitespace-nowrap">About</a>
                    </button>
                    <!-- 문진표 -->
                    <li class="relative group">
                        <button class="block p-4 text-md hover:text-[#FEF9F3] whitespace-nowrap">문진</button>
                        <ul class="absolute top-full left-1/2 -translate-x-1/2 hidden group-hover:block bg-black bg-opacity-70 text-white shadow-lg mt-1 min-w-[180px] text-center z-50 py-2">
                            <li><a href="/survey/record" class="block px-4 py-2 hover:text-gray-300">기록 문진 작성</a></li>
                            <li><a href="/dailySurvey" class="block px-4 py-2 hover:text-gray-300">데일리 문진 작성</a></li>
                            <li><a href="/survey/history" class="block px-4 py-2 hover:text-gray-300">작성 이력 보기</a></li>
                        </ul>
                    </li>
                    <!-- 진단요청 -->
                    <li>
                        <a href="/albumList" class="block p-4 text-md hover:text-[#FEF9F3] whitespace-nowrap">앨범</a>
                    </li>
                    <li class="relative group">
                        <a href="/community/allPosts/list" class="block p-4 text-md hover:text-[#FEF9F3] whitespace-nowrap">커뮤니티</a>
                        <ul class="absolute top-full left-1/2 -translate-x-1/2 hidden group-hover:block bg-black bg-opacity-70 text-white shadow-lg mt-1 min-w-[180px] text-center z-50 py-2">
                            <li><a href="/community/allPosts/list"  class="block px-4 py-2 hover:text-gray-300">전체 글</a></li>
                            <li><a href="/community/announcement/list"  class="block px-4 py-2 hover:text-gray-300">공지사항</a></li>
                            <li><a href="/community/parenting/list"  class="block px-4 py-2 hover:text-gray-300">육아정보</a></li>
                            <li><a href="/community/policy/list"  class="block px-4 py-2 hover:text-gray-300">정책정보</a></li>
                        </ul>
                    </li>
                    <!-- 고객센터 -->
                    <li class="relative group">
                        <button class="block p-4 text-md hover:text-[#FEF9F3] whitespace-nowrap">고객센터</button>
                        <ul class="absolute top-full left-1/2 -translate-x-1/2 hidden group-hover:block bg-black bg-opacity-70 text-white shadow-lg mt-1 min-w-[180px] text-center z-50 py-2">
                            <li><a href="/announcement" class="block px-4 py-2 hover:text-blue-100">공지사항</a></li>
                            <li><a href="/faq"          class="block px-4 py-2 hover:text-blue-100">FAQ</a></li>
                            <li><a href="/qna"          class="block px-4 py-2 hover:text-blue-100">1:1문의</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/api/users/me", {
                method: "GET",
                credentials: "include"  // 쿠키 자동 전송
            })
            .then(response => {
                if (!response.ok) throw new Error("Not logged in");
                return response.json();
            })
            .then(user => {
                // 로그인된 경우 UI 수정
                document.getElementById("loginBtn")?.classList.add("hidden");
                document.getElementById("joinBtn")?.classList.add("hidden");
                const welcomeText = document.getElementById("welcomeText");
                if (welcomeText) {
                    welcomeText.textContent = `${user.nickname || user.name}님, 환영합니다!`;
                    welcomeText.classList.remove("hidden");
                }
                document.getElementById("mypagenBtn")?.classList.remove("hidden");
                document.getElementById("logoutBtn")?.classList.remove("hidden");

                // 사용자 닉네임 출력 등 추가 로직 가능
                console.log("👤 로그인 사용자:", user.nickname || user.name);
            })
            .catch(() => {
                // 로그인 안 된 경우: 마이페이지/로그아웃 숨김
                document.getElementById("mypagenBtn")?.classList.add("hidden");
                document.getElementById("logoutBtn")?.classList.add("hidden");
                document.getElementById("loginBtn")?.classList.remove("hidden");
                document.getElementById("joinBtn")?.classList.remove("hidden");
            });

            // 로그아웃 처리
            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    // 서버 요청
                    fetch("/api/users/delete", {
                        method: "DELETE",
                        credentials: "include"
                    }).then(() => {
                        document.cookie = "token=; Path=/; Max-Age=0";
                        window.location.href = "/";
                    });
                });
            }
        });
    </script>

</th:block>
</html>
