    <!-- src/main/resources/templates/fragments/termsCheckboxes.html -->
    <!-- 전체 약관 섹션 프래그먼트 (termsSection) -->
    <div th:fragment="termsSection" class="border rounded-lg bg-white text-gray-800 p-4 max-w-md mx-auto">
    <!-- 전체 동의 -->
    <div class="flex items-center mb-2">
        <input id="agreeAll" type="checkbox" class="h-4 w-4 text-purple-600 border-gray-300 rounded" />
        <label for="agreeAll" class="ml-2 font-medium">전체 동의</label>
    </div>
    <hr class="mb-2" />
    <!-- 개별 약관 항목 -->
    <div class="space-y-3 pl-6">
        <!-- 공통 약관 -->
        <div th:insert="this :: commonTerms"></div>
        <!-- 전문가 추가 약관 (expertForm 모델 존재 시) -->
        <div th:insert="this :: expertExtraTerms" th:if="${expertForm != null}"></div>
        <!-- 담당자 추가 약관 (managerForm 모델 존재 시) -->
        <div th:insert="this :: managerExtraTerms" th:if="${managerForm != null}"></div>
    </div>
    </div>

    <!-- 약관 스크립트 프래그먼트 (termsScript) -->
    <script th:fragment="termsScript">
    document.addEventListener('DOMContentLoaded', () => {
        const agreeAll    = document.getElementById('agreeAll');
        const indivChecks = document.querySelectorAll('.individual');
        const submitBtn   = document.getElementById('submitBtn');

        function updateSubmit() {
        const reqOk = Array.from(indivChecks)
            .filter(cb => cb.hasAttribute('required'))
            .every(cb => cb.checked);
        submitBtn.disabled = !reqOk;
        }

        agreeAll.addEventListener('change', () => {
        indivChecks.forEach(cb => cb.checked = agreeAll.checked);
        updateSubmit();
        });

        indivChecks.forEach(cb => cb.addEventListener('change', () => {
        const allChecked = Array.from(indivChecks).every(cb => cb.checked);
        agreeAll.checked = allChecked;
        updateSubmit();
        }));

        updateSubmit();
    });
    </script>

    <!-- 공통 약관 체크박스 프래그먼트 -->
    <div th:fragment="commonTerms(*{agreeServiceTerms},*{agreePrivacyPolicy},*{agreeChildInfo},*{agreeLegalGuardian},*{agreeMarketing})"
        class="space-y-2 text-sm text-gray-700">
    <div class="flex items-center justify-between">
        <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeServiceTerms}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeServiceTerms" />
        <label for="agreeServiceTerms" class="ml-2">(필수) 서비스 이용약관 동의</label>
        </div>
        <a th:href="@{/terms/service}" target="_blank" class="text-gray-400 hover:text-gray-600">&gt;</a>
    </div>
    <div class="flex items-center justify-between">
        <div class="flex items-center">
        <input type="checkbox" th:field="*{agreePrivacyPolicy}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreePrivacyPolicy" />
        <label for="agreePrivacyPolicy" class="ml-2">(필수) 개인정보 수집·이용 동의</label>
        </div>
        <a th:href="@{/terms/privacy}" target="_blank" class="text-gray-400 hover:text-gray-600">&gt;</a>
    </div>
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeChildInfo}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeChildInfo" />
        <label for="agreeChildInfo" class="ml-2">(필수) 아동 정보 수집·처리 동의</label>
    </div>
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeLegalGuardian}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeLegalGuardian" />
        <label for="agreeLegalGuardian" class="ml-2">(필수) 만 14세 미만 아동 법정대리인 동의</label>
    </div>
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeMarketing}" class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeMarketing" />
        <label for="agreeMarketing" class="ml-2">(선택) 마케팅 정보 수신 동의</label>
    </div>
    </div>

    <!-- 전문가 추가 약관 체크박스 프래그먼트 -->
    <div th:fragment="expertExtraTerms(*{agreeExpertLicense},*{agreeExpertLiability})"
        class="space-y-2 text-sm text-gray-700">
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeExpertLicense}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeExpertLicense" />
        <label for="agreeExpertLicense" class="ml-2">(필수) 자격증 진위 확인 및 정보 이용 동의</label>
    </div>
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeExpertLiability}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeExpertLiability" />
        <label for="agreeExpertLiability" class="ml-2">(필수) 전문가 책임 범위 및 면책 조항 확인</label>
    </div>
    </div>

    <!-- 담당자 추가 약관 체크박스 프래그먼트 -->
    <div th:fragment="managerExtraTerms(*{agreeManagerOrgInfo},*{agreeManagerDataSync})"
        class="space-y-2 text-sm text-gray-700">
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeManagerOrgInfo}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeManagerOrgInfo" />
        <label for="agreeManagerOrgInfo" class="ml-2">(필수) 기관 정보 제공 및 확인 동의</label>
    </div>
    <div class="flex items-center">
        <input type="checkbox" th:field="*{agreeManagerDataSync}" required class="individual h-4 w-4 text-purple-600 border-gray-300 rounded" id="agreeManagerDataSync" />
        <label for="agreeManagerDataSync" class="ml-2">(필수) 내부 시스템 데이터 동기화 동의</label>
    </div>
    </div>
