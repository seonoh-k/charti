    <!-- 헤더 (햄버거 버튼) -->

	<div th:fragment="hamburger">
        <header class="flex justify-start items-center bg-gray-100 h-8 px-4">
            <button id="hamburgerBtn" onclick="openSidebar()" class="text-gray-700 text-2xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>
        <!-- <button id="hamburgerBtn" onclick="openSidebar()" class="text-gray-700 text-2xl fixed top-3 left-3 z-50 md:hidden">
            <i class="fa-solid fa-bars"></i>
        </button> -->
        
	</div>
	<!-- 여기 part2 조각 있습니다 가져다가 쓰세요-->
	<div th:fragment="sideBar">

        <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-gray-800 text-white p-4 space-y-2 z-40 overflow-y-auto hidden opacity-75">
            <!-- X 닫기 버튼 -->
            <div class="flex justify-end mb-2">
                <button onclick="closeSidebar()" class="text-white text-xl">

            </div>

            <div class="flex justify-center">

            <ul class="space-y-2 text-sm">
                <li><a th:href="@{/admin/main}" class="block hover:bg-gray-700 px-2 py-1 rounded">홈</a></li>

                <li>

                    <ul id="menu1" class="hidden ml-4 mt-1 space-y-1">

                    </ul>
                </li>
                <li>
                    <button onclick="toggleAccordion('menu2')" class="w-full text-left hover:bg-gray-700 px-2 py-1 rounded flex justify-between items-center">

                    <ul id="menu2" class="hidden ml-4 mt-1 space-y-1">

                        <li><a th:href="@{/admin/users/all/deleted}" class="block px-2 py-1 hover:underline">탈퇴 회원</a></li>
                    </ul>
                </li>

                <li>
                    <button onclick="toggleAccordion('menu3')" class="w-full text-left hover:bg-gray-700 px-2 py-1 rounded flex justify-between items-center">

                    </button>
                    <ul id="menu3" class="hidden ml-4 mt-1 space-y-1">
                        <li><a href="#" class="block px-2 py-1 hover:underline">데일리 문진 관리</a></li>
                        <li><a href="#" class="block px-2 py-1 hover:underline">데일리 문진 발송</a></li>

                        <li><a href="#" class="block px-2 py-1 hover:underline">그룹 문진 관리</a></li>
                        <li><a href="#" class="block px-2 py-1 hover:underline">그룹 문진 발송</a></li>
                    </ul>
                </li>

                <li>

                    </button>
                    <ul id="menu4" class="hidden ml-4 mt-1 space-y-1">

                    </button>
                    <ul id="menu5" class="hidden ml-4 mt-1 space-y-1">
                        <li><a href="/admin/qna" class="block px-2 py-1 hover:underline">1:1 문의 관리</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
