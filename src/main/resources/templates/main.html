<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인 페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center">
<div class="bg-white shadow-lg rounded-xl p-10 text-center w-full max-w-md">
  <h1 class="text-3xl font-bold mb-4">🎉 메인 페이지</h1>
  <p class="text-lg mb-6">로그인을 성공하셨습니다! [[${email}]]</p>
  <p class="text-lg mb-6">당신의 권한은 :  [[${role}]]</p>

  <!-- 주요 페이지 네비게이션 -->
  <div class="grid grid-cols-2 gap-4 mb-6">
    <a th:href="@{/member}"  class="block bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">유저</a>
    <a th:href="@{/manager}" class="block bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">매니저</a>
    <a th:href="@{/expert}"  class="block bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">전문가</a>
    <a th:href="@{/admin}"   class="block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">관리자</a>
  </div>

  <!-- 역할 업데이트 액션 -->
  <div class="grid grid-cols-2 gap-4 mb-6">
    <a th:href="@{/updateRole/member}"  class="block bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition">유저로 변경</a>
    <a th:href="@{/updateRole/manager}" class="block bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition">매니저로 변경</a>
    <a th:href="@{/updateRole/expert}"  class="block bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition">전문가로 변경</a>
    <a th:href="@{/updateRole/admin}"   class="block bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition">관리자로 변경</a>
  </div>

  <!-- 홈으로가기 , 로그아웃 -->
  <div class="grid grid-cols-2 gap-4 mb-6">
    <a th:href="@{/}" class="block bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition">
      🏠 메인으로
    </a>
    <a th:href="@{/logout}" class="block bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">
      로그아웃
    </a>
        <a th:href="@{/myInfo}" class="block bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">
      임시마이페이지
    </a>
  </div>
</div>


<script type="module">
  // Firebase 구성 및 초기화
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsnvbbi1SQSHe9v3Nzt7R23eELXlv4KMI",
    authDomain: "charti-5da7d.firebaseapp.com",
    projectId: "charti-5da7d",
    messagingSenderId: "308166362794",
    appId: "1:308166362794:web:00035f97aca288228972d3"
  };

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  navigator.serviceWorker.register('/firebase-messaging-sw.js')
    .then((registration) => {
      console.log("✅ ServiceWorker 등록 완료:", registration);

      // VAPID 키를 이용해 토큰 요청
      return getToken(messaging, {
        vapidKey: "BCOstAjMQL4pjgMa7JNdlE_TX8zgAB2_Ke2ku53BMIZYVJJDpkMmB00wSMsp5K_H8Fog850yst8s662FLlAvcWY",
        serviceWorkerRegistration: registration
      });
    })
    .then((token) => {
      console.log("🔥 FCM 웹 토큰:", token);
      // TODO: 서버로 token 전송
    })
    .catch((err) => {
      console.error("❌ 알림 권한 요청 실패:", err);
    });

  onMessage(messaging, (payload) => {
    console.log('📩 Foreground 메시지 수신:', payload);
  });
</script>

</body>
</html>
