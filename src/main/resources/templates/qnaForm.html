<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">문의글 작성</h1>
        <hr class="mb-8 border-gray-300">

        <div class="bg-white shadow-lg rounded-lg p-8">
            <form id="qnaForm" class="space-y-6">
                <div class="flex gap-4">
                    <!-- 카테고리 선택 -->
                    <div class="w-1/6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            카테고리
                        </label>
                        <select name="category" id="category"
                                class="block w-full py-2 px-3 border border-gray-300 rounded-md
                             shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500
                             transition duration-150 ease-in-out">
                            <option value="" disabled selected>카테고리</option>
                            <option th:each="category : ${category}"
                                    th:value="${category.name()}"
                                    th:text="${category.displayName}"></option>
                        </select>
                    </div>

                    <!-- 제목 입력 -->
                    <div class="w-5/6">
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
                            제목
                        </label>
                        <input type="text" id="title" name="title"
                               class="block w-full py-2 px-3 border border-gray-300 rounded-md
                            shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2
                            focus:ring-blue-500 transition duration-150 ease-in-out"
                               placeholder="제목을 입력해 주세요">
                    </div>
                </div>

                <!-- 내용 -->
                <div>
                    <label for="content" class="block text-sm font-medium text-gray-700 mb-1">
                        내용
                    </label>
                    <textarea id="content" name="content" rows="10"
                              class="block w-full py-2 px-3 border border-gray-300 rounded-md
                           shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2
                           focus:ring-blue-500 transition duration-150 ease-in-out"
                              placeholder="문의하실 내용을 적어주세요"></textarea>
                </div>

                <!-- 버튼 -->
                <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                    <button type="button" id="cancelBtn" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-md
                            hover:bg-gray-300 transition duration-150 ease-in-out">
                        취소
                    </button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-md
                         hover:bg-blue-700 focus:outline-none focus:ring-2
                         focus:ring-blue-400 transition duration-150 ease-in-out">
                        등록
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const qnaForm = document.querySelector("#qnaForm");
            qnaForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const category = document.querySelector("#category").value;
                const title = document.querySelector("#title").value.trim();
                const content = document.querySelector("#content").value.trim();

                const formData = new FormData();
                formData.append("category", category);
                formData.append("title", title);
                formData.append("content", content);

                const res = await fetch("/api/qna/create", {
                    method: "POST",
                    body: formData
                });

                if(!res.ok) {
                    alert("문의글 등록에 실패했습니다. 다시 시도해두세요.");
                    qnaForm.reset();
                }else {
                    const data = await res.json();
                    window.location.href = `/qna/${data.data}`;
                }
            })
        })
    </script>
</th:block>
</html>
