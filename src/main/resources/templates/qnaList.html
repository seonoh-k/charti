<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">1:1 문의</h1>
        <div class="relative p-4 mb-6">
            <div class="absolute top-0 right-0 mb-3 p-2 bg-blue-500 rounded-lg inline-flex items-center space-x-4">
                <a href="/qna/create" class="text-white text-xl">
                    문의하기
                </a>
            </div>
        </div>
        <hr class="mb-8 border-gray-300">

        <div class="w-1/4 mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                카테고리
            </label>
            <select name="category" id="category"
                    class="block w-full py-2 px-3 border border-gray-300 rounded-md
                             shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500
                             transition duration-150 ease-in-out">
                <option value="" th:selected="${selectedCategory == null}">전체</option>
                <option th:each="category : ${category}"
                        th:value="${category.name()}"
                        th:text="${category.displayName}"
                        th:selected="${category == selectedCategory}"></option>
            </select>
        </div>

        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="min-w-full divide-y divide-gray-200 table-fixed">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="w-[10%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            번호
                        </th>
                        <th class="w-[55%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            제목
                        </th>
                        <th class="w-[10%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            공개여부
                        </th>
                        <th class="w-[10%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            작성자
                        </th>
                        <th class="w-[15%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            작성일
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="qna : ${qnaList}">
                        <td th:text="${qna.id}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <a th:href="@{/qna/{id}(id=${qna.id})}" th:text="${qna.title}"
                               class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></a>
                        </td>
                        <td th:text="${qna.isPublic ? '공개' : '비공개' }"
                            class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></td>
                        <td th:text="${qna.nickname != null ? qna.nickname : qna.name }"
                            class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></td>
                        <td th:text="${qna.createdAt}"
                            class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-center">
            <nav id="pagination"
                 th:data-current-page="${currentPage}"
                 th:data-total-pages="${totalPages}"
                 class="inline-flex space-x-2">

            </nav>
        </div>
    </div>
    <script>

        document.addEventListener("DOMContentLoaded", () => {
            const cat = document.querySelector("#category");
            const selectedCategory = cat.value;
            const nav = document.querySelector("#pagination");
            const current = Number(nav.dataset.currentPage);
            const total = Number(nav.dataset.totalPages);

            function pageBtn(label, page, option = {}) {
                const { active = false, disabled = false, category = "" } = option;
                const a = document.createElement("a");

                a.className = "px-3 py-1 rounded hover:bg-[#E3A67A] hover:text-white transition"

                if(typeof label === "number") {
                    a.textContent = label;
                }else if(label === "first") {
                    const i = document.createElement("i");
                    i.className = "fas fa-angle-double-left";
                    a.appendChild(i)
                }else if(label === "end") {
                    const i = document.createElement("i");
                    i.className = "fas fa-angle-double-right";
                    a.appendChild(i)
                }else {
                    const i = document.createElement("i");
                    i.className = label === "left" ? "fas fa-angle-left" : "fas fa-angle-right";
                    a.appendChild(i)
                }

                if(active) {
                    a.classList.add("bg-[#E3A67A]", "text-white");
                }else {
                    a.classList.add("bg-gray-200", "text-[#E3A67A]");
                }

                if(disabled) {
                    a.href = "javascript:;";
                    a.classList.add("hidden");
                }else {
                    if(category) {
                        a.classList.remove("hidden");
                        a.href = `?category=${category}&page=${page}`;
                    }else {
                        a.classList.remove("hidden");
                        a.href = `?page=${page}`;
                    }
                }

                return a;
            }

            cat.addEventListener("change", async (e) => {
                const selected = e.target.value;

                window.location.href = `/qna?category=${selected}&page=1`;
            })

            nav.appendChild(pageBtn("first", 1, {
                disabled: current === 1,
                category: selectedCategory
            }));

            nav.appendChild(pageBtn("left", current-1, {
                disabled: current === 1,
                category: selectedCategory
            }));

            for(let p=1; p<=total; p++) {
                nav.appendChild(pageBtn(p, p, {
                    active: p === current,
                    category: selectedCategory
                }));
            }

            nav.appendChild(pageBtn("right", current+1, {
                disabled: current === total,
                category: selectedCategory
            }));

            nav.appendChild(pageBtn("end", total, {
                disabled: current === total,
                category: selectedCategory
            }));

        })
    </script>
</th:block>
</html>
