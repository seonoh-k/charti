<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6">
        <div class="relative flex items-center justify-between">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">1:1 문의</h1>
        </div>
        <hr class="mb-8 border-gray-300">

        <div class="space-y-6">
            <div class="flex gap-4">
                <div class="w-1/5">
                    <p class="text-sm font-medium text-gray-700 mb-1">작성일</p>
                    <p th:text="${anc.createdAt}" class="py-2 px-3 text-center bg-gray-100 rounded-md"></p>
                </div>
                <div class="w-4/5"></div>
            </div>

            <div>
                <p class="text-sm font-medium text-gray-700 mb-1">제목</p>
                <p th:text="${anc.title}" class="py-2 px-3 bg-gray-100 rounded-md"></p>
            </div>

            <div>
                <p class="text-sm font-medium text-gray-700 mb-1">문의 내용</p>
                <div th:text="${anc.content}" class="p-4 bg-gray-100 rounded-md whitespace-pre-wrap"></div>
            </div>
        </div>

        <div class="flex justify-center mt-6">
            <a href="/announcement" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow">목록</a>
        </div>
    </div>
</th:block>
</html>
