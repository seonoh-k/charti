<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto my-6 p-6 space-y-6 bg-white rounded-lg shadow">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">문진 이력 확인</h2>
        <hr class="mb-4 border-gray-300">
        <div class="grid grid-cols-2 gap-6">
            <div class="relative bg-gray-50 p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">기록 문진</h2>
                <p class="text-lg">하루 한번, 우리 아이의 성장을 기록합니다</p>
                <a href="/survey/record/history"
                   class="absolute bottom-4 right-4 px-3 py-1.5 bg-[#E3A67A] text-white text-sm rounded hover:opacity-90">
                    이력 확인
                </a>
            </div>
            <div class="relative bg-gray-50 p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">데일리 문진</h2>
                <p class="text-lg">하루 한번, 우리 아이의 건강 상태를 체크합니다</p>
                <a href="/dailyAnswer/history"
                   class="absolute bottom-4 right-4 px-3 py-1.5 bg-[#E3A67A] text-white text-sm rounded hover:opacity-90">
                    이력 확인
                </a>
            </div>
            <div class="relative bg-gray-50 p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">그룹 문진</h2>
                <p class="text-lg">우리 아이는 친구들과 어떻게 지냈을까요?</p>
                <a href="/groupAnswer/history"
                   class="absolute bottom-4 right-4 px-3 py-1.5 bg-[#E3A67A] text-white text-sm rounded hover:opacity-90">
                    이력 확인
                </a>
            </div>
            <div class="relative bg-gray-50 p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">특별 문진</h2>
                <p class="text-lg">우리 아이의 건강에 위험은 없는지 확인합니다</p>
                <a href="/specialAnswer/history"
                   class="absolute bottom-4 right-4 px-3 py-1.5 bg-[#E3A67A] text-white text-sm rounded hover:opacity-90">
                    이력 확인
                </a>
            </div>
        </div>
    </div>
</th:block>
</html>
