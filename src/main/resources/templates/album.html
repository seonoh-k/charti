<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>데일리 문진</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6" :class="{ 'space-y-6': !modalIsOpen }">
        <div class="relative p-4 mb-6">

            <div th:if="${isOwner}" class="absolute top-0 right-0 m-3 inline-flex items-center space-x-4">
                <label class="inline-flex items-center cursor-pointer space-x-4">
                    <span th:text="${album.isPublic} ? '공개' : '비공개'" id="isPublic" class="text-md text-gray-400"></span>
                    <input type="checkbox" id="publicToggle" value="" class="sr-only peer" th:checked="${album.isPublic}">
                    <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700
                        peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full
                        peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px]
                        after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full
                        after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600
                        dark:peer-checked:bg-blue-600"></div>
                </label>
                <button id="albumDeleteBtn" class="text-gray-500 text-2xl hover:text-gray-300">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <div class="flex items-center gap-4">
                <img th:src="${url}" th:alt="${album.thumbnail}"
                     class="max-w-[400px] max-h-[400px] w-auto h-auto object-contain rounded-lg shadow" />
                <h3 th:text="${album.title}" class="text-2xl font-semibold text-gray-800">예시 타이틀</h3>
                <span th:text="${#temporals.format(album.createdAt, 'yyyy-MM-dd')}"
                    class="text-gray-400"></span>
            </div>

            <div th:if="${isOwner}" class="absolute bottom-0 right-0 flex items-center gap-2 p-2">
                <div id="result" class="text-center text-sm mt-2"></div>
                <form id="photoForm" class="flex justify-end">
                    <label class="cursor-pointer inline-flex items-center bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow">
                        <input type="file" id="fileInput" name="file" accept="image/*" class="hidden">
                        사진 업로드
                    </label>
                </form>
            </div>
        </div>

        <hr class="my-4 border-gray-300">

        <div class="mt-6">
            <div id="photoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div th:each="photo, idx : ${photoList}" class="w-full aspect-square overflow-hidden rounded-lg shadow bg-white">
                    <img th:src="@{/api/proxy/image(filename='thumbnail/' + ${photo.filename})}"
                         th:alt="${photo.filename}" loading="lazy"
                         th:attr="data-photoId=${photo.id}, data-isPublic=${photo.isPublic}, data-createdAt=${photo.createdAt}, data-idx=${idx}"
                         class="modal-trigger w-full h-full object-cover transition-transform duration-300 hover:scale-105">
                </div>
            </div>
        </div>

        <!-- 원본 이미지 파일을 보기위한 모달창 -->
        <div id="modal" class="fixed inset-0 pt-5 bg-black bg-opacity-70 flex justify-center items-center hidden z-50">
            <div class="relative max-w-4xl max-h-[90vh] flex items-center">
                <div class="absolute -top-10 right-11 z-50 p-1 rounded-lg flex items-center gap-4">
                    <label th:if="${isOwner}" class="inline-flex items-center cursor-pointer space-x-4">
                        <span id="modalPublicStatus" class="text-sm text-gray-200"></span>
                        <input type="checkbox" id="modalToggle" value="" class="sr-only peer">
                        <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700
                        peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full
                        peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px]
                        after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full
                        after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600
                        dark:peer-checked:bg-blue-600"></div>
                    </label>
                    <button id="photoDownloadBtn" class="text-gray-200 text-lg hover:text-gray-500">
                        <i class="fa-solid fa-file-arrow-down"></i>
                    </button>
                    <button th:if="${isOwner}" id="photoDeleteBtn" class="text-gray-200 text-lg hover:text-gray-500">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button id="modalClose" class="text-gray-200 text-2xl hover:text-gray-500">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <button id="modalPrev" class="p-2 mr-2 hover:bg-gray-500 rounded-lg text-white text-4xl hover:text-gray-700">
                    <i class="fa-solid fa-angle-left"></i>
                </button>

                <div class="relative max-w-full max-h-[90vh]">
                    <img id="modalImage" src="" alt="" class="max-w-full max-h-[90vh] rounded" />
                </div>

                <button id="modalNext" class="p-2 ml-2 hover:bg-gray-500 rounded-lg text-white text-4xl hover:text-gray-700">
                    <i class="fa-solid fa-angle-right"></i>
                </button>
            </div>
        </div>

    </div>
    <script th:inline="javascript">

        const isOwner = [[${isOwner}]];

        // 모달 변수
        const modal = document.querySelector("#modal");
        const modalImage = document.querySelector("#modalImage");
        const modalPublicStatus = document.querySelector("#modalPublicStatus");
        const modalToggle = document.querySelector("#modalToggle");

        // 모달창에서 이전/다음 이미지 출력을 위한 변수
        let currentIndex = 0;
        let photos = [];

        const proxyUrl = "/api/proxy/image?filename=";

        document.addEventListener("DOMContentLoaded", () => {
            const id = [[${album.id}]];

            const fileInput = document.querySelector("#fileInput");
            const result = document.querySelector("#result");

            if(isOwner) {
                fileInput.addEventListener("change", async () => {

                    const file = fileInput.files[0];

                    if (!file) {
                        alert("업로드할 파일을 선택해주세요");
                        return;
                    }

                    const formData = new FormData();
                    formData.append("id", id);
                    formData.append("file", file);

                    const res = await fetch("/api/album/photo/upload", {
                        method: 'POST',
                        body: formData
                    });

                    if (res.ok) {
                        loadPhotos(id);
                    } else {
                        result.innerHTML = `<p class="text-red-600 font-semibold">Upload Fail!</p>`;
                    }

                })

                document.querySelector("#publicToggle").addEventListener("change", async (e) => {
                    const isChecked = e.target.checked;

                    const formData = new FormData();
                    formData.append("id", id);
                    formData.append("isPublic", isChecked);

                    const res = await fetch("/api/album/visibility", {
                        method: "POST",
                        body: formData
                    });

                    if (res.ok) {
                        document.querySelector("#isPublic").textContent = isChecked ? "공개" : "비공개";
                    } else {
                        e.target.checked = !isChecked;
                        alert("공개 설정 변경에 실패했습니다.");
                    }
                })

                modalToggle.addEventListener("change", async (e) => {
                    const isChecked = e.target.checked;
                    const photoId = modalImage.dataset.photoid;

                    const formData = new FormData();
                    formData.append("id", photoId);
                    formData.append("isPublic", isChecked);

                    const res = await fetch("/api/photo/visibility", {
                        method: "POST",
                        body: formData
                    });

                    if (res.ok) {
                        modalPublicStatus.textContent = isChecked ? "공개" : "비공개";
                    } else {
                        e.target.checked = !isChecked;
                        alert("공개 설정 변경에 실패했습니다.");
                    }

                })

                document.querySelector("#albumDeleteBtn").addEventListener("click", async () => {

                    const res = await fetch(`/api/album/delete?id=${id}`);

                    if(res.ok) {
                        window.location.href = "/albums";
                    }
                });

                document.querySelector("#photoDeleteBtn").addEventListener("click", async () => {

                    const photoId = modalImage.dataset.photoid;
                    const res = await fetch(`/api/photo/delete?id=${photoId}`);

                    if(res.ok) {
                        closeModal();
                        loadPhotos(id);
                    }
                })
            }
            document.querySelectorAll(".modal-trigger").forEach((img, index) => {
                const photoId = img.dataset.photoid;
                const filename = img.alt;
                const isPublic = img.dataset.ispublic;
                const createdAt = img.dataset.createdat;

                photos.push({photoId, filename, isPublic, createdAt});

                img.addEventListener("click", () => {
                    currentIndex = index;
                    openModal();
                })
            })

            document.querySelector("#photoDownloadBtn").addEventListener("click", async () => {

                const filename = modalImage.alt;
                const res = await fetch(`/api/file/download?filename=original/${encodeURIComponent(filename)}`);
                if(!res.ok) {
                    alert("server error");
                    return;
                }

                const data = await res.json();
                const downloadUrl = data.url;
                if(!downloadUrl) {
                    alert("Not Found URL");
                    return;
                }

                const a = document.createElement("a");
                a.href = downloadUrl;
                document.body.appendChild(a);
                a.click();
                a.remove();

            })
        })

        async function loadPhotos(albumId) {
            const photoGrid = document.querySelector("#photoGrid");
            photoGrid.innerHTML = '';
            photos = [];

            const res = await fetch(`/api/album/${albumId}`);
            const data = await res.json();

            data.forEach((photo, idx) => {
                const wrapper = document.createElement("div");
                wrapper.className = "w-full aspect-square overflow-hidden rounded-lg shadow bg-white";

                const img = document.createElement("img");
                img.src = `${proxyUrl}thumbnail/${encodeURIComponent(photo.filename)}`;
                img.alt = photo.filename;
                img.dataset.ispublic = photo.isPublic;
                img.dataset.createdat = photo.createdAt;
                img.dataset.photoid = photo.id;
                img.className = "modal-trigger w-full h-full object-cover transition-transform duration-300 hover:scale-105";

                wrapper.appendChild(img);
                photoGrid.appendChild(wrapper);

                // 모달용 배열에 추가
                photos.push({
                    photoId: photo.id,
                    filename: photo.filename,
                    isPublic: photo.isPublic,
                    createdAt: photo.createdAt
                });

                img.addEventListener("click", () => {
                    currentIndex = idx;
                    openModal();
                });
            });
        }

        function openModal() {
            const currentPhoto = photos[currentIndex];

            if(!currentPhoto) {
                alert("존재하지 않는 사진입니다")
                return;
            }

            modalImage.src = proxyUrl + "original/" + encodeURIComponent(currentPhoto.filename);
            modalImage.alt = currentPhoto.filename;
            modalImage.dataset.photoid = currentPhoto.photoId;
            if(isOwner) {
                modalToggle.checked = currentPhoto.isPublic;
                modalPublicStatus.textContent = modalToggle.checked ? '공개' : '비공개';
            }
            modal.classList.remove("hidden");
        }    
    

        function closeModal() {
            modal.classList.add("hidden");
            modalImage.src = "";
        }

        function showNext() {
            if (photos.length === 0) return;
            currentIndex = (currentIndex + 1) % photos.length;

            const currentPhoto = photos[currentIndex];

            if(!currentPhoto) {
                alert("존재하지 않는 사진입니다")
                return;
            }

            modalImage.src = proxyUrl + "original/" + encodeURIComponent(currentPhoto.filename);
            modalImage.alt = currentPhoto.filename;
            modalImage.dataset.photoid = currentPhoto.photoId;
            if(isOwner) {
                modalToggle.checked = currentPhoto.isPublic;
                modalPublicStatus.textContent = modalToggle.checked ? '공개' : '비공개';
            }
        }

        function showPrev() {
            if (photos.length === 0) return;
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;

            const currentPhoto = photos[currentIndex];

            if(!currentPhoto) {
                alert("존재하지 않는 사진입니다")
                return;
            }

            modalImage.src = proxyUrl + "original/" + encodeURIComponent(currentPhoto.filename);
            modalImage.alt = currentPhoto.filename;
            modalImage.dataset.photoid = currentPhoto.photoId;
            if(isOwner) {
                modalToggle.checked = currentPhoto.isPublic;
                modalPublicStatus.textContent = modalToggle.checked ? '공개' : '비공개';
            }
        }

        document.querySelector("#modalClose").addEventListener("click", closeModal);
        document.querySelector("#modalPrev").addEventListener("click", showPrev);
        document.querySelector("#modalNext").addEventListener("click", showNext);

        // 모달 배경 클릭 시 닫기
        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // 키보드 화살표로 이미지 넘기기
        document.addEventListener("keydown", (e) => {
            if (modal.classList.contains("hidden")) return;

            if (e.key === "ArrowRight") {
                showNext();
            } else if (e.key === "ArrowLeft") {
                showPrev();
            } else if (e.key === "Escape") {
                closeModal();
            }
        });
    </script>
</th:block>
</html>
