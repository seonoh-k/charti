<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포인트 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>

<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
        <h2 class="text-2xl font-bold mb-6">💰 포인트 관리</h2>

        <!-- 검색 필터 -->
        <div class="mb-6">
            <label class="mr-2 font-semibold">검색 기준:</label>
            <select id="searchType" class="border rounded p-1">
                <option value="name">이름</option>
                <option value="nickname">닉네임</option>
            </select>
            <input type="text"
                   id="searchValue"
                   placeholder="검색어 입력"
                   class="border rounded p-1 ml-2"
                   th:value="${prefillName} ?: ''">
            <button
                    id="searchBtn"
                    onclick="searchUser()"
                    class="ml-2 bg-[#374151] text-white px-3 py-1 rounded hover:opacity-90">
                검색
            </button>
        </div>

        <!-- 사용자 선택 -->
        <div id="userSelectBox" class="mb-4 hidden">
            <label class="font-semibold">검색 결과:</label>
            <select id="userSelect" onchange="selectUser()" class="border rounded p-1 ml-2"></select>
        </div>

        <!-- 사용자 정보 -->
        <div id="userInfo" class="mb-6 hidden">
            <p><strong>회원 ID:</strong> <span id="memberIdText"></span></p>
            <p><strong>전화번호:</strong> <span id="phoneText"></span></p>
            <p><strong>이메일:</strong> <span id="emailText"></span></p>
        </div>

        <!-- 포인트 지급 -->
        <div class="mb-10">
            <h3 class="text-xl font-bold mb-3">포인트 지급/차감</h3>
            <label class="ml-3">유형:
                <select name="pointType" id="pointType">
                    <option th:each="pt : ${pointTypes}"
                            th:value="${pt.name()}"
                            th:text="${pt.label}"></option>
                </select>
            </label>
            <label>금액:
                <input type="number" id="amount" value="1000" class="border rounded p-1">
            </label>
            <label class="ml-3">설명:
                <input type="text" id="desc" value="테스트 지급" class="border rounded p-1 w-64">
            </label>
            <button onclick="changePoint()" class="ml-3 bg-[#6F91C7] text-white px-3 py-1 rounded hover:opacity-90">실행</button>
            <p id="changeResult" class="mt-2 text-sm text-gray-700">-</p>
        </div>

        <!-- 포인트 조회 -->
        <div>
            <h3 class="text-xl font-bold mb-3">포인트 조회</h3>
            <p class="mt-4" id="pointResult">현재 포인트: -</p>

            <!-- 🔹 유형 필터 추가 -->
            <div class="mt-4 mb-2">
                <label class="font-semibold">유형 필터:</label>
                <select id="filterType" class="border rounded p-1 ml-2" onchange="renderFilteredHistory()">
                    <option value="ALL">전체</option>
                    <option value="RECORD_SURVEY">기록문진</option>
                    <option value="DAILY_SURVEY">데일리문진</option>
                    <option value="EVENT">이벤트</option>
                    <option value="ADMIN">관리자 수동지급</option>
                </select>
            </div>

            <h4 class="mt-4 font-semibold">포인트 이력 (최신순 최대 10건)</h4>
            <table class="w-full mt-2 border text-center">
                <thead>
                <tr class="bg-gray-100">
                    <th>일시</th>
                    <th>포인트 변화</th>
                    <th>변동 내용</th>
                    <th>유형</th>
                </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let selectedMemberId = null;
        let userList = [];
        let selectedUser = null;
        let fullHistoryList = []; // 🔹 전체 이력 저장

        async function searchUser() {
            const type = document.getElementById('searchType').value;
            const value = document.getElementById('searchValue').value.trim();
            if (!value) return alert('검색어를 입력하세요');

            const res = await fetch(`/api/user/search?type=${type}&value=${value}`);
            if (!res.ok) return alert('회원 검색 실패');
            userList = await res.json();

            const selectBox = document.getElementById('userSelectBox');
            const select = document.getElementById('userSelect');
            select.innerHTML = '';

            if (userList.length === 0) {
                selectBox.classList.add('hidden');
                document.getElementById('userInfo').classList.add('hidden');
                selectedMemberId = null;
                alert('일치하는 회원이 없습니다.');
            } else {
                userList.forEach((user, idx) => {
                    const option = document.createElement('option');
                    option.value = idx;
                    option.textContent = `${user.name} (${user.username})`;
                    select.appendChild(option);
                });
                selectBox.classList.remove('hidden');
                selectUser();
            }
        }

        function selectUser() {
            const selectedIdx = document.getElementById('userSelect').value;
            const user = userList[selectedIdx];
            selectedUser = user;
            selectedMemberId = user.id;

            document.getElementById('memberIdText').innerText = user.id;
            document.getElementById('phoneText').innerText = user.phoneNumber;
            document.getElementById('emailText').innerText = user.username;
            document.getElementById('userInfo').classList.remove('hidden');

            document.getElementById('changeResult').innerText = '-';
            getPoint();
        }

        async function getPoint() {
            if (!selectedMemberId) return;

            const pointRes = await fetch(`/points/current?memberId=${selectedMemberId}`);
            const point = await pointRes.text();
            document.getElementById('pointResult').innerText = `현재 포인트: ${point}`;

            const historyRes = await fetch(`/points/history/view?memberId=${selectedMemberId}`);
            fullHistoryList = await historyRes.json() || [];
            renderFilteredHistory(); // 🔹 필터 적용 렌더링
        }

        function renderFilteredHistory() {
            const selectedType = document.getElementById('filterType').value;
            const tableBody = document.getElementById('historyTable');
            tableBody.innerHTML = '';

            const filtered = fullHistoryList
                .slice().reverse()
                .filter(h => selectedType === 'ALL' || h.pointType === selectedType);

            if (filtered.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4">이력이 없습니다.</td></tr>';
                return;
            }

            filtered.forEach(h => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <!--  <td>${h.createdAt.replace('T', ' ').substring(0, 19)}</td>-->
                    <td>${h.created}</td>
                    <td>${h.beforePoint} ➡ ${h.afterPoint}</td>
                    <td>${h.changeAmount > 0 ? '+' : ''}${h.changeAmount} [${h.description}]</td>
                    <td>${h.pointTypeLabel ?? '-'}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function changePoint() {
            if (!selectedMemberId) {
                alert("먼저 회원을 선택하세요");
                return;
            }

            const amount = document.getElementById('amount').value;
            const desc = document.getElementById('desc').value;
            const pointType = document.getElementById('pointType').value;

            const res = await fetch('/points/change', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    memberId: parseInt(selectedMemberId),
                    amount: parseInt(amount),
                    description: desc,
                    pointType: pointType
                })
            });

            const resultText = document.getElementById('changeResult');
            if (res.ok) {
                resultText.innerText = `${selectedUser.name} (${selectedUser.username}) 회원 포인트 변경 완료!`;
                getPoint(); // 변경 후 이력 새로고침
            } else {
                const err = await res.text();
                resultText.innerText = `${err}`;
            }
        }

        <!-- 페이지 로딩 시, prefillName이 있으면 바로 검색-->
        <!--document.addEventListener('DOMContentLoaded', () => {-->
            <!--const prefillName = /*[[${prefillName}]]*/ '';-->
            <!--if (prefillName) {-->
                <!-- 검색어 input에 이미 th:value로 채워져 있음-->
                <!--searchUser();-->
            <!--}-->
        <!--});-->

    </script>

    <!-- 페이지 로딩 시, prefillName이 있으면 바로 검색 & 선택 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
          (async function() {
            var prefillName = [[${prefillName}]];
            var prefillId   = [[${prefillId}]];

            if (prefillName) {
              // 검색어 셋팅
              document.getElementById('searchValue').value = prefillName;
              // 검색 실행 → 내부에서 selectUser() 까지 자동 호출
              await searchUser();
              // userList 중에 prefillId와 일치하는 인덱스 찾아 바로 선택
              for (let i = 0; i < userList.length; i++) {
                if (String(userList[i].id) === String(prefillId)) {
                  document.getElementById('userSelect').value = i;
                  selectUser();
                  break;
                }
              }
            }
          })();
        /*]]>*/
    </script>

</th:block>
</html>
