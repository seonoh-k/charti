<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-4xl mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6">💰 포인트 관리</h2>

        <!-- 검색 필터 -->
        <div class="mb-6">
            <label class="mr-2 font-semibold">검색 기준:</label>
            <select id="searchType" class="border rounded p-1">
                <option value="name">이름</option>
                <option value="nickname">닉네임</option>
            </select>
            <input type="text" id="searchValue" placeholder="검색어 입력" class="border rounded p-1 ml-2">
            <button onclick="searchUser()" class="ml-2 bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">검색</button>
        </div>

        <!-- 사용자 선택 목록 -->
        <div id="userSelectBox" class="mb-4 hidden">
            <label class="font-semibold">검색 결과:</label>
            <select id="userSelect" onchange="selectUser()" class="border rounded p-1 ml-2"></select>
        </div>

        <!-- 검색 결과 -->
        <div id="userInfo" class="mb-6 hidden">
            <p><strong>회원 ID:</strong> <span id="memberIdText"></span></p>
            <p><strong>전화번호:</strong> <span id="phoneText"></span></p>
            <p><strong>이메일:</strong> <span id="emailText"></span></p>
        </div>

        <!-- 포인트 지급 -->
        <div class="mb-10">
            <h3 class="text-xl font-bold mb-3">포인트 지급/차감</h3>
            <label>금액:
                <input type="number" id="amount" value="1000" class="border rounded p-1">
            </label>
            <label class="ml-3">설명:
                <input type="text" id="desc" value="테스트 지급" class="border rounded p-1 w-64">
            </label>
            <button onclick="changePoint()" class="ml-3 bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">실행</button>
            <p id="changeResult" class="mt-2 text-sm text-gray-700">-</p>
        </div>

        <!-- 포인트 조회 -->
        <div>
            <h3 class="text-xl font-bold mb-3">포인트 조회</h3>
            <p class="mt-4" id="pointResult">현재 포인트: -</p>

            <h4 class="mt-6 font-semibold">포인트 이력 (최신순 최대 10건)</h4>
            <table class="w-full mt-2 border text-center">
                <thead>
                <tr class="bg-gray-100">
                    <th>일시</th><th>포인트 변화</th><th>변동 내용</th>
                </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let selectedMemberId = null;
        let userList = [];
        let selectedUser = null;

        async function searchUser() {
            const type = document.getElementById('searchType').value;
            const value = document.getElementById('searchValue').value;

            const res = await fetch(`/api/user/search?type=${type}&value=${value}`);
            if (!res.ok) {
                alert('회원 검색 실패');
                return;
            }
            userList = await res.json();

            const selectBox = document.getElementById('userSelectBox');
            const select = document.getElementById('userSelect');
            select.innerHTML = '';

            if (userList.length === 0) {
                selectBox.classList.add('hidden');
                document.getElementById('userInfo').classList.add('hidden');
                selectedMemberId = null;
                alert('일치하는 회원이 없습니다.');
            } else {
                userList.forEach((user, idx) => {
                    const option = document.createElement('option');
                    option.value = idx;
                    option.textContent = `${user.name} (${user.username})`;
                    select.appendChild(option);
                });
                selectBox.classList.remove('hidden');
                selectUser(); // 자동 선택 후 getPoint 호출
            }
        }

        function selectUser() {
            const selectedIdx = document.getElementById('userSelect').value;
            const user = userList[selectedIdx];
            selectedUser = user;
            selectedMemberId = user.id;

            document.getElementById('memberIdText').innerText = user.id;
            document.getElementById('phoneText').innerText = user.phoneNumber;
            document.getElementById('emailText').innerText = user.username;
            document.getElementById('userInfo').classList.remove('hidden');

            document.getElementById('changeResult').innerText = '-';
            getPoint();
        }

        async function getPoint() {
            if (!selectedMemberId) return;
            const pointRes = await fetch(`/points/current?memberId=${selectedMemberId}`);
            const point = await pointRes.text();
            document.getElementById('pointResult').innerText = `현재 포인트: ${point}`;

            const historyRes = await fetch(`/points/history/view?memberId=${selectedMemberId}`);
            const historyList = await historyRes.json();
            const tableBody = document.getElementById('historyTable');
            tableBody.innerHTML = '';

            if (!Array.isArray(historyList) || historyList.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="3">이력이 없습니다.</td></tr>';
            } else {
                [...historyList].reverse().forEach(h => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${h.createdAt.replace('T', ' ').substring(0, 19)}</td>
                        <td>${h.beforePoint} ➡ ${h.afterPoint}</td>
                        <td>${h.changeAmount > 0 ? '+' : ''}${h.changeAmount} [${h.description}]</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        async function changePoint() {
            if (!selectedMemberId) {
                alert("먼저 회원을 선택하세요");
                return;
            }
            const amount = document.getElementById('amount').value;
            const desc = document.getElementById('desc').value;

            const res = await fetch('/points/change', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    memberId: parseInt(selectedMemberId),
                    amount: parseInt(amount),
                    description: desc
                })
            });

            const resultText = document.getElementById('changeResult');
            if (res.ok) {
                resultText.innerText = `${selectedUser.name} (${selectedUser.username}) 회원 포인트 변경 완료!`;
                getPoint();
            } else {
                const err = await res.text();
                resultText.innerText = `${err}`;
            }
        }
    </script>
</th:block>
</html>
