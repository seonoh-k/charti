<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
</head>
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
            <h1 class="text-2xl font-bold mb-4">담당자 정보 수정</h1>
            <form th:action="@{/admin/manager/update}" th:object="${managerDTO}" method="post" class="space-y-4 bg-white p-6 rounded shadow-md" id="managerForm">
        
                <input type="hidden" th:field="*{id}" id="id"/>
                <div>
                    <label class="block mb-1 text-sm font-medium">이름</label>
                    <input type="text" th:field="*{name}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring" />
                    <p id="name-error-message" class="text-red-600" ></p>
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">닉네임</label>
                    <input type="text" th:field="*{nickname}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring" />
                    <p id="nickname-error-message" class="text-red-600" ></p>
                </div>
        
                <div>
                    <label class="block mb-1 text-sm font-medium">이메일</label>
                    <input type="email" th:field="*{username}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">비밀번호</label>
                    <input type="password" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
        
                <div>
                    <label class="block mb-1 text-sm font-medium">전화번호</label>
                    <input type="text" th:field="*{phoneNumber}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
        
                <div>
                    <label class="block mb-1 text-sm font-medium">그룹 이름</label>
                    <input type="text" th:field="*{groupName}" th:value="*{groupName} ?: 'X'"  class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly/>
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">그룹 이메일</label>
                    <input type="text" th:field="*{groupEmail}" th:value="*{groupEmail} ?: 'X'" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly/>
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">가입 일자</label>
                    <input type="text"
                        th:value="${#temporals.format(managerDTO.createdAt, 'yyyy년MM월dd일 HH시mm분')}"
                        class="w-full bg-gray-100 border border-gray-300 rounded px-3 py-2 text-gray-500 cursor-not-allowed" readonly />
                </div>
        
                <div class="pt-4 flex flex-row justify-end">
                    <button type="button" onclick="showModal()" class="bg-[#374151] hover:opacity-90 text-white px-4 py-2 rounded">
                        수정하기
                    </button>
                    <a th:if="${hasChildren}" th:href="@{'/admin/manager/' + ${managerDTO.id} + '/children'}" class="btn bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded ml-2">
                        자녀 정보 보기
                    </a>
                </div>
            </form>
        </main>
    </div>





<div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded shadow-lg text-center w-80">
        <p class="text-lg mb-4">정말 수정하시겠습니까?</p>
        <div class="flex justify-center gap-4">
            <button onclick="confirmUpdate()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">확인</button>
            <button onclick="hideModal()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">취소</button>
        </div>
    </div>
</div>



<script>

function showModal() {
    document.getElementById("confirmModal").classList.remove("hidden");
}
function hideModal() {
    document.getElementById("confirmModal").classList.add("hidden");
}
function confirmUpdate() {
    hideModal();
    updateManager();
}


async function updateManager(){
    const form = document.getElementById("managerForm");
    const formData = new FormData(form);
    const data = {};

    formData.forEach((value,key) => {
        data[key] = value;
        console.log("Key : "+key+"Value : "+value)
    });
    
    showToast("담당자 수정 데이터 검사 진행 중", 'success',3000);

    const checkResponse = await fetch(`/admin/check/manager`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const checkResult = await checkResponse.json();
    
    if (checkResult.code === 'OK') {
        const updateResponse = await fetch(`/admin/manager/${data.id}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const createResult = await updateResponse.json();
    
        if(createResult.code === "OK"){
            showToast("담당자 수정 절차 진행 중", 'success',3000);
            setTimeout(() => {
                window.location.href = `/admin/manager/${data.id}`;
            }, 1500);
        } else{
            showToast(checkResult.message || '수정 중 오류 발생','error',3000);
        }
        
    } else {
        showToast(checkResult.message || '수정 중 오류 발생','error',3000);
        // 1) 기존 에러 메시지 모두 초기화
        ['name','nickname'].forEach(field => {
            const p = document.getElementById(`${field}-error-message`);
            if (p) p.textContent = '';
        });
        // 2) error 배열 순회, 같은 필드에 메시지 여러 개면 첫 번째만 출력
        checkResult.data.forEach(err => {
            const p = document.getElementById(`${err.field}-error-message`);
            if (p && !p.textContent) {
                p.textContent = err.message;
            }
        });
    }
}

function showToast(message, type = 'success', duration = 3000) {
    
    const container = document.getElementById("toast-container");

    const colors = {
        success: {
            bg: "bg-green-500",
            icon: "✅"
        },
        error: {
            bg: "bg-red-500",
            icon: "❌"
        }
    };
    console.log(type);
    const toast = document.createElement("div");
    toast.className = `flex items-center text-white px-4 py-2 rounded shadow-lg ${colors[type].bg} animate-slide-in-right`;
    toast.innerHTML = 
    `<span class="mr-2">${colors[type].icon}</span>
    <span>${message}</span>`;

    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.remove("animate-slide-in-right");
        toast.classList.add("animate-fade-out");

        setTimeout(() => container.removeChild(toast), 5000);
        
    }, duration);
}
</script>


    <div id="toast-container" class="fixed inset-x-0 top-0 z-50 space-y-3 text-center"></div>
</th:block>
</html>
