<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문가 승인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="container mx-auto px-6 py-10">
    <h1 class="text-2xl font-bold mb-4">관리자 Main Page</h1>
    <h2>일반 사용자</h2>
    <table class="w-full table-auto border text-center" id="member-table">
        <thead>
        <tr>
            <th class="border px-4 py-2">id</th>
            <th class="border px-4 py-2">이름</th>
            <th class="border px-4 py-2">이메일</th>
            <th class="border px-4 py-2">전화번호</th>
            <th class="border px-4 py-2">포인트</th>
        </tr>
        </thead>
        <tbody id="table-body">
        <tr th:each="member : ${result.dtoList}">
            <td class="border px-4 py-2" th:text="${member.id}">홍길동</td>
            <td class="border px-4 py-2" th:text="${member.name}">홍길동</td>
            <td class="border px-4 py-2" th:text="${member.email}">hong@test.com</td>
            <td class="border px-4 py-2" th:text="${member.phoneNumber}"></td>
            <td class="border px-4 py-2" th:text="${member.totalPoint == null ? 0 : member.totalPoint}"></td>
        </tr>
        </tbody>
    </table>
    <div class="mt-4 flex justify-center gap-2" id="pagination">

        <!-- ◀ 이전 페이지 이동 -->
        <a th:href="${result.startPage - 1 > 0} ? @{/admin/member/all(page=${result.startPage - 1}, size=10, sort='createdAt', direction='desc')} : '#'"
           th:classappend="${result.startPage - 1 <= 0} ? 'pointer-events-none opacity-50' : ''"
           class="px-3 py-1 rounded bg-gray-300 hover:bg-gray-400">
            ◀
        </a>

        <!-- 페이지 번호 목록 -->
        <a th:each="p : ${result.pageList}"
           th:text="${p}"
           th:href="@{/admin/expert-applicants(page=${p}, size=10, sort='createdAt', direction='desc')}"
           th:classappend="${p == result.page} ? 'bg-blue-500 text-white' : 'bg-gray-200'"
           class="px-3 py-1 rounded hover:bg-blue-500">
        </a>

        <!-- ▶ 다음 페이지 이동 -->
        <a th:href="${result.endPage + 1 < result.totalPages} ? @{/admin/expert-applicants(page=${result.endPage + 1}, size=10, sort='createdAt', direction='desc')} : '#'"
           th:classappend="${result.endPage + 1 >= result.totalPages} ? 'pointer-events-none opacity-50' : ''"
           class="px-3 py-1 rounded bg-gray-300 hover:bg-gray-400">
            ▶
        </a>

    </div>


</div>
</body>
</html>
