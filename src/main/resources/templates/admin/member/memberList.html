<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
</head>
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
            <h1 class="text-2xl font-bold mb-4">사용자 목록</h1>

            <!-- 검색바  -->
            <form id="searchForm"
                th:action="@{/admin/member/all}"
                th:method="GET"
                class="flex justify-end gap-2 mb-6">
                <!-- 검색 기준 -->
                <select name="type" id="searchType"
                    class="border border-gray-300 rounded px-3 py-2 text-sm">
                    <option value="name" th:selected="${type=='name'}" >이름</option>
                    <option value="email" th:selected="${type=='email'}" >이메일</option>
                    <option value="phoneNumber" th:selected="${type=='phoneNumber'}" >전화번호</option>
                    <option value="nickname" th:selected="${type=='nickname'}" >닉네임</option>
                </select>
            
                <!-- 검색 입력 -->
                <div class="relative w-full max-w-xs">
                    <input type="text" name="keyword" id="searchInput" placeholder="검색어 입력" th:value="${keyword}"
                        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring" />
                    <div id="suggestions"
                        class="absolute top-full left-0 w-full mt-1 bg-white border border-gray-300 rounded shadow hidden z-20 max-h-60 overflow-y-auto text-sm">
                    </div>
                </div>
            
                <button id="searchBtn"
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            
                <!-- 리셋 버튼: 폼 리셋 -->
                <button id="resetBtn" 
                    type="button"
                    class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </form>
            <th:block th:if="${hasMember}">
                <table class="w-full table-auto border text-center" id="member-table">
                    <thead>
                    <tr>
                        <th class="border px-4 py-2">id</th>
                        <th class="border px-4 py-2">이름</th>
                        <th class="border px-4 py-2">이메일</th>
                        <th class="border px-4 py-2">전화번호</th>
                        <th class="border px-4 py-2">포인트</th>
                    </tr>
                    </thead>
                    <tbody id="table-body">
                    <tr th:each="member : ${result.dtoList}">
                        <td class="border px-4 py-2" th:text="${member.id}">홍길동</td>
                        <td class="border px-4 py-2" ><a th:href="@{/admin/member/{id}(id=${member.id})}" th:text="${member.name}" class="hover:underline"></a></td>
                        <td class="border px-4 py-2" th:text="${member.username}">hong@test.com</td>
                        <td class="border px-4 py-2" th:text="${member.phoneNumber}"></td>
                        <td class="border px-4 py-2" ><a th:href="@{/admin/point(id=${member.id})}" class="hover:underline" th:text="${member.totalPoint == null ? 0 : member.totalPoint}"></a></td>
                    </tr>
                    </tbody>
                </table>
            </th:block>
            <th:block th:unless="${hasMember}">
                <div class="text-center text-gray-500 text-lg py-10">
                    <i class="fa-solid fa-user-large fa-2x my-4"></i><br/>
                    회원이 없습니다.
                </div>
            </th:block>
            <!-- 페이징 -->
            <div class="mt-4 flex justify-center gap-2" id="pagination">
                <!-- 첫페이지 -->
                <a th:href="@{/admin/member/all(
                    page=1,
                    size=10,
                    sort=${sort},
                    type=${type},
                    keyword=${keyword})}"
                   th:if="${result.page > 1}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-double-left"></i>
                </a>

                <!-- ◀ 이전 페이지 -->
                <a th:href="@{/admin/member/all(
                    page=${result.page - 1},
                    size=10,
                    sort=${sort},
                    type=${type},
                    keyword=${keyword})}"
                   th:if="${result.page > 1}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-left"></i>
                </a>

                <!-- 페이지 번호 목록 -->
                <a th:each="p : ${result.pageList}"
                   th:text="${p}"
                   th:href="@{/admin/member/all(
                    page=${p},
                    size=10,
                    sort=${sort},
                    type=${type},
                    keyword=${keyword})}"
                   th:classappend="${p == result.page} ? 'bg-[#E3A67A] text-white' : 'bg-gray-200 text-[#E3A67A]'"
                   class="px-3 py-1 rounded hover:bg-[#E3A67A] hover:text-white transition"></a>

                <!-- ▶ 다음 페이지 -->
                <a th:href="@{/admin/member/all(
                    page=${result.page + 1},
                    size=10,
                    sort=${sort},
                    type=${type},
                    keyword=${keyword})}"
                   th:if="${result.page < result.totalPages}"
                   class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-right"></i>
                </a>

                <!-- 마지막 페이지 -->
                <a th:href="@{/admin/member/all(
                    page=${result.endPage},
                    size=10,
                    sort=${sort},
                    type=${type},
                    keyword=${keyword})}"
                   th:if="${result.page != result.totalPages}"
                   class="px-3 py-1 bg-gray-200 text-[#E3A67A] rounded hover:bg-[#E3A67A] hover:text-white transition">
                    <i class="fas fa-angle-double-right"></i>
                </a>
            </div>
        </div>
    </div>
<script>

    const input = document.getElementById('searchInput');
    const type = document.getElementById('searchType');
    const btn = document.getElementById('searchBtn');
    const suggestions = document.getElementById('suggestions');
    const resetBtn = document.getElementById('resetBtn');
    let debounceTimer;

    // 입력 감지 + 디바운싱
    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const keyword = input.value.trim();

        if (!keyword) {
            suggestions.classList.add('hidden');
            return;
        }

        debounceTimer = setTimeout(() => {
            fetchSuggestions(keyword);
        }, 300);
    });

    // 검색 버튼 클릭 시 페이지 이동
    btn.addEventListener('click', (e) => {
        e.preventDefault();
        const keyword = input.value.trim();
        if (!keyword) return;
        window.location.href = `/admin/member/all?type=${type.value}&keyword=${encodeURIComponent(keyword)}&sort=${type.value}`;
    });
    // Reset 검색 조건 초기화
    resetBtn.addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchType').value = 'name'; // 초기값 선택
            window.location.href = '/admin/member/all'; // 기본 조회 페이지로 이동
        });

    // 비동기 검색 요청
    async function fetchSuggestions(keyword) {
        try {
            const response = await fetch(`/admin/member/all/search?type=${type.value}&keyword=${encodeURIComponent(keyword)}&sort=${type.value}`);
            if (response.status === 204) {
                suggestions.classList.add('hidden');
                return;
            }

            const result = await response.json();
            const list = result.data?.dtoList || [];
            if (result.code !== "SWD" || list.length === 0) {
                suggestions.classList.add('hidden');
                return;
            }

            suggestions.innerHTML = '';
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'px-3 py-2 hover:bg-gray-100 cursor-pointer';
                div.textContent = `${item.name} [${item.username}] 
                [${item.phoneNumber}] [${item.nickname || "기재X"}]`;
                div.onclick = () => {
                    input.value = item[type.value] || item.name;
                    suggestions.classList.add('hidden');
                };
                suggestions.appendChild(div);
            });

            suggestions.classList.remove('hidden');

        } catch (e) {
            console.error('검색 실패:', e);
            suggestions.classList.add('hidden');
        }
    }    
</script>
    <div id="toast-container" class="fixed inset-x-0 top-0 z-50 space-y-3 text-center"></div>
    </th:block>
</html>
