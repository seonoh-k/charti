<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
</head>
    <th:block layout:fragment="content">
        <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
    <div class="flex flex-1">
        <div class="flex-1 justify-center items-center p-20">
            <div class="relative flex items-center justify-between">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">1:1 문의</h1>
            </div>
            <hr class="mb-8 border-gray-300">

            <div class="space-y-6">
                <div class="flex gap-4">
                    <div class="w-1/5">
                        <p class="text-sm font-medium text-gray-700 mb-1">카테고리</p>
                        <p th:text="${qna.category.displayName}" class="py-2 px-3 text-center bg-gray-100 rounded-md"></p>
                    </div>
                    <div class="w-2/5"></div>
                    <div class="w-1/5">
                        <p class="text-sm font-medium text-gray-700 mb-1">작성자</p>
                        <p th:text="${qna.nickname != null ? qna.nickname : qna.name}" class="py-2 px-3 text-center bg-gray-100 rounded-md"></p>
                    </div>

                    <div class="w-1/5">
                        <p class="text-sm font-medium text-gray-700 mb-1">작성일</p>
                        <p th:text="${qna.createdAt}" class="py-2 px-3 text-center bg-gray-100 rounded-md"></p>
                    </div>
                </div>

                <div>
                    <p class="text-sm font-medium text-gray-700 mb-1">제목</p>
                    <p th:text="|${qna.title}${qna.deleted ? ' (삭제됨)' : ''}|" class="py-2 px-3 bg-gray-100 rounded-md"></p>
                </div>

                <div>
                    <p class="text-sm font-medium text-gray-700 mb-1">문의 내용</p>
                    <div th:text="${qna.content}" class="p-4 bg-gray-100 rounded-md whitespace-pre-wrap"></div>
                </div>
            </div>

            <hr class="mb-8 border-gray-100">
            <div>
                <p class="text-sm font-medium text-gray-700 mb-1">답변</p>
                <p id="answer" th:text="${ans != null and ans.content != null ? ans.content : '답변이 등록되지 않았습니다.'}"
                   class="p-4 bg-gray-100 rounded-md whitespace-pre-wrap"></p>
            </div>

            <div id="ans" class="overflow-hidden max-h-0 transition-[max-height] duration-300 ease-in-out">
                <form id="answerForm" class="space-y-4 mt-4">
                    <input type="hidden" id="qnaId" th:value="${qna.id}">
                    <div>
                        <label for="answerContent" class="block text-sm font-medium text-gray-700 mb-1">
                            답변 작성
                        </label>
                        <textarea id="answerContent" name="content" rows="4" placeholder="답변을 작성해주세요"
                                  class="mt-1 block w-full border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        </textarea>
                    </div>

                    <div class="flex justify-end space-x-2">
                        <button type="submit" id="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                            저장
                        </button>
                        <button type="button" id="cancel" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
                            취소
                        </button>
                    </div>
                </form>
            </div>

            <div class="flex justify-center mt-6 mx-6">
                <a href="/admin/qna" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded shadow">
                    목록
                </a>
                <button type="button" id="answerBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow">
                    답변 작성
                </button>
                <button type="button" id="deleteBtn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded shadow">
                    삭제
                </button>
            </div>
        </div>
        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", () => {
                const answerBtn = document.querySelector("#answerBtn");
                const inlineForm = document.querySelector("#ans");
                const answerForm = document.querySelector("#answerForm");
                const cancelBtn = document.querySelector("#cancel");

                function openForm() {
                    inlineForm.style.maxHeight = inlineForm.scrollHeight + "px";
                }

                function closeForm() {
                    inlineForm.style.maxHeight = "0px";
                }

                answerBtn.addEventListener("click", () => {
                   if(inlineForm.style.maxHeight && inlineForm.style.maxHeight !== "0px") {
                       closeForm();
                   }else {
                       openForm();
                   }
                });

                cancelBtn.addEventListener("click", closeForm);

                answerForm.addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const qnaId = document.querySelector("#qnaId").value;
                    const content = document.querySelector("#answerContent").value.trim();

                    const formData = new FormData();
                    formData.append("id", qnaId);
                    formData.append("content", content);

                    const res = await fetch("/api/qna/answer", {
                        method: "POST",
                        body: formData
                    })

                    if(res.ok) {
                        closeForm();
                        const answer = document.querySelector("#answer");
                        answer.innerHTML = content;
                    }else {
                        alert("답변 등록에 실패했습니다.");
                        inlineForm.reset();
                    }
                })
            })
        </script>
    </div>
        </div>
</th:block>>
</html>
