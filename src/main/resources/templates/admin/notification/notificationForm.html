<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charti - 알림 발송</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-2xl mx-auto bg-white shadow p-6 mt-8 rounded">
        <h1 class="text-2xl font-bold mb-6">📢 알림 발송</h1>

        <form th:action="@{/admin/notification/send}" method="post">
            <!-- 1) 수신 대상 -->
            <div class="mb-4">
                <label for="target" class="block font-semibold mb-1">수신 대상</label>
                <select name="target" id="target" class="w-full border p-2 rounded">
                    <option value="ALL">전체</option>
                    <option value="SPECIAL_RISK">위험군 속한 자녀 대상자</option>
                    <!-- ★ 그룹 대상자 옵션 -->
                    <option th:each="g : ${groups}"
                            th:value="${'GROUP_' + g.targetGroup.name()}"
                            th:text="${g.targetGroup.displayName + ' 그룹 대상자'}">
                    </option>
                </select>
            </div>

            <!-- 2) 연령대 -->
            <div class="mb-4" id="ageGroupWrapper">
                <label for="ageGroup" class="block font-semibold mb-1">연령대</label>
                <select name="ageGroup" id="ageGroup" class="w-full border p-2 rounded">
                    <option value="">전체</option>
                    <option th:each="a : ${ageGroups}"
                            th:value="${a}"
                            th:text="${a.displayName}"></option>
                </select>
            </div>

            <!-- 3) 카테고리 -->
            <div class="mb-4" id="categoryWrapper">
                <label for="category" class="block font-semibold mb-1">카테고리</label>
                <select name="category" id="category" class="w-full border p-2 rounded">
                    <option value="">전체</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.name()}"
                            th:text="${c.label}"></option>
                </select>
            </div>

            <!-- 4) 제목 -->
            <div class="mb-4" id="titleWrapper">
                <label for="title" class="block font-semibold mb-1">제목</label>
                <input type="text" name="title" id="title"
                       class="w-full border p-2 rounded" required>
            </div>

            <!-- 5) 내용 -->
            <div class="mb-6" id="bodyWrapper">
                <label for="body" class="block font-semibold mb-1">내용</label>
                <textarea name="body" id="body" rows="4"
                          class="w-full border p-2 rounded" required></textarea>
            </div>

            <button type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                알림 발송
            </button>
        </form>

        <p th:if="${message}"
           class="mt-6 text-green-600 font-semibold"
           th:text="${message}"></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
          const targetSelect    = document.getElementById("target");
          const ageGroupWrapper = document.getElementById("ageGroupWrapper");
          const categoryWrapper = document.getElementById("categoryWrapper");
          const titleWrapper    = document.getElementById("titleWrapper");
          const bodyWrapper     = document.getElementById("bodyWrapper");
          const ageGroupSelect  = document.getElementById("ageGroup");
          const categorySelect  = document.getElementById("category");
          const titleInput      = document.getElementById("title");
          const bodyTextarea    = document.getElementById("body");

          // 기존 자동 템플릿 (카테고리 선택 → 제목/본문 자동 입력)
          const titles = { DAILY:"오늘의 문진 안내", SPECIAL:"특별 문진 요청",
                           NOTICE:"공지사항 안내", SYSTEM:"시스템 알림" };
          const bodies = { DAILY:"오늘의 데일리 문진을 진행해주세요! 📋",
                           SPECIAL:"아이의 건강 상태가 평소와 다르다면 특별 문진을 작성해주세요.",
                           NOTICE:"Charti의 새로운 소식을 알려드립니다! 📢",
                           SYSTEM:"시스템 점검 안내: 서비스 이용에 참고 바랍니다." };
          categorySelect.addEventListener("change", () => {
            const sel = categorySelect.value;
            titleInput.value = titles[sel]||"";
            bodyTextarea.value = bodies[sel]||"";
          });

          // 수신 대상 변경 시 age/category/제목·본문 토글
          function onTargetChange() {
            const t = targetSelect.value;
            if (t === 'SPECIAL_RISK' || t.startsWith('GROUP_')) {
              ageGroupWrapper.style.display    = 'none';
              categoryWrapper.style.display    = 'none';
              titleWrapper.style.display       = 'none';
              bodyWrapper.style.display        = 'none';
              ageGroupSelect.disabled          = true;
              categorySelect.disabled          = true;
              titleInput.required             = false;
              bodyTextarea.required           = false;
            } else {
              ageGroupWrapper.style.display    = '';
              categoryWrapper.style.display    = '';
              titleWrapper.style.display       = '';
              bodyWrapper.style.display        = '';
              ageGroupSelect.disabled          = false;
              categorySelect.disabled          = false;
              titleInput.required             = true;
              bodyTextarea.required           = true;
            }
          }

          targetSelect.addEventListener("change", onTargetChange);
          onTargetChange();
        });
    </script>
</th:block>
</html>
