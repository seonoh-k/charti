<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-2xl mx-auto bg-white shadow p-6 mt-8 rounded">
        <h1 class="text-2xl font-bold mb-6">📢 알림 발송</h1>

        <form th:action="@{/admin/notification/send}" method="post">

            <!-- 수신 대상 선택 -->
            <label for="target" class="block font-semibold mb-1">수신 대상</label>
            <select name="target" id="target" class="w-full border p-2 rounded mb-4">
                <option value="ALL">전체</option>
                <option value="DAILY_MISSED">금일 데일리문진 미응답자</option>
            </select>

            <!-- 연령대 선택 -->
            <label for="ageGroup" class="block font-semibold mb-1">연령대</label>
            <select name="ageGroup" id="ageGroup" class="w-full border p-2 rounded mb-4">
                <option value="">전체</option>
                <option th:each="a : ${ageGroups}"
                        th:value="${a}"
                        th:text="${a.label}">
                </option>
            </select>

            <!-- 카테고리 선택 -->
            <label for="category" class="block font-semibold mb-1">카테고리</label>
            <select name="category" id="category" class="w-full border p-2 rounded mb-4">
                <option value="">전체</option>
                <option th:each="c : ${categories}"
                        th:value="${c.name()}"
                        th:text="${c.label}">
                </option>
            </select>

            <!-- 제목 -->
            <label for="title" class="block font-semibold mb-1">제목</label>
            <input type="text" name="title" id="title" class="w-full border p-2 rounded mb-4" required>

            <!-- 내용 -->
            <label for="body" class="block font-semibold mb-1">내용</label>
            <textarea name="body" id="body" rows="4" class="w-full border p-2 rounded mb-6" required></textarea>

            <!-- 제출 버튼 -->
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                알림 발송
            </button>
        </form>

        <!-- 발송 결과 메시지 -->
        <p th:if="${message}" class="mt-6 text-green-600 font-semibold" th:text="${message}"></p>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
          const categorySelect = document.getElementById("category");
          const titleInput = document.getElementById("title");
          const bodyTextarea = document.getElementById("body");

          // 자동입력용 템플릿
          const titles = {
            DAILY: "오늘의 문진 안내",
            SPECIAL: "특별 문진 요청",
            NOTICE: "공지사항 안내",
            SYSTEM: "시스템 알림"
          };

          const bodies = {
            DAILY: "오늘의 데일리 문진을 진행해주세요! 📋",
            SPECIAL: "아이의 건강 상태가 평소와 다르다면 특별 문진을 작성해주세요.",
            NOTICE: "Charti의 새로운 소식을 알려드립니다! 📢",
            SYSTEM: "시스템 점검 안내: 서비스 이용에 참고 바랍니다."
          };

          categorySelect.addEventListener("change", function () {
            const selected = categorySelect.value;

            // 선택된 카테고리 값이 있는 경우 자동 입력
            if (titles[selected] && bodies[selected]) {
              titleInput.value = titles[selected];
              bodyTextarea.value = bodies[selected];
            } else {
              // 전체(빈값) 선택 시 입력란 초기화
              titleInput.value = "";
              bodyTextarea.value = "";
            }
          });
        });
    </script>
</th:block>
</html>
