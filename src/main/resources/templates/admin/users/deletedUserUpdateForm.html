<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
</head>
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 rounded">
            <h1 class="text-2xl font-bold mb-4">탈퇴된 회원 정보</h1>
            <!-- activeUser 플래그가 있으면, 아이콘+메시지 표시 -->
            <div th:if="${activeUser}" class="flex flex-col items-center justify-center h-64">
                <i class="fas fa-user-check fa-5x text-gray-400 mb-4"></i>
                <p class="text-xl font-semibold">활동 중인 유저입니다.</p>
                <!-- 목록으로 돌아가기 링크 (필요시 페이징 파라미터 붙이기) -->
                <a th:href="@{/admin/users/all/deleted(
                            page=${page},size=${size},
                            sort=${sort},direction=${direction})}"
                    class="mt-4 text-blue-600 hover:underline">
                    <i class="fas fa-arrow-left"></i> 목록으로 돌아가기
                </a>
            </div> 
            <form th:unless="${activeUser}" th:action="@{/admin/users/deleted/}" th:object="${userDTO}" method="post" class="space-y-4 bg-white p-6 rounded shadow-md" id="deleted-user-form">
        
                <input type="hidden" th:field="*{id}" id="id"/>
                <div>
                    <label class="block mb-1 text-sm font-medium">이름</label>
                    <input type="text" th:field="*{name}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">닉네임</label>
                    <input type="text" th:field="*{nickname}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
        
                <div>
                    <label class="block mb-1 text-sm font-medium">이메일</label>
                    <input type="email" th:field="*{username}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">비밀먼호</label>
                    <input type="password" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">전화번호</label>
                    <input type="text" th:field="*{phoneNumber}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
        
                <div>
                    <label class="block mb-1 text-sm font-medium">가입 경로 (provider)</label>
                    <input type="text" th:field="*{provider}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium">역할</label>
                    <input type="text" th:field="*{role}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring text-gray-500 bg-gray-100 cursor-not-allowed" readonly />
                </div>
        
                
                <div>
                    <label class="block mb-1 text-sm font-medium">가입 일자</label>
                    <input type="text"
                        th:value="${#temporals.format(userDTO.createdAt, 'yyyy년MM월dd일 HH시mm분')}"
                        class="w-full bg-gray-100 border border-gray-300 rounded px-3 py-2 text-gray-500 cursor-not-allowed" readonly />
                </div>
                
        
                <div class="pt-4 flex flex-row justify-end">
                    <button type="button" onclick="showModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
                        복구하기
                    </button>
                </div>
            </form>
        </main>
    </div>





<div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded shadow-lg text-center w-80">
        <p class="text-lg mb-4">정말 복구하시겠습니까?</p>
        <div class="flex justify-center gap-4">
            <button onclick="restoreConfirm()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">확인</button>
            <button onclick="hideModal()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">취소</button>
        </div>
    </div>
</div>



<script>

function showModal() {
    document.getElementById("confirmModal").classList.remove("hidden");
}
function hideModal() {
    document.getElementById("confirmModal").classList.add("hidden");
}
function restoreConfirm() {
    hideModal();
    restoreUser();
}


async function restoreUser(){
    const form = document.getElementById("deleted-user-form");
    const formData = new FormData(form);
    const data = {};

    formData.forEach((value,key) => {
        data[key] = value;
        console.log("Key : "+key+"Value : "+value)
    });
    
    const res = await fetch(`/admin/users/deleted/restore/${data.id}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await res.json();
    console.log("result.code == " + result.code);

    if (result.code === 'OK') {
        showToast(result.message, 'success',3000);
        setTimeout(() => {
        window.location.href = `/admin/users/all/deleted`;
        }, 1500);
    } else {
        showToast('error', result.message || '수정 중 오류 발생',3000);
    }

}



function showToast(message, type = 'success', duration = 3000) {
    
    const container = document.getElementById("toast-container");

    const colors = {
        success: {
            bg: "bg-green-500",
            icon: "✅"
        },
        error: {
            bg: "bg-red-500",
            icon: "❌"
        }
    };
    console.log(type);
    const toast = document.createElement("div");
    toast.className = `flex items-center text-white px-4 py-2 rounded shadow-lg ${colors[type].bg} animate-slide-in-right`;
    toast.innerHTML = 
    `<span class="mr-2">${colors[type].icon}</span>
    <span>${message}</span>`;

    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.remove("animate-slide-in-right");
        toast.classList.add("animate-fade-out");

        setTimeout(() => container.removeChild(toast), 5000);
        
    }, duration);
}
</script>


<div id="toast-container" class="fixed inset-x-0 top-0 z-50 space-y-3 text-center"></div>
</th:block>
</html>
