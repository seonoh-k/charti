<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전문가 승인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="container mx-auto px-6 py-10">
    <h1 class="text-2xl font-bold mb-4">관리자 Main Page</h1>
    <h2>전문가</h2>
    <table class="w-full table-auto border" id="expert-table">
        <thead>
            <tr>
                <th class="border px-4 py-2">id</th>
                <th class="border px-4 py-2">이름</th>
                <th class="border px-4 py-2">이메일</th>
                <th class="border px-4 py-2">전화번호</th>
                <th class="border px-4 py-2">면허</th>
                <th class="border px-4 py-2">전공</th>
                <th class="border px-4 py-2">커리어</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="expert : ${expertDTOList}">
                <td class="border px-4 py-2" th:text="${expert.id}"></td>
                <td class="border px-4 py-2" th:text="${expert.name}"></td>
                <td class="border px-4 py-2" th:text="${expert.email}"></td>
                <td class="border px-4 py-2" th:text="${expert.phoneNumber}"></td>
                <td class="border px-4 py-2" th:text="${expert.license}"></td>
                <td class="border px-4 py-2" th:text="${expert.major}"></td>
                <td class="border px-4 py-2" th:text="${expert.career}"></td>
            </tr>
        </tbody>
    </table>

    <h2>담당자</h2>
    <table class="w-full table-auto border" id="manager-table">
        <thead>
            <tr>
                <th class="border px-4 py-2">id</th>
                <th class="border px-4 py-2">이름</th>
                <th class="border px-4 py-2">이메일</th>
                <th class="border px-4 py-2">소속</th>
                <th class="border px-4 py-2">전화번호</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="manager : ${managerDTOList}">
                <td class="border px-4 py-2" th:text="${manager.id}">홍길동</td>
                <td class="border px-4 py-2" th:text="${manager.name}">홍길동</td>
                <td class="border px-4 py-2" th:text="${manager.email}">hong@test.com</td>
                <td class="border px-4 py-2" th:text="${manager.groupName}">OO대학교</td>
                <td class="border px-4 py-2" th:text="${manager.phoneNumber}"></td>
            </tr>
        </tbody>
    </table>
    <h2>일반 사용자</h2>
    <table class="w-full table-auto border" id="member-table">
        <thead>
        <tr>
            <th class="border px-4 py-2">id</th>
            <th class="border px-4 py-2">이름</th>
            <th class="border px-4 py-2">이메일</th>
            <th class="border px-4 py-2">전화번호</th>
            <th class="border px-4 py-2">포인트</th>
        </tr>
        </thead>
        <tbody id="table-body">
        <tr th:each="member : ${memberDTOList}">
            <td class="border px-4 py-2" th:text="${member.id}">홍길동</td>
            <td class="border px-4 py-2" th:text="${member.name}">홍길동</td>
            <td class="border px-4 py-2" th:text="${member.email}">hong@test.com</td>
            <td class="border px-4 py-2" th:text="${member.phoneNumber}"></td>
            <td class="border px-4 py-2" th:text="${member.totalPoint == null ? 0 : member.totalPoint}"></td>

        </tr>
        </tbody>
    </table>



</div>
</body>
</html>
