
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Fontawesome 연결 Embed Code Start-->
    <script src="https://kit.fontawesome.com/0f39c44f6d.js" crossorigin="anonymous"></script> <!-- Fontawesome 연결 -->
    <!-- Fontawesome 연결 Embed Code End-->
    <script src="https://cdn.tailwindcss.com"></script>
    <title>전문가 승인</title>

    
</head>
<body class="h-screen flex flex-col">

    <!-- 헤더 (햄버거 버튼) -->
    <div th:replace="fragments/adminFragments :: hamburger"></div>

    <div class="flex flex-1">
        <div th:replace="fragments/adminFragments :: sideBar"></div>

        <main class="flex-1 p-6 bg-gray-100">
            <h1 class="text-2xl font-bold mb-4">전문가 가입 요청 목록</h1>
            <form th:action="@{/admin/approve-expert}" method="post">

                <!-- 페이징 요청 정보 숨겨서 전달 -->
                <!-- <input type="hidden" name="page" th:value="${result.page}" />
                <input type="hidden" name="size" th:value="${result.size}" />
                <input type="hidden" name="sort" th:value="${'createAt'}" />
                <input type="hidden" name="direction" th:value="${'desc'}" /> -->
            
                <table class="w-full table-auto border text-center">
                    <thead>
                    <tr>
                        <th class="border px-4 py-2 ">
                            <input type="checkbox" id="select-all" onclick="toggleCheckboxes(this)">
                        </th>
                        <th class="border px-4 py-2">id</th>
                        <th class="border px-4 py-2">이름</th>
                        <th class="border px-4 py-2">이메일</th>
                        <th class="border px-4 py-2">전화번호</th>
                        <th class="border px-4 py-2">면허</th>
                        <th class="border px-4 py-2">전공</th>
                        <th class="border px-4 py-2">경력</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="dto : ${result.dtoList}">
                        <td class="border px-4 py-2">
                            <input type="checkbox" class="ids ${dto.id}" name="ids" th:value="${dto.id}" />
                        </td>
                        <td class="border px-4 py-2" th:text="${dto.id}"></td>
                        <td class="border px-4 py-2" th:text="${dto.name}"></td>
                        <td class="border px-4 py-2" th:text="${dto.email}"></td>
                        <td class="border px-4 py-2" th:text="${dto.phoneNumber}"></td>
                        <td class="border px-4 py-2" th:text="${dto.license}"></td>
                        <td class="border px-4 py-2" th:text="${dto.major}"></td>
                        <td class="border px-4 py-2" th:text="${dto.career}"></td>
                    </tr>
                    </tbody>
                </table>
            
                <!-- 일괄 승인 버튼 -->
                <div class="mt-4 flex justify-end">
                    <button type="submit"
                            class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">
                        선택 승인
                    </button>
                </div>
            </form>
            
        
            <!-- 페이징 -->
            <div class="mt-4 flex justify-center gap-2" id="pagination">
                <!-- ◀ 이전 페이지 이동 -->
                <a th:href="${result.startPage - 1 > 0} ? @{/admin/expert-applicants(page=${result.startPage - 1}, size=10, sort='createdAt', direction='desc')} : '#'"
                    th:classappend="${result.startPage - 1 <= 0} ? 'pointer-events-none opacity-50' : ''"
                    class="px-3 py-1 rounded bg-gray-300 hover:bg-gray-400">
                    ◀
                </a>
        
                <!-- 페이지 번호 목록 -->
                <a th:each="p : ${result.pageList}"
                        th:text="${p}"
                        th:href="@{/admin/expert-applicants(page=${p}, size=10, sort='createdAt', direction='desc')}"
                        th:classappend="${p == result.page} ? 'bg-blue-500 text-white' : 'bg-gray-200'"
                        class="px-3 py-1 rounded hover:bg-blue-500">
                </a>
        
                <!-- ▶ 다음 페이지 이동 -->
                <a th:href="${result.endPage + 1 < result.totalPages} ? @{/admin/expert-applicants(page=${result.endPage + 1}, size=10, sort='createdAt', direction='desc')} : '#'"
                        th:classappend="${result.endPage + 1 >= result.totalPages} ? 'pointer-events-none opacity-50' : ''"
                        class="px-3 py-1 rounded bg-gray-300 hover:bg-gray-400">
                    ▶
                </a>
            </div>
        </div>
        </main>
    
    </div>

<script>
    function toggleCheckboxes(master) {
        document.querySelectorAll('input[name="ids"]').forEach(cb => cb.checked = master.checked);
    }
</script>    
<!-- 스크립트 -->
<script th:src="@{/js/admin/adminSideBar.js}"></script>
</body>
</html>
