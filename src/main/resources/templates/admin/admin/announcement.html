<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/admin_layout">
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
        <div class="relative flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">공지사항</h1>
        </div>
        <hr class="mb-8 border-gray-300">

        <div class="space-y-6 mb-6">
            <div class="flex gap-4">
                <div class="w-1/5">
                    <p class="text-sm font-medium text-gray-700 mb-1">작성일</p>
                    <p th:text="${anc.createdAt}" class="py-2 px-3 text-center bg-gray-100 rounded-md"></p>
                </div>
                <div class="w-4/5"></div>
            </div>

            <div>
                <p class="text-sm font-medium text-gray-700 mb-1">제목</p>
                <p th:text="${anc.title}" class="py-2 px-3 bg-gray-100 rounded-md"></p>
            </div>

            <div>
                <p class="text-sm font-medium text-gray-700 mb-1">내용</p>
                <div th:text="${anc.content}" class="p-4 bg-gray-100 rounded-md whitespace-pre-wrap"></div>
            </div>
        </div>

        <div class="flex justify-center gap-4 mb-6">
            <a href="/admin/announcement" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">목록</a>
            <a th:href="@{/community/announcement/{id}/edit(id=${anc.id})}"
               class="inline-flex items-center bg-[#7CA48C] text-white px-4 py-2 rounded hover:opacity-90">
                <i class="fas fa-edit mr-2"></i>수정
            </a>
            <form th:action="@{/community/announcement/{id}/delete(id=${anc.id})}"
                  method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                <button type="submit"
                        class="inline-flex items-center bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    <i class="fas fa-trash mr-2"></i>삭제
                </button>
            </form>
        </div>
    </div>
</th:block>
</html>
