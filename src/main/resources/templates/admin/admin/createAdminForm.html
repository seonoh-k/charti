<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
</head>
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 rounded">
        <h1 class="text-2xl font-bold mb-4">관리자 계정 생성 페이지</h1>
        <form th:action="@{/admin/create/admin}" method="post" class="space-y-4 bg-white p-6 rounded shadow-md" id="admin-create-Form">
            <div>
                <label class="block mb-1 text-sm font-medium">이름</label>
                <input id="name" name="name" class="w-full border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500 transition" />
                <p id="name-error-message" class="text-red-600" ></p>
            </div>
            <div>
                <label class="block mb-1 text-sm font-medium">업무분장</label>
                <input id="position" type="text" name="position" class="w-full border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500 transition" />
                <p id="position-error-message" class="text-red-600" ></p>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium">이메일</label>
                <input id="username" type="email" name="username" class="w-full border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500 transition" />
                <p id="username-error-message" class="text-red-600" ></p>
            </div>
            <div>
                <label class="block mb-1 text-sm font-medium">비밀먼호</label>
                <input id="password" type="password" name="password" class="w-full border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500 transition" />
                <p id="password-error-message" class="text-red-600" ></p>
            </div>
            <div>
                <label class="block mb-1 text-sm font-medium">전화번호</label>
                <div class="flex space-x-2">
                    <!-- 국가번호 (+82 고정) -->
                    <select id="countryCode" name="countryCode"
                            class="w-24 bg-gray-100 border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500 cursor-not-allowed"
                            readonly>
                        <option value="+82">+82</option>
                    </select>
                    <!-- 국번 (010 고정) -->
                    <select id="phonePrefix" name="phonePrefix"
                            class="w-20 border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500 cursor-not-allowed" readonly>
                        <option value="10">010</option>
                    </select>
                    <!-- 나머지 4자리 (첫 번째) -->
                    <input id="phonePart1" type="text" name="phonePart1" minlength="4" maxlength="4" placeholder="1234"
                           class="w-20 border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500" />
                    <!-- 나머지 4자리 (두 번째) -->
                    <input id="phonePart2" type="text" name="phonePart2" minlength="4" maxlength="4" placeholder="5678"
                           class="w-20 border border-2 border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-500" />
                </div>
                <p id="phoneNumber-error-message" class="text-red-600 mt-1"></p>
            </div>

            <div class="pt-4 flex flex-row justify-end">
                <button type="button" onclick="showModal()" class="bg-gray-600 hover:bg-gray-400 text-white px-4 py-2 rounded">
                    생성하기
                </button>
            </div>
        </form>
    </div>






<div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded shadow-lg text-center w-80">
        <p class="text-lg mb-4">정말 생성하시겠습니까?</p>
        <div class="flex justify-center gap-4">
            <button onclick="confirmCreate()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">확인</button>
            <button onclick="hideModal()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">취소</button>
        </div>
    </div>
</div>



<script>


    function showModal() {
        document.getElementById("confirmModal").classList.remove("hidden");
    }
    function hideModal() {
        document.getElementById("confirmModal").classList.add("hidden");
    }
    function confirmCreate() {
        hideModal();
        createAdmin();
    }


    async function createAdmin(){
        const form = document.getElementById("admin-create-Form");
        const formData = new FormData(form);
        const data = {};

        formData.forEach((value,key) => {
            data[key] = value;

        });
        // 기타 필드 매핑
        formData.forEach((value, key) => {
            if (!['countryCode','phonePrefix','phonePart1','phonePart2'].includes(key)) {
                data[key] = value;
            }
        });

        // 전화번호 조립 (+82-010-1234-5678)
        const cc    = formData.get('countryCode');   // "+82"
        const pre   = formData.get('phonePrefix');   // "010"
        const part1 = formData.get('phonePart1');    // "1234"
        const part2 = formData.get('phonePart2');    // "5678"
        data.phoneNumber = `${cc}${pre}-${part1}-${part2}`;

        const res = await fetch(`/admin/check/admin`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await res.json();
        if (result.code === 'OK') {
            showToast("회원가입 절차 진행 중", 'success',3000);

            const adminRes = await fetch(`/admin/create/admin`,{
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const createResult = await adminRes.json();
            
            if(createResult.code === "OK"){
                showToast("계정 생성 절차 진행 중", 'success',3000);

                setTimeout(() => {
                    window.location.href = `/admin/main`;
                }, 1500);
            } else if(createResult.code === "UVF"){
                showToast(createResult.message || '생성 중 오류 발생','error',3000);

                const p = document.getElementById(`username-error-message`);
                p.textContent = createResult.message;
            } else if(createResult.code === "PVF"){
                showToast(createResult.message || '생성 중 오류 발생','error',3000);
                const p = document.getElementById(`phoneNumber-error-message`);
                p.textContent = createResult.message;
            } else{
                showToast(createResult.message || '생성 중 오류 발생','error',3000);
            }



        } else {
            showToast(result.message || '생성 중 오류 발생','error',3000);
            // 1) 기존 에러 메시지 모두 초기화
            ['name','position','username','password','phoneNumber'].forEach(field => {
                const p = document.getElementById(`${field}-error-message`);
                if (p) p.textContent = '';
            });

            // 2) error 배열 순회, 같은 필드에 메시지 여러 개면 첫 번째만 출력
            result.data.forEach(err => {
                const p = document.getElementById(`${err.field}-error-message`);

                if (p && !p.textContent) {
                    p.textContent = err.message;
                }
            });

        }
    }

    function showToast(message, type = 'success', duration = 3000) {

        const container = document.getElementById("toast-container");

        const colors = {
            success: {
                bg: "bg-green-500",
                icon: "✅"
            },
            error: {
                bg: "bg-red-500",
                icon: "❌"
            }
        };

        const toast = document.createElement("div");
        toast.className = `flex items-center text-white px-4 py-2 rounded shadow-lg ${colors[type].bg} animate-slide-in-right`;
        toast.innerHTML =
        `<span class="mr-2">${colors[type].icon}</span>
        <span>${message}</span>`;

        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.remove("animate-slide-in-right");
            toast.classList.add("animate-fade-out");

            setTimeout(() => container.removeChild(toast), 5000);

        }, duration);
    }
</script>


<div id="toast-container" class="fixed inset-x-0 top-0 z-50 space-y-3 text-center"></div>
</th:block>
</html>
