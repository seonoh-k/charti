<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/admin_layout">
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
        <div class="flex justify-between">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">공지사항</h1>
            <a th:href="@{/community/announcement/new}"
               class="inline-flex mt-2 p-2 h-10 items-center bg-[#374151] active:opacity-90 text-white font-semibold rounded hover:opacity-90 transition">
                <i class="fas fa-plus mr-2"></i>새 공지 작성
            </a>
        </div>
        <hr class="mb-8 border-gray-300">

        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="min-w-full divide-y divide-gray-200 table-fixed">
                <thead class="bg-gray-50">
                <tr>
                    <th class="w-[10%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        번호
                    </th>
                    <th class="w-[60%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        제목
                    </th>
                    <th class="w-[20%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        작성일
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="anc : ${boardList}">
                    <td th:text="${anc.id}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"></td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <a th:href="@{/admin/announcement/{id}(id=${anc.id})}" th:text="${anc.title}"
                           class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></a>
                    </td>
                    <td th:text="${anc.createdAt}"
                        class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-center mt-6">
            <nav id="pagination"
                 th:data-current-page="${currentPage}"
                 th:data-total-pages="${totalPages}"
                 class="inline-flex space-x-2">

            </nav>
        </div>
    </div>
    <script>

        document.addEventListener("DOMContentLoaded", () => {
            const nav = document.querySelector("#pagination");
            const current = Number(nav.dataset.currentPage);
            const total = Number(nav.dataset.totalPages);

            function pageBtn(label, page, opts = {}) {
                const { active = false, disabled = false } = opts;
                const a = document.createElement("a");

                a.className = "px-3 py-1 rounded hover:bg-[#374151] hover:text-white transition"

                if(typeof label === "number") {
                    a.textContent = label;
                }else if(label === "first") {
                    const i = document.createElement("i");
                    i.className = "fas fa-angle-double-left";
                    a.appendChild(i)
                }else if(label === "end") {
                    const i = document.createElement("i");
                    i.className = "fas fa-angle-double-right";
                    a.appendChild(i)
                }else {
                    const i = document.createElement("i");
                    i.className = label === "left" ? "fas fa-angle-left" : "fas fa-angle-right";
                    a.appendChild(i)
                }

                if(active) {
                    a.classList.add("bg-[#374151]", "text-white");
                }else {
                    a.classList.add("bg-gray-200", "text-[#374151]");
                }

                if (disabled) {
                    a.href = "javascript:;";
                    a.classList.add("hidden");
                } else {
                    a.href = buildUrl(page);
                    a.classList.remove("hidden");
                }

                return a;
            }

            nav.appendChild(pageBtn("first", 1, {
                disabled: current === 1,
            }));

            nav.appendChild(pageBtn("left", current-1, {
                disabled: current === 1,
            }));

            for(let p=1; p<=total; p++) {
                nav.appendChild(pageBtn(p, p, {
                    active: p === current,
                }));
            }

            nav.appendChild(pageBtn("right", current+1, {
                disabled: current === total,
            }));

            nav.appendChild(pageBtn("end", total, {
                disabled: current === total,
            }));
        })
    </script>
</th:block>
</html>
