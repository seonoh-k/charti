<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <title>기록 문진 등록/수정</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<th:block layout:fragment="content">
    <div class="max-w-4xl mx-auto bg-white shadow p-6 mt-8 rounded">
        <h1 class="text-2xl font-bold mb-4" th:text="${survey.surveyId == null ? '문진 등록' : '문진 수정'}"></h1>

        <form th:action="${survey.surveyId == null} ? @{/admin/surveys/record} : @{'/admin/surveys/record/' + ${survey.surveyId}}"
              method="post"
              th:object="${survey}">

            <!-- 연령대 선택 -->
            <div class="mb-4">
                <label class="block mb-1 font-semibold">연령대</label>
                <select th:field="*{ageGroup}" class="w-full border p-2 rounded">
                    <option value="" disabled>선택하세요</option>
                    <option th:each="ag : ${ageGroups}"
                            th:value="${ag.name()}"
                            th:text="${ag.displayName}"
                            th:selected="${survey.ageGroup == ag}"></option>
                </select>
                <div th:if="${#fields.hasErrors('ageGroup')}" class="text-red-500 text-sm mt-1" th:errors="*{ageGroup}"></div>
            </div>

            <!-- 질문 입력 -->
            <div class="mb-4">
                <label class="block mb-1 font-semibold">질문</label>
                <textarea th:field="*{question}" rows="3" class="w-full border p-2 rounded"></textarea>
                <div th:if="${#fields.hasErrors('question')}" class="text-red-500 text-sm mt-1" th:errors="*{question}"></div>
            </div>

            <!-- 예시 답변 입력 -->
            <div class="mb-6">
                <label class="block mb-1 font-semibold">예시 답변</label>
                <input th:field="*{answer}" type="text" class="w-full border p-2 rounded"/>
            </div>

            <div class="flex justify-end gap-2">
                <a href="/admin/surveys/record" class="px-4 py-2 border rounded text-gray-700 hover:bg-gray-100">목록</a>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">저장</button>
            </div>
        </form>
    </div>
</th:block>
</html>
