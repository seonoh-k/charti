<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 데일리 문진 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
        <div class="flex justify-center mt-3 mb-5 space-x-6">
            <a href="/admin/surveys/daily" class="bg-gray-400 text-white p-3 rounded-lg w-[150px] text-center hover:bg-gray-500">
                문진 목록
            </a>
            <a href="/admin/surveys/daily/history" class="bg-gray-400 text-white p-3 rounded-lg w-[150px] text-center hover:bg-gray-500">
                문진 이력
            </a>
        </div>
        <h1 class="text-2xl font-semibold mb-4">관리자 - 데일리 문진 목록</h1>

        <form th:action="@{/admin/surveys/daily}" method="get" class="flex gap-4 items-center mb-6">
            <label class="flex items-center gap-2">
                <span>연령대:</span>
                <select name="ageGroup" class="border p-2 rounded">
                    <option value="ALL"
                            th:selected="${ageGroup == T(com.example.demo.enums.AgeGroup).ALL}">
                        전체 연령대
                    </option>
                    <option th:each="age : ${ageGroups}"
                            th:value="${age.name()}"
                            th:text="${age.displayName}"
                            th:selected="${age == ageGroup}">
                    </option>
                </select>
            </label>

            <label class="flex items-center gap-2">
                <span>카테고리:</span>
                <select name="category" class="border p-2 rounded">
                    <option value="ALL"
                            th:selected="${category == T(com.example.demo.enums.SurveyCategory).ALL}">
                        전체 카테고리
                    </option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.name()}"
                            th:text="${cat.displayName}"
                            th:selected="${cat == category}">
                    </option>
                </select>
            </label>

            <button type="submit" class="bg-blue-500 text-white py-1 px-4 rounded">
                검색
            </button>

            <a th:href="@{/admin/surveys/daily/new}"
               class="bg-green-600 text-white px-4 py-1 rounded">
                데일리 문진 추가
            </a>

        </form>

        <table class="w-full table-auto border-collapse">
            <thead>
            <tr class="bg-gray-100">
                <th class="border p-2">연령대</th>
                <th class="border p-2">카테고리</th>
                <th class="border p-2">질문</th>
                <th class="border p-2">가중치</th>
                <th class="border p-2">수정/삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${surveys}" class="hover:bg-gray-50">
                <td class="border p-2" th:text="${s.ageGroup.displayName}"></td>
                <td class="border p-2" th:text="${s.category.displayName}"></td>
                <td class="border p-2" th:text="${s.question}"></td>
                <td class="border p-2" th:text="${s.weight}"></td>
                <td class="border p-2">
                    <a th:href="@{/admin/surveys/daily/{id}/edit(id=${s.id})}"
                       class="text-blue-600 mr-3 hover:underline">수정</a>
                    <form th:action="@{/admin/surveys/daily/{id}/delete(id=${s.id})}"
                          method="post" class="inline"
                          onsubmit="return confirm('삭제하시겠습니까?');">
                        <button type="submit" class="text-red-600 hover:underline">
                            삭제
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- 페이징 내비 -->
        <div class="mt-4 flex justify-center gap-2">
            <a th:if="${surveys.hasPrevious()}"
               th:href="@{/admin/surveys/daily(
                     ageGroup=${ageGroup},
                     category=${category},
                     page=0)}"
               class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                <i class="fas fa-angle-double-left"></i>
            </a>
            <a th:if="${surveys.hasPrevious()}"
               th:href="@{/admin/surveys/daily(
                     ageGroup=${ageGroup},
                     category=${category},
                     page=${surveys.number-1})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                <i class="fas fa-angle-left"></i>
            </a>

            <a th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, surveys.number - 4),
                    T(java.lang.Math).min(surveys.totalPages-1, surveys.number+4))}"
               th:href="@{/admin/surveys/daily(
                        ageGroup=${ageGroup},
                        category=${category},
                        page=${i})}"
               th:classappend="${i == surveys.number} ? 'bg-[#E3A67A] text-white' : 'bg-gray-200 text-[#E3A67A]'"
               th:text="${i+1}" class="px-3 py-1 rounded hover:bg-[#E3A67A] hover:text-white transition">
                1
            </a>

            <a th:if="${surveys.hasNext()}"
               th:href="@{/admin/surveys/daily(
                     ageGroup=${ageGroup},
                     category=${category},
                     page=${surveys.number+1})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                <i class="fas fa-angle-right"></i>
            </a>
            <a th:if="${surveys.hasNext()}"
               th:href="@{/admin/surveys/daily(
                     ageGroup=${ageGroup},
                     category=${category},
                     page=${surveys.totalPages - 1})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#E3A67A] hover:bg-[#E3A67A] hover:text-white transition">
                <i class="fas fa-angle-double-right"></i>
            </a>
        </div>
    </div>
</th:block>
</html>
