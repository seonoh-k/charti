<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${survey.id} == null ? '관리자 - 문진 추가' : '관리자 - 문진 수정'">
        관리자 - 문진
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-7xl mx-auto bg-white shadow p-6 mt-8 mb-8 rounded">
        <h1 th:text="${survey.id} == null ? '문진 추가' : '문진 수정'"
            class="text-2xl font-semibold mb-6"></h1>

        <form th:action="${survey.id} == null
                         ? @{/admin/surveys/group}
                         : @{/admin/surveys/group/{id}(id=${survey.id})}"
              method="post" class="space-y-4 max-w-lg">
            <!-- 연령대 -->
            <label class="block">
                <span class="block m10b-1">연령대</span>
                <select name="ageGroup" class="border p-2 rounded w-full" required>
                    <option th:each="age : ${ageGroups}"
                            th:value="${age.name()}"
                            th:text="${age.displayName}"
                            th:selected="${age == survey.ageGroup}">
                    </option>
                </select>
            </label>

            <!-- 카테고리 -->
            <label class="block">
                <span class="block mb-1">카테고리</span>
                <select name="category" class="border p-2 rounded w-full" required>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.name()}"
                            th:text="${cat.displayName}"
                            th:selected="${cat == survey.category}">
                    </option>
                </select>
            </label>

            <!-- 대상 그룹 -->
            <label class="block">
                <span class="block mb-1">대상 그룹</span>
                <select name="targetGroup" class="border p-2 rounded w-full" required>
                    <!-- ALL 옵션 -->
                    <option th:value="${T(com.example.demo.enums.TargetGroup).ALL.name()}"
                            th:text="'전체 그룹'"
                            th:selected="${survey.rawTargetGroup == T(com.example.demo.enums.TargetGroup).ALL}">
                    </option>
                    <!-- 실제 enum 옵션들 -->
                    <option th:each="tg : ${targetGroups}"
                            th:value="${tg.name()}"
                            th:text="${tg.displayName}"
                            th:selected="${survey.rawTargetGroup == tg}">
                    </option>
                </select>
            </label>

            <!-- 질문 -->
            <label class="block">
                <span class="block mb-1">질문</span>
                <input type="text" name="question"
                       th:value="${survey.question}"
                       class="border p-2 rounded w-full"
                       required/>
            </label>

            <!-- 답변 1~5 -->
            <div class="grid grid-cols-1 gap-3">
                <label class="block">
                    <span class="block mb-1">답변 1</span>
                    <input type="text" name="answer1"
                           th:value="${survey.answer1}"
                           class="border p-2 rounded w-full" required/>
                </label>
                <label class="block">
                    <span class="block mb-1">답변 2</span>
                    <input type="text" name="answer2"
                           th:value="${survey.answer2}"
                           class="border p-2 rounded w-full" required/>
                </label>
                <label class="block">
                    <span class="block mb-1">답변 3</span>
                    <input type="text" name="answer3"
                           th:value="${survey.answer3}"
                           class="border p-2 rounded w-full" required/>
                </label>
                <label class="block">
                    <span class="block mb-1">답변 4</span>
                    <input type="text" name="answer4"
                           th:value="${survey.answer4}"
                           class="border p-2 rounded w-full" required/>
                </label>
                <label class="block">
                    <span class="block mb-1">답변 5</span>
                    <input type="text" name="answer5"
                           th:value="${survey.answer5}"
                           class="border p-2 rounded w-full" required/>
                </label>
            </div>

            <button type="submit"
                    class="bg-[#374151] text-white py-2 px-4 rounded hover:opacity-90">
                저장
            </button>
        </form>
    </div>
</th:block>
</html>
