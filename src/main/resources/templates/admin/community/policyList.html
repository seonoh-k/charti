<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>관리자 – 정책정보 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<th:block layout:fragment="content">

    <div class="container max-w-5xl mx-auto p-6 bg-white shadow rounded-lg">

        <h2 class="text-2xl font-bold mb-4">정책정보 게시판 관리</h2>

        <!-- 필터 폼 -->
        <form th:action="@{/admin/community/policy/list}" method="get"
              class="flex items-end gap-4 mb-6">

            <div class="flex flex-col">
                <label class="text-gray-700 font-medium mb-1">카테고리</label>
                <select name="subCategory"
                        class="w-32 h-11 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="전체" th:selected="${subCategory == '전체'}">전체</option>
                    <option th:each="c : ${subCategories}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${c == subCategory}"/>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-gray-700 font-medium mb-1">연령대</label>
                <select name="ageGroup"
                        class="w-32 h-11 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option th:value="${T(com.example.demo.enums.AgeGroup).ALL}"
                            th:selected="${ageGroup == T(com.example.demo.enums.AgeGroup).ALL}">
                        전체
                    </option>
                    <option th:each="a : ${ageGroups}"
                            th:value="${a}"
                            th:text="${a.displayName}"
                            th:selected="${a == ageGroup}"/>
                </select>
            </div>

            <div class="flex flex-col flex-1 min-w-[200px]">
                <label class="text-gray-700 font-medium mb-1">제목</label>
                <input type="text" name="keyword"
                       placeholder="제목 검색"
                       th:value="${keyword}"
                       class="w-full h-11 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div class="flex flex-col">
                <label class="text-gray-700 font-medium mb-1">정렬</label>
                <select name="sort"
                        class="h-11 w-32 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="popular" th:selected="${sort == 'popular'}">인기순</option>
                    <option value="new"     th:selected="${sort == 'new'}">최신순</option>
                </select>
            </div>

            <button class="h-11 bg-[#374151] text-white font-semibold px-6 py-2 rounded hover:opacity-90 transition">
                검색</button>
        </form>

        <!-- 게시글 리스트 -->
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white rounded-lg overflow-hidden">
                <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-2 text-left">카테고리</th>
                    <th class="px-4 py-2 text-left">제목</th>
                    <th class="px-4 py-2 text-left">연령대</th>
                    <th class="px-4 py-2 text-left">조회수</th>
                    <th class="px-4 py-2 text-left">작성일</th>
                    <th class="px-4 py-2 text-left">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${boards}" class="hover:bg-gray-50">
                    <td class="px-4 py-3" th:text="${b.category2}">카테고리</td>
                    <td class="px-4 py-3 text-[#374151] hover:underline">
                        <a th:href="@{/admin/community/policy/{id}(id=${b.communityId})}"
                           th:text="${b.title}">제목</a>
                    </td>
                    <td class="px-4 py-3" th:text="${b.ageGroup.displayName}">연령대</td>
                    <td class="px-4 py-3" th:text="${b.views}">조회수</td>
                    <td class="px-4 py-3"
                        th:text="${#temporals.format(b.createdAt,'yyyy.MM.dd')}">작성일</td>
                    <td class="px-4 py-3 space-x-2">
                        <a th:href="@{/admin/community/policy/{id}/edit(id=${b.communityId})}"
                           class="text-blue-400">수정</a>
                        <form th:action="@{/admin/community/policy/{id}/delete(id=${b.communityId})}"
                              method="post" class="inline"
                              onsubmit="return confirm('삭제하시겠습니까?');">
                            <button class="text-red-400">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(boards)}">
                    <td colspan="6" class="px-4 py-6 text-center text-gray-500">
                        검색 결과가 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이징 -->
        <nav th:if="${pageData.totalElements > 0}"
             class="mt-6 flex justify-center space-x-2">
            <a th:if="${pageData.hasPrevious()}"
               th:href="@{/admin/community/policy/list(
                 page=0,
                 subCategory=${subCategory},
                 ageGroup=${ageGroup},
                 keyword=${keyword},
                 sort=${sort})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#374151] hover:bg-[#374151] hover:text-white transition">
                <i class="fas fa-angle-double-left"></i>
            </a>

            <a th:if="${pageData.hasPrevious()}"
               th:href="@{/admin/community/policy/list(
                 page=${pageData.number-1},
                 subCategory=${subCategory},
                 ageGroup=${ageGroup},
                 keyword=${keyword},
                 sort=${sort})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#374151] hover:bg-[#374151] hover:text-white transition">
                <i class="fas fa-angle-left"></i>
            </a>

            <a th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}"
               th:href="@{/admin/community/policy/list(
               page=${i},
               subCategory=${subCategory},
               ageGroup=${ageGroup},
               keyword=${keyword},
               sort=${sort})}"
               th:text="${i + 1}"
               th:classappend="${i == pageData.number} ? 'bg-[#374151] text-white' : 'bg-gray-200 text-[#374151]'"
               class="px-3 py-1 rounded hover:bg-[#374151] hover:text-white transition"/>

            <a th:if="${pageData.hasNext()}"
               th:href="@{/admin/community/policy/list(
                 page=${pageData.number+1},
                 subCategory=${subCategory},
                 ageGroup=${ageGroup},
                 keyword=${keyword},
                 sort=${sort})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#374151] hover:bg-[#374151] hover:text-white transition">
                <i class="fas fa-angle-right"></i>
            </a>

            <a th:if="${pageData.hasNext()}"
               th:href="@{/admin/community/policy/list(
                 page=${pageData.totalPages - 1},
                 subCategory=${subCategory},
                 ageGroup=${ageGroup},
                 keyword=${keyword},
                 sort=${sort})}"
               class="px-3 py-1 rounded bg-gray-200 text-[#374151] hover:bg-[#374151] hover:text-white transition">
                <i class="fas fa-angle-double-right"></i>
            </a>
        </nav>
    </div>
</th:block>
</html>
