<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_layout}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>관리자 – 정책정보 게시글 상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6 bg-white shadow rounded-lg">
        <!-- 제목 + 메타 -->
        <h1 class="text-3xl font-bold text-[#374151] mb-4" th:text="${board.title}">제목</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-gray-700 mb-6">
            <p><span class="font-medium">카테고리:</span> <span th:text="${board.category2}"/></p>
            <p><span class="font-medium">연령대:</span>  <span th:text="${board.ageGroup.displayName}"/></p>
            <p><span class="font-medium">조회수:</span>  <span th:text="${board.views}"/></p>
            <p><span class="font-medium">작성자:</span>  <span th:text="${authorNickname}"/></p>
            <p><span class="font-medium">작성일:</span>
                <span th:text="${#temporals.format(board.createdAt,'yyyy.MM.dd HH:mm')}"/></p>
        </div>
        <hr class="my-4"/>
        <div class="prose max-w-none mb-6" th:utext="${board.content}"/>

        <!-- 게시글 관리 버튼 -->
        <div class="flex gap-4 mb-6">
            <a th:href="@{/admin/community/policy/{id}/edit(id=${board.communityId})}"
               class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                수정
            </a>
            <form th:action="@{/admin/community/policy/{id}/delete(id=${board.communityId})}"
                  method="post"
                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                <button class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-300">
                    삭제
                </button>
            </form>
            <a th:href="@{/admin/community/policy/list}"
               class="bg-[#374151] text-white px-4 py-2 rounded hover:opacity-90">목록</a>
        </div>

        <!-- 댓글 리스트 -->
        <h3 class="text-xl font-semibold text-gray-800 mb-4">댓글</h3>
        <div class="space-y-4 mb-6">
            <div th:each="c, stat : ${commentList}"
                 class="bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <p class="text-gray-800">
                            <span class="font-semibold text-[#374151]"
                                  th:text="${commentNicknames[stat.index]}">닉네임</span>
                            <span>·</span>
                            <span th:text="${c.content}">댓글 내용</span>
                        </p>
                        <p class="text-xs text-gray-400 mt-1"
                           th:text="${#temporals.format(c.createdAt,'yyyy.MM.dd HH:mm')}">
                            2025.07.03 12:34
                        </p>
                    </div>
                    <div class="ml-4 flex-shrink-0 flex space-x-2">
                        <!-- 수정 모달 오픈 버튼 -->
                        <button type="button"
                                class="text-blue-400 text-sm"
                                th:attr="data-comment-id=${c.id},data-comment-content=${c.content}"
                                onclick="openCommentModal(this)">
                            수정
                        </button>
                        <form th:action="@{/admin/community/policy/{boardId}/comments/{commentId}/delete(
                                boardId=${board.communityId},
                                commentId=${c.id})}"
                              method="post"
                              onsubmit="return confirm('댓글을 삭제하시겠습니까?');">
                            <button class="text-red-400 text-sm">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- 댓글이 없을 때 -->
            <div th:if="${#lists.isEmpty(commentList)}"
                 class="text-center text-gray-500 py-6">
                등록된 댓글이 없습니다.
            </div>
        </div>
    </div>

    <!-- 페이징 네비 -->
    <nav th:if="${commentPageData.totalElements > 0}"
         class="mt-4 flex items-center justify-center space-x-2">
        <a th:if="${commentPageData.hasPrevious()}"
           th:href="@{/admin/community/policy/{id}(id=${board.communityId}, commentPage=${commentPageData.number-1})}"
           class="px-3 py-1 rounded bg-gray-200 text-[#374151] hover:bg-[#374151] hover:text-white transition">
            <i class="fas fa-angle-left"></i>
        </a>

        <span th:each="i : ${#numbers.sequence(0, commentPageData.totalPages - 1)}">
                    <a th:href="@{/admin/community/policy/{id}(id=${board.communityId}, commentPage=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == commentPageData.number} ? 'bg-[#374151] text-white' : 'bg-gray-200 text-[#374151]'"
                       class="px-3 py-1 rounded hover:bg-[#374151] hover:text-white transition"/>
                </span>

        <a th:if="${commentPageData.hasNext()}"
           th:href="@{/admin/community/policy/{id}(id=${board.communityId}, commentPage=${commentPageData.number+1})}"
           class="px-3 py-1 rounded bg-gray-200 text-[#374151] hover:bg-[#374151] hover:text-white transition">
            <i class="fas fa-angle-right"></i>
        </a>
    </nav>

    <!-- 댓글 수정 모달 -->
    <div id="commentModal"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-2/3 max-w-lg">
            <h2 class="text-xl font-semibold mb-4">댓글 수정</h2>
            <form id="commentForm" method="post" class="space-y-4">
                <textarea id="commentContent" name="content"
                          class="w-full border rounded px-3 py-2"
                          rows="4"></textarea>
                <div class="flex justify-end space-x-2">
                    <button type="button"
                            class="px-4 py-2 border rounded hover:bg-gray-100"
                            onclick="closeCommentModal()">
                        취소
                    </button>
                    <button type="submit"
                            class="px-4 py-2 bg-[#374151] text-white rounded hover:opacity-90">
                        저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const boardId = /*[[${board.communityId}]]*/ 0;

        function openCommentModal(btn) {
            const commentId = btn.getAttribute('data-comment-id');
            const content   = btn.getAttribute('data-comment-content');
            const form      = document.getElementById('commentForm');
            const textarea  = document.getElementById('commentContent');

            textarea.value = content;
            form.action    = `/admin/community/policy/${boardId}/comments/${commentId}`;
            document.getElementById('commentModal').classList.remove('hidden');
        }

        function closeCommentModal() {
            document.getElementById('commentModal').classList.add('hidden');
        }
        /*]]>*/
    </script>

</th:block>
</html>
