<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title th:text="${set.setTitle} + ' 상세'">상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<th:block layout:fragment="content">
    <h1 class="text-2xl font-bold mb-2" th:text="${set.setTitle}">세트명</h1>
    <div class="mb-4 space-x-4">
        <span>연령대: <strong th:text="${set.ageGroup=='various'?'통합':set.ageGroup}">연령</strong></span>
        <span>카테고리: <strong th:text="${set.category=='various'?'통합':set.category}">카테고리</strong></span>
        <span>종류: <strong th:text="${set.type=='GROUP'?'그룹문진':'특별문진'}">종류</strong></span>
        <span>작성일: <strong th:text="${#temporals.format(set.createdAt,'yyyy.MM.dd')}">날짜</strong></span>
    </div>

    <h2 class="text-xl font-semibold mb-2">문진 리스트</h2>
    <ul class="list-disc pl-5 space-y-1">
        <li th:each="s : ${surveys}"
            th:text="${s.question}">
            문진 질문</li>
    </ul>

    <div class="mt-6 space-x-2">
        <a th:href="@{|/surveySets/${set.setId}/edit|}"
           class="bg-yellow-500 text-white px-4 py-1 rounded">수정</a>
        <a th:href="@{/surveySets}"
           class="bg-gray-500 text-white px-4 py-1 rounded">목록</a>
    </div>
</th:block>
</body>
</html>
