<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${set.setTitle} + ' 상세'">상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body>
<th:block layout:fragment="content">
    <h1 class="text-2xl font-bold mb-2" th:text="${set.setTitle}">세트명</h1>

    <div class="mb-4 space-x-4">
        <!-- enum.displayName + VARIOUS → '통합' -->
        <span>연령대:
      <strong th:text="${set.ageGroup == T(com.example.demo.enums.AgeGroup).VARIOUS
                        ? '통합'
                        : set.ageGroup.displayName}">
      </strong>
    </span>
        <span>카테고리:
      <strong th:text="${set.category == T(com.example.demo.enums.SurveyCategory).VARIOUS
                        ? '통합'
                        : set.category.displayName}">
      </strong>
    </span>
        <span>종류:
      <strong th:text="${set.type=='GROUP'?'그룹문진':'특별문진'}"></strong>
    </span>
        <span>작성일:
      <strong th:text="${#temporals.format(set.createdAt,'yyyy.MM.dd')}"></strong>
    </span>
    </div>

    <h2 class="text-xl font-semibold mb-2">문진 리스트</h2>
    <ul class="list-disc pl-5 space-y-1">
        <li th:each="s : ${surveys}"
            th:text="${s.question}">
            문진 질문
        </li>
    </ul>

    <div class="mt-6 space-x-2">
        <a th:href="@{|/surveySets/${set.setId}/edit|}"
           class="bg-yellow-500 text-white px-4 py-1 rounded">수정</a>
        <a th:href="@{/surveySets}"
           class="bg-gray-500 text-white px-4 py-1 rounded">목록</a>
    </div>
</th:block>
</body>
</html>
