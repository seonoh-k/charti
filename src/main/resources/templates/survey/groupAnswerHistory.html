<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}"
      th:with="selectedChildId=${selectedChildId}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 문진 응답 이력</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">그룹 문진 이력</h1>

        <!-- 1) 자녀 선택 -->
        <div class="mb-4">
            <label for="childSelect" class="font-semibold mr-2">자녀 선택:</label>
            <select id="childSelect" class="border p-2 rounded w-64">
                <option th:if="${children.empty}"
                        value=""
                        disabled
                        selected>
                    등록된 자녀가 없습니다.
                </option>
                <option th:if="${!children.empty}"
                        value=""
                        th:selected="${selectedChildId == null}">
                    -- 자녀를 선택하세요 --
                </option>
                <option th:each="c : ${children}"
                        th:value="${c.id}"
                        th:text="${c.name + ' (' + c.nickname + ')'}"
                        th:selected="${c.id == selectedChildId}">
                </option>
            </select>
            <a href="/member/child" class="text-sm text-blue-600 px-4 hover:underline">+ 자녀 추가하기</a>
        </div>

        <!-- 2) 자녀 정보 -->
        <div id="childInfo" class="mb-6 p-4 border rounded bg-gray-50 hidden">
            <h2 class="text-lg font-semibold mb-2">자녀 정보</h2>
            <p><strong>이름:</strong> <span id="infoName"></span></p>
            <p><strong>성별:</strong> <span id="infoGender"></span></p>
            <p><strong>나이:</strong> <span id="infoAge"></span></p>
            <p><strong>키:</strong> <span id="infoHeight"></span></p>
            <p><strong>체중:</strong> <span id="infoWeight"></span></p>
        </div>

        <!-- 3) 이력 리스트 -->
        <div id="answerList" class="space-y-4">
            <!-- JavaScript 에서 채워집니다 -->
        </div>
    </div>

    <!-- 4) 수정 모달 -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded shadow-xl w-full max-w-lg">
            <h2 class="text-xl font-bold mb-4">답변 수정</h2>
            <div id="modalOptions" class="space-y-2 mb-4"></div>
            <div class="flex justify-end gap-4">
                <button id="cancelEdit" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">취소</button>
                <button id="saveEdit"   class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">저장</button>
            </div>
        </div>
    </div>

    <!-- 5) 스크립트: 인라인 Thymeleaf, 자동 선택/조회 로직 포함 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
            // 서버에서 내려온 selectedChildId
            const selectedChildId = /*[[${selectedChildId}]]*/ null;

            // DOM 요소 캐싱
            const childSelect = document.getElementById('childSelect');
            const childInfo   = document.getElementById('childInfo');
            const infoName    = document.getElementById('infoName');
            const infoGender  = document.getElementById('infoGender');
            const infoAge     = document.getElementById('infoAge');
            const infoHeight  = document.getElementById('infoHeight');
            const infoWeight  = document.getElementById('infoWeight');
            const answerList  = document.getElementById('answerList');

            let lastFetched = [];
            let currentEditId = null;

            function getRiskPercentage(selectedValue, possibleAnswers) {
                if (!possibleAnswers || possibleAnswers.length === 0) return 0;
                const totalOptions = possibleAnswers.length;
                switch (totalOptions) {
                    case 5:
                        switch (selectedValue) {
                            case 1: return 100;
                            case 2: return 75;
                            case 3: return 50;
                            case 4: return 25;
                            case 5: return 0;
                            default: return 0;
                        }
                    case 3:
                        switch (selectedValue) {
                            case 1: return 100;
                            case 2: return 50;
                            case 3: return 0;
                            default: return 0;
                        }
                    case 2:
                        switch (selectedValue) {
                            case 1: return 0;
                            case 2: return 100;
                            default: return 0;
                        }
                    default:
                        return 0;
                }
            }

            function getRiskColorClass(percentage) {
                if (percentage >= 60) return 'text-red-600 font-semibold';
                if (percentage >= 40) return 'text-orange-500 font-semibold';
                return 'text-green-600';
            }

            function loadChildInfoAndHistory(childId) {
                // 자녀 정보
                fetch(`/api/child/info/${childId}`)
                    .then(r => r.ok ? r.json() : Promise.reject(r))
                    .then(data => {
                        childInfo.classList.remove('hidden');
                        infoName.textContent   = data.name;
                        infoGender.textContent = data.gender;
                        infoAge.textContent    = data.age + '세';
                        infoHeight.textContent = data.height;
                        infoWeight.textContent = data.weight;
                    });

                // 이력 조회
                fetch(`/groupAnswer/api/history/${childId}`)
                    .then(r => r.ok ? r.json() : Promise.reject(r))
                    .then(data => {
                        lastFetched = data;
                        answerList.innerHTML = '';
                        if (data.length === 0) {
                            answerList.innerHTML = `<p class="text-gray-500 text-center italic">답변 이력이 없습니다.</p>`;
                            return;
                        }
                        // 날짜별 그룹핑
                        const byDate = {};
                        data.forEach(a => {
                            if (a && a.createdAt) {
                                const d = a.createdAt.substring(0,10);
                                (byDate[d] = byDate[d]||[]).push(a);
                            }
                        });
                        // 렌더링
                        Object.keys(byDate).sort((a,b)=>new Date(b)-new Date(a))
                          .forEach(date => {
                            const section = document.createElement('div');
                            section.className = 'border rounded mb-4';

                            // 전체 평균 위험도 계산
                            const daily = byDate[date];
                            const total = daily.reduce((s,ans) => s + (getRiskPercentage(ans.selectedValue, ans.possibleAnswers)/100), 0);
                            const avg   = daily.length ? (total/daily.length)*100 : 0;

                            const header = document.createElement('button');
                            header.type = 'button';
                            header.className = 'w-full flex justify-between items-center text-left px-4 py-2 bg-blue-100 font-semibold hover:bg-blue-200';
                            header.innerHTML = `
                              <span>${date} 문진 답변</span>
                              <span class="text-sm ${getRiskColorClass(avg)}">
                                  전체 위험도: ${avg.toFixed(1)}%
                              </span>
                            `;

                            const body = document.createElement('div');
                            body.className = 'hidden p-4 space-y-4 bg-gray-50';

                            daily.forEach((ans,i) => {
                                const risk = getRiskPercentage(ans.selectedValue, ans.possibleAnswers);
                                const color= getRiskColorClass(risk);
                                const card = document.createElement('div');
                                card.className = 'border p-3 rounded flex justify-between items-start';
                                card.innerHTML = `
                                  <div class="flex-grow">
                                    <p class="font-semibold">
                                      ${i+1}. [${ans.targetGroup||'대상 없음'} | ${ans.category||'카테고리 없음'}] ${ans.question||''}
                                    </p>
                                    <p class="text-sm text-gray-700 whitespace-pre-line" id="answerText_${ans.id}">
                                      ${ans.answer||''}
                                    </p>
                                    <p class="text-xs mt-1">
                                      위험도: <span class="${color}">${risk}%</span>
                                    </p>
                                  </div>
                                  <div class="flex flex-col items-end gap-2 ml-4 flex-shrink-0">
                                    <button onclick="showEditModal(${ans.id})"
                                            class="text-blue-600 hover:underline text-sm">수정</button>
                                    <button onclick="deleteAnswer(${ans.id})"
                                            class="text-red-600 hover:underline text-sm">삭제</button>
                                  </div>`;
                                body.appendChild(card);
                            });

                            header.addEventListener('click',()=>body.classList.toggle('hidden'));
                            section.append(header, body);
                            answerList.appendChild(section);
                          });
                    })
                    .catch(err => {
                        console.error("이력 조회 오류:", err);
                        answerList.innerHTML = `<p class="text-red-500">이력을 불러오는 중 오류가 발생했습니다.</p>`;
                    });
            }

            document.addEventListener('DOMContentLoaded', () => {
                // change 이벤트
                childSelect.addEventListener('change', () => {
                    const cid = childSelect.value;
                    if (!cid) {
                        childInfo.classList.add('hidden');
                        answerList.innerHTML = '';
                        return;
                    }
                    loadChildInfoAndHistory(cid);
                });
                // 자동 선택/조회
                if (selectedChildId) {
                    childSelect.value = selectedChildId;
                    loadChildInfoAndHistory(selectedChildId);
                }
            });

            // 삭제
            window.deleteAnswer = function(id) {
                if (!confirm('정말 삭제하시겠습니까?')) return;
                fetch(`/groupAnswer/api/answer/${id}`, { method: 'DELETE' })
                  .then(r => {
                    if (r.ok) {
                        alert('삭제되었습니다.');
                        childSelect.dispatchEvent(new Event('change'));
                    } else {
                        alert('삭제 중 오류 발생');
                    }
                  });
            };

            // 수정
            window.showEditModal = function(id) {
                currentEditId = id;
                const dto = lastFetched.find(a=>a.id===id);
                if (!dto) return alert('데이터가 없습니다.');
                const opts = document.getElementById('modalOptions');
                opts.innerHTML = '';
                dto.possibleAnswers.forEach((text,i)=>{
                    const v = i+1;
                    opts.insertAdjacentHTML("beforeend", `
                      <label class="flex items-center gap-2">
                        <input type="radio" name="editAnswer" value="${v}"
                          ${v===dto.selectedValue?"checked":""}/>
                        ${text}
                      </label>
                    `);
                });
                document.getElementById('editModal').classList.remove('hidden');
            };

            // 모달 취소
            document.getElementById('cancelEdit').addEventListener('click', ()=>{
                document.getElementById('editModal').classList.add('hidden');
            });
            // 모달 저장
            document.getElementById('saveEdit').addEventListener('click', ()=>{
                const sel = document.querySelector('input[name="editAnswer"]:checked');
                if (!sel) return alert('선택해주세요.');
                fetch(`/groupAnswer/api/answer/${currentEditId}`, {
                    method: 'PUT',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ answerValue: +sel.value })
                })
                .then(r=>{
                    if (r.ok) {
                        alert('수정되었습니다.');
                        document.getElementById('editModal').classList.add('hidden');
                        childSelect.dispatchEvent(new Event('change'));
                    } else {
                        alert('수정 중 오류 발생');
                    }
                });
            });
        /*]]>*/
    </script>
</th:block>
</html>
