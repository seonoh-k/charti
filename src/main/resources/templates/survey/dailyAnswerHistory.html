<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>데일리 문진 답변 이력</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet"/>
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>

<!-- 1) content 프래그먼트 -->
<th:block layout:fragment="content">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">데일리 문진 답변 이력</h1>

        <!-- 1) 자녀 선택 -->
        <div class="mb-6">
            <label for="childSelect" class="font-semibold mr-2">자녀 선택:</label>
            <select id="childSelect" class="border p-2 rounded w-64">

                <!-- 자녀가 한 명도 없으면 -->
                <option th:if="${children.empty}"
                        value=""
                        disabled
                        selected>
                    등록된 자녀가 없습니다.
                </option>

                <!-- 자녀가 있으면 -->
                <option th:if="${!children.empty}"
                        value=""
                        th:selected="${selectedChildId == null}">
                    -- 자녀를 선택하세요 --
                </option>

                <option th:each="c : ${children}"
                        th:value="${c.id}"
                        th:selected="${c.id == childId}"
                        th:text="${c.name + ' (' + c.nickname + ')'}">
                </option>
            </select>

            <a href="/member/child" class="px-4 text-sm text-blue-600 hover:underline">+ 자녀 추가하기</a>

        </div>

        <!-- 2) 자녀 정보 -->
        <div id="childInfo"
             class="mb-6 p-4 border rounded bg-gray-50 hidden">
            <h2 class="text-lg font-semibold mb-2">자녀 정보</h2>
            <p><strong>이름:</strong> <span id="infoName"></span></p>
            <p><strong>성별:</strong> <span id="infoGender"></span></p>
            <p><strong>나이:</strong> <span id="infoAge"></span></p>
            <p><strong>키:</strong> <span id="infoHeight"></span></p>
            <p><strong>체중:</strong> <span id="infoWeight"></span></p>
        </div>

        <!-- 3) 답변 이력 리스트 -->
        <div id="answerList" class="space-y-4"></div>
    </div>

    <!-- 4) 수정 모달 -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded shadow-xl w-full max-w-lg">
            <h2 class="text-xl font-bold mb-4">답변 수정</h2>
            <div id="modalOptions" class="space-y-2 mb-4"></div>
            <div class="flex justify-end gap-4">
                <button id="cancelEdit"
                        class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">취소</button>
                <button id="saveEdit"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">저장</button>
            </div>
        </div>
    </div>
</th:block>

<!-- 2) script 프래그먼트 -->
<th:block layout:fragment="script">
    <script th:inline="javascript">
        /*<![CDATA[*/
        // 서버에서 주입된 선택된 childId
        const preSelectedChildId = /*[[${childId}]]*/ null;
        /*]]>*/
    </script>
    <script>
        let lastFetchedHistory = [];

        function getRiskPercentage(selectedValue, possibleAnswers) {
          const total = possibleAnswers?.length || 0;
          if (total === 0) return 0;
          switch (total) {
            case 5: return [0,100,75,50,25,0][selectedValue] || 0;
            case 3: return [0,100,50,0][selectedValue] || 0;
            case 2: return [0,0,100][selectedValue] || 0;
            default: return 0;
          }
        }
        function getRiskColorClass(pct) {
          if (pct >= 60) return 'text-red-600 font-semibold';
          if (pct >= 40) return 'text-orange-500 font-semibold';
          return 'text-green-600';
        }

        document.addEventListener("DOMContentLoaded", () => {
          const childSelect  = document.getElementById("childSelect");
          const childInfo    = document.getElementById("childInfo");
          const infoName     = document.getElementById("infoName");
          const infoGender   = document.getElementById("infoGender");
          const infoAge      = document.getElementById("infoAge");
          const infoHeight   = document.getElementById("infoHeight");
          const infoWeight   = document.getElementById("infoWeight");
          const answerList   = document.getElementById("answerList");
          const editModal    = document.getElementById("editModal");
          const modalOptions = document.getElementById("modalOptions");
          const cancelEdit   = document.getElementById("cancelEdit");
          const saveEdit     = document.getElementById("saveEdit");
          let currentEditId  = null;

          async function loadHistory(childId) {
            // 자녀 정보
            const resInfo = await fetch(`/api/child/info/${childId}`);
            const data    = await resInfo.json();
            childInfo.classList.remove("hidden");
            infoName.textContent   = data.name;
            infoGender.textContent = data.gender;
            infoAge.textContent    = data.age + '세';
            infoHeight.textContent = data.height;
            infoWeight.textContent = data.weight;

            // 답변 이력
            const resHist = await fetch(`/dailyAnswer/api/history/${childId}`);
            const hist    = await resHist.json();
            lastFetchedHistory = hist;
            answerList.innerHTML = "";

            if (!hist.length) {
              answerList.innerHTML = `<p class="text-gray-500 text-center italic">답변 이력이 없습니다.</p>`;
              return;
            }

            // 날짜별 그룹핑 후 렌더링
            const byDate = {};
            hist.forEach(a => {
              const d = a.createdAt.substring(0,10);
              (byDate[d] = byDate[d]||[]).push(a);
            });
            Object.keys(byDate)
              .sort((a,b) => new Date(b)-new Date(a))
              .forEach(date => {
                const answers = byDate[date];
                const avgRisk = answers.reduce((sum,ans) =>
                  sum + getRiskPercentage(ans.selectedValue, ans.possibleAnswers)/100
                ,0) / answers.length * 100;

                const section = document.createElement('div');
                section.className = 'border rounded mb-4';

                const header = document.createElement('button');
                header.type = 'button';
                header.className = 'w-full flex justify-between items-center text-left px-4 py-2 bg-blue-100 font-semibold hover:bg-blue-200';
                header.innerHTML = `
                  <span>${date} 문진 답변</span>
                  <span class="text-sm ${getRiskColorClass(avgRisk)}">
                    전체 위험도: ${avgRisk.toFixed(1)}%
                  </span>
                `;
                const body = document.createElement('div');
                body.className = 'hidden p-4 space-y-4 bg-gray-50';

                answers.forEach((ans,idx) => {
                  const pct   = getRiskPercentage(ans.selectedValue, ans.possibleAnswers);
                  const color = getRiskColorClass(pct);
                  const card  = document.createElement('div');
                  card.className = 'border p-3 rounded flex justify-between items-start';
                  card.innerHTML = `
                    <div class="flex-grow">
                      <p class="font-semibold">
                        ${idx+1}. [${ans.category} | ${ans.ageGroup}] ${ans.question}
                      </p>
                      <p class="text-sm text-gray-700 whitespace-pre-line">${ans.answer}</p>
                      <p class="text-xs mt-1">
                        위험도: <span class="${color}">${pct}%</span>
                      </p>
                    </div>
                  `;
                  body.appendChild(card);
                });

                header.addEventListener('click', () => body.classList.toggle('hidden'));
                section.append(header, body);
                answerList.appendChild(section);
              });
          }

          childSelect.addEventListener("change", () => {
            const childId = childSelect.value;
            if (!childId) return;
            loadHistory(childId);
          });

          // 삭제
          window.deleteAnswer = async (id) => {
            if (!confirm("정말 삭제하시겠습니까?")) return;
            const r = await fetch(`/dailyAnswer/api/answer/${id}`, { method: "DELETE" });
            if (r.ok) {
              alert("삭제되었습니다.");
              childSelect.dispatchEvent(new Event("change"));
            }
          };

          // 수정 모달
          window.showEditModal = (id) => {
            currentEditId = id;
            const ansObj = lastFetchedHistory.find(a=>a.id===id);
            if (!ansObj) return alert("답변 데이터를 찾을 수 없습니다.");
            modalOptions.innerHTML = "";
            ansObj.possibleAnswers.forEach((text,idx)=>{
              const v = idx+1;
              modalOptions.insertAdjacentHTML("beforeend", `
                <label class="flex items-center gap-2">
                  <input type="radio" name="editAnswer" value="${v}"
                    ${v===ansObj.selectedValue?"checked":""}/>
                  ${text}
                </label>
              `);
            });
            editModal.classList.remove("hidden");
          };
          cancelEdit.addEventListener("click", ()=>{
            editModal.classList.add("hidden");
            currentEditId=null;
          });
          saveEdit.addEventListener("click", async ()=>{
            const sel = document.querySelector('input[name="editAnswer"]:checked');
            if (!sel) return alert("답변을 선택해주세요.");
            const r = await fetch(`/dailyAnswer/api/answer/${currentEditId}`, {
              method: "PUT",
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({answerValue: parseInt(sel.value,10)})
            });
            if (r.ok) {
              alert("수정되었습니다.");
              editModal.classList.add("hidden");
              childSelect.dispatchEvent(new Event("change"));
            }
          });

          // 페이지 로드 시 자동 선택
          if (preSelectedChildId != null) {
            childSelect.value = preSelectedChildId;
            childSelect.dispatchEvent(new Event("change"));
          }
        });
    </script>
</th:block>
</html>
