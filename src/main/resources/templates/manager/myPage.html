<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://kit.fontawesome.com/0f39c44f6d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>담당자 대시보드</title>
</head>
<body class="h-screen flex flex-col">

    <!-- 햄버거 버튼 (프래그먼트 또는 공통) -->
    <div th:replace="fragments/managerFragments :: hamburger"></div>

    <div class="flex flex-1">
        <!-- 사이드바 (프래그먼트 or 공통) -->
        <div th:replace="fragments/managerFragments :: sideBar"></div>

        <!-- 메인(콘텐츠) -->
        <main class="flex-1 p-6 bg-gray-100">
            <!-- 실제 콘텐츠: 마이페이지, 그룹관리, 문진관리 등 분기 -->
            <th:block layout:fragment="content">

            <!-- 중앙 정렬 wrapper -->
            <div class="flex justify-center items-center py-20">
                <!-- 마이페이지 카드 박스 -->
                <div class="bg-white p-6 rounded shadow-md w-full max-w-7xl">

                <!-- 메시지 고정 영역 -->
                <div class="min-h-[48px] mb-2">
                    <div id="flashMsg" th:if="${msg}" class="bg-green-100 border p-2 rounded text-green-700 mb-2 text-sm">
                        <span th:text="${msg}"></span>
                    </div>
                    <div id="flashError" th:if="${error}" class="bg-red-100 border p-2 rounded text-red-700 mb-2 text-sm">
                        <span th:text="${error}"></span>
                    </div>
                </div>

                    <a th:href="@{/main}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mb-4 text-sm font-medium">
                    메인으로
                    </a>

                    <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">👤 담당자 마이페이지</h1>

                    <form id="userEditForm" action="/manager/update" method="post" class="space-y-4" autocomplete="off">
                        <!-- 이름 -->
                        <div>
                            <label class="block mb-1 text-sm font-medium">이름</label>
                            <input type="text" name="name" id="name" th:value="${userInfo.name}"
                                class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-700 focus:outline-none focus:ring" readonly />
                        </div>

                        <!-- 닉네임 -->
                        <div>
                            <label class="block mb-1 text-sm font-medium">닉네임</label>
                            <input type="text" name="nickname" id="nickname" th:value="${userInfo.nickname}"
                                class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-700 focus:outline-none focus:ring" readonly />
                        </div>

                        <!-- 이메일 -->
                        <div>
                            <label class="block mb-1 text-sm font-medium">이메일</label>
                            <input type="email" name="username" id="username" th:value="${userInfo.username}"
                                class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none focus:ring" readonly />
                        </div>

                        <!-- 전화번호 (현재값) -->
                        <div>
                            <label class="block mb-1 text-sm font-medium">전화번호</label>
                            <input type="text" name="phoneNumber" id="phoneNumber" th:value="${userInfo.phoneNumber}"
                                class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none focus:ring" readonly />
                        </div>
                        <input type="hidden" name="newUid" id="newUid" value="">

                        <!-- 🔐 SMS 인증 (수정 모드에서만 보임) -->
                        <div id="smsSection" class="hidden">
                            <label for="phone" class="block mb-1 text-sm font-medium">휴대전화</label>
                            <div class="flex gap-2">
                                <select id="phone1" class="p-2 rounded border w-20">
                                    <option value="010">010</option>
                                    <option value="011">011</option>
                                    <option value="016">016</option>
                                    <option value="017">017</option>
                                    <option value="018">018</option>
                                    <option value="019">019</option>
                                </select>
                                <input id="phone2" type="text" maxlength="4" placeholder="1234"
                                    class="p-2 rounded border w-20" pattern="\d*" />
                                <input id="phone3" type="text" maxlength="4" placeholder="5678"
                                    class="p-2 rounded border w-20" pattern="\d*" />
                                <button type="button" id="send-otp-btn"
                                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded"
                                        onclick="sendSmsOtp()">
                                    인증번호 받기
                                </button>
                            </div>
                            <div class="mt-2">
                                <label for="otp" class="block text-sm font-medium mb-1">인증번호</label>
                                <input id="otp" type="text" placeholder="6자리 코드"
                                    class="w-full p-2 rounded border" disabled />
                                <button type="button" id="verify-otp-btn"
                                        class="mt-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded"
                                        onclick="verifySmsOtp()" disabled>
                                    인증 확인
                                </button>
                            </div>
                            <div id="recaptcha-container"></div>
                        </div>

                        <p class="font-bold mt-6 mb-2 text-gray-700">그룹 정보</p>

                        <!-- 그룹 이름 -->
                        <div>
                            <label class="block mb-1 text-sm font-medium">그룹 이름</label>
                            <input type="text" name="groupName" id="groupName" th:value="${userInfo.groupName}"
                                class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none focus:ring" readonly />
                        </div>

                                    <!-- 주소 -->
                        <div>
                            <label class="block mb-1 text-sm font-medium">주소</label>
                            <input type="text" id="zipNum" class="w-full mb-2 border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed" readonly th:value="${userInfo.address.zipNum}" />
                            <input type="text" id="addr1" class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed" readonly th:value="${userInfo.address.sido + ' ' + userInfo.address.gugun + ' ' + userInfo.address.dong + (userInfo.address.bunji != null && !#strings.isEmpty(userInfo.address.bunji) ? ' ' + userInfo.address.bunji : '')}" />
                            <input type="hidden" id="addressId" name="addressId" th:value="${userInfo.address.id}" />
                        </div>



                        <div class="flex items-center gap-2 mt-3">
                            <span class="text-sm text-gray-600">총 자녀 수: <span th:text="${#lists.size(userInfo.children)}"></span>명</span>
                            <button type="button" onclick="openChildModal()" class="text-blue-600 hover:underline text-sm">자세히 보기</button>
                        </div>

                        <!-- 수정/완료/취소 버튼 -->
                        <div id="editButtonBox" class="flex flex-row justify-end gap-2 pt-4">
                            <button type="button" onclick="enableEditMode()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded">
                                수정하기
                            </button>
                            <button type="button" onclick="openPasswordModal()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">
                                비밀번호 변경
                            </button>
                            <button type="button" onclick="confirmDelete()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
                                회원 탈퇴
                            </button>
                        </div>
                        <div id="actionButtonBox" class="flex flex-row justify-end gap-2 pt-4 hidden">
                            <button type="button" onclick="submitEdit()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">완료</button>
                            <button type="button" onclick="cancelEdit()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">취소</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 자녀 모달 -->
            <div id="childModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
                <div class="bg-white rounded shadow-lg p-6 w-full max-w-2xl max-h-[80vh] overflow-y-auto">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">소속 자녀 목록</h2>
                    <!-- 목록 출력 영역 -->
                    <div id="childListContainer" class="space-y-3"></div>
                    <!-- 닫기 버튼 -->
                    <div class="text-right mt-6">
                        <button onclick="closeChildModal()" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded">닫기</button>
                    </div>
                </div>
            </div>

            <!-- 자녀수정모달 -->
            <div id="childEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
                <div class="bg-white rounded shadow-lg p-6 w-full max-w-md">
                    <h2 class="text-lg font-bold mb-4 text-gray-800">자녀 정보 수정</h2>
                    <form id="childEditForm" class="space-y-3">
                        <input type="hidden" id="editChildId" />
                        <div>
                            <label class="block text-sm mb-1">이름</label>
                            <input type="text" id="editChildName" class="w-full border border-gray-300 rounded px-3 py-2" required />
                        </div>
                        <div>
                            <label class="block text-sm mb-1">성별</label>
                            <select id="editChildGender" class="w-full border border-gray-300 rounded px-3 py-2">
                                <option value="남">남</option>
                                <option value="여">여</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm mb-1">태명</label>
                            <input type="text" id="editChildNickname" class="w-full border border-gray-300 rounded px-3 py-2" />
                        </div>
                        <div>
                            <label class="block text-sm mb-1">생일</label>
                            <input type="date" id="editChildBirthday" class="w-full border border-gray-300 rounded px-3 py-2" />
                        </div>
                        <div>
                            <label class="block text-sm mb-1">체중</label>
                            <input type="number" id="editChildWeight" class="w-full border border-gray-300 rounded px-3 py-2" />
                        </div>
                        <div>
                            <label class="block text-sm mb-1">신장</label>
                            <input type="number" id="editChildHeight" class="w-full border border-gray-300 rounded px-3 py-2" />
                        </div>
                        <div class="flex gap-2 mt-4 justify-end">
                            <button type="button" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded" onclick="closeChildEditModal()">취소</button>
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">저장</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 🔐 비밀번호 변경 모달 -->
            <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
                <div class="bg-white rounded shadow-lg p-6 w-full max-w-md">
                    <h2 class="text-lg font-bold mb-4 text-gray-800">비밀번호 변경</h2>
                    <form id="passwordForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">현재 비밀번호</label>
                            <input type="password" id="currentPassword" class="w-full border border-gray-300 rounded px-3 py-2" required />
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">새 비밀번호</label>
                            <input type="password" id="newPassword" class="w-full border border-gray-300 rounded px-3 py-2" required />
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">새 비밀번호 확인</label>
                            <input type="password" id="confirmPassword" class="w-full border border-gray-300 rounded px-3 py-2" required />
                        </div>
                        <div class="flex justify-end gap-2 pt-4">
                            <button type="button" onclick="closePasswordModal()" class="px-4 py-2 rounded bg-gray-400 hover:bg-gray-500 text-white">닫기</button>
                            <button type="button" onclick="submitPasswordChange()" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white">비밀번호 변경</button>
                        </div>
                    </form>
                </div>
            </div>

            <script th:inline="javascript">
                /*<![CDATA[*/
                window.MANAGER_CHILDREN = /*[[${userInfo.children}]]*/ [];
                /*]]>*/
            </script>

            <script src="/js/addressSearch.js"></script>
            <script type="module" src="/js/smsAuth.js"></script>
            <script src="/js/userEdit.js"></script>
            <script src="/js/manager/managerPage.js"></script>
            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    ['flashMsg','flashError'].forEach(id => {
                        const el = document.getElementById(id);
                        if(el) {
                            setTimeout(() => {
                                el.classList.add('transition-opacity', 'duration-700');
                                el.classList.add('opacity-0');
                                setTimeout(() => el.style.display='none', 700);
                            }, 3000);
                        }
                    });
                });
            </script>

            </th:block>
        </main>
    </div>

    <script th:src="@{/js/manager/managerSideBar.js}"></script>
</body>
</html>
