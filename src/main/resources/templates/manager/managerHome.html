<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://kit.fontawesome.com/0f39c44f6d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>담당자 대시보드</title>
</head>
<body class="h-screen flex flex-col">

    <!-- 햄버거 버튼 (프래그먼트 또는 공통) -->
    <div th:replace="fragments/managerFragments :: hamburger"></div>

    <div class="flex flex-1">
        <!-- 사이드바 (프래그먼트 or 공통) -->
        <div th:replace="fragments/managerFragments :: sideBar"></div>

        <!-- 메인(콘텐츠) -->
        <main class="flex-1 p-6 bg-gray-100">
            <!-- 실제 콘텐츠: 마이페이지, 그룹관리, 문진관리 등 분기 -->
            <th:block layout:fragment="content">
                <h1 class="text-2xl font-bold mb-4">대시보드 메인</h1>
                <p>여기에 담당자(매니저) 전용 콘텐츠가 들어갑니다.</p>
            </th:block>
        </main>
    </div>


    <script th:src="@{/js/manager/managerSideBar.js}"></script>
</body>
</html>
