<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/managerLayout">
<th:block layout:fragment="content">
    <!-- 메인(콘텐츠) -->
    <main class="flex-1 p-6 bg-gray-100">
        <div class="flex justify-center items-center py-20">
            <div class="bg-white p-6 rounded shadow-md w-full max-w-7xl">
                <h1 class="text-3xl font-bold mb-4">담당자 > 홈 </h1>
                <div class="flex gap-8 mt-8">
                    <!-- 내 정보 카드 -->
                    <div class="bg-white rounded-2xl shadow-md p-8 min-w-[280px] flex-1">
                        <h2 class="text-xl font-bold mb-4">내 정보</h2>
                        <ul class="space-y-2">
                            <li><span class="font-semibold">이름</span> : <span th:text="${dashboardInfo.managerName}"></span></li>
                            <li><span class="font-semibold">이메일</span> : <span th:text="${dashboardInfo.managerEmail}"></span></li>
                            <li><span class="font-semibold">전화번호</span> : <span th:text="${dashboardInfo.managerPhone}"></span></li>
                        </ul>
                    </div>
                    <!-- 그룹 정보 카드 -->
                    <div class="bg-white rounded-2xl shadow-md p-8 min-w-[280px] flex-1">
                        <h2 class="text-xl font-bold mb-4">우리 기관 정보</h2>
                        <ul class="space-y-2">
                            <li><span class="font-semibold">기관명</span> : <span th:text="${dashboardInfo.groupName}"></span></li>
                            <li><span class="font-semibold">이메일</span> : <span th:text="${dashboardInfo.groupEmail}"></span></li>
                            <li><span class="font-semibold">소속 자녀 수</span> : <span th:text="${dashboardInfo.childCount}"></span>명</li>
                        </ul>
                    </div>
                </div>

                <!-- 문진 현황은 추후 추가 -->

                <div class="bg-white rounded-2xl shadow-md p-6 mt-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold">📊 최근 문진 발송 이력</h2>
                        <a href="/manager/notification/history" class="text-blue-600 text-sm hover:underline">전체보기 &rarr;</a>
                    </div>

                    <div class="overflow-x-auto mt-6 rounded-2xl shadow">
                        <table class="min-w-full leading-normal">
                            <thead>
                                <tr>
                                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        발송일시
                                    </th>
                                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        제목
                                    </th>
                                    <!-- <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        카테고리
                                    </th>
                                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        발송 대상
                                    </th> -->
                                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        총 인원
                                    </th>
                                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        응답(성공)
                                    </th>
                                    <!-- <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        상세
                                    </th> -->
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="notice : ${recentNotices}" class="hover:bg-gray-50">
                                    <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm" th:text="${#temporals.format(notice.sentAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm" th:text="${notice.title}"></td>
                                    <!-- <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm" th:text="${notice.category.label}"></td>
                                    <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm" th:text="${notice.targetCondition}"></td> -->
                                    <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm" th:text="${notice.targetCount}"></td>
                                    <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm" th:text="${notice.successCount}"></td>
                                    <!-- <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm">
                                        <a th:if="${notice.link != null}" th:href="${notice.link}" target="_blank" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-center hover:bg-blue-600">
                                            자세히
                                        </a>
                                    </td> -->
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentNotices)}">
                                    <td colspan="7" class="text-center text-gray-400 py-6">최근 발송 내역이 없습니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</th:block>
</html>
