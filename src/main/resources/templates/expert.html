<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Expert Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md text-center">
    <h1 class="text-4xl font-semibold mb-4">👨‍ Expert Page</h1>


            <div class="mt-6">
              <div id="photoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                            <img th:src="${licenseImageUrl}"
                            alt="자격증 이미지"
                            class="modal-trigger w-full h-full object-cover transition-transform duration-300 hover:scale-105">
              </div>
          </div>
    <p class="mb-6">ROLE_EXPERT 권한을 가진 사용자 전용 페이지입니다.</p>
    <a th:href="@{/main}" class="inline-block bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
      메인으로
    </a>



    <!-- 회원 정보 수정 모달 -->
    <div id="userEditModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
      <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-lg">
        <h2 class="text-xl font-bold mb-4">회원 정보 수정</h2>

        <form id="userEditForm" class="space-y-4">
          <!-- 이름 (수정 전용) -->
          <div>
            <label class="block mb-1 text-sm font-semibold">이름</label>
            <input type="text" id="name" class="w-full border p-2 rounded" >
          </div>

          <!-- 닉네임 (수정 가능) -->
          <div>
            <label class="block mb-1 text-sm font-semibold">닉네임</label>
            <input type="text" id="nickname" class="w-full border p-2 rounded">
          </div>

          <!-- 이메일 (읽기 전용) -->
          <div>
            <label class="block mb-1 text-sm font-semibold">이메일</label>
            <input type="email" id="email" class="w-full border p-2 rounded bg-gray-100" readonly>
          </div>

          <!-- 전화번호 (검증후 수정 가능) -->
          <div>
            <label class="block mb-1 text-sm font-semibold">전화번호</label>
            <input type="text" id="phoneNumber" class="w-full border p-2 rounded bg-gray-100" readonly >
          </div>
        </form>

        <div class="mt-6 flex justify-between">
          <button id="deleteBtn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">회원 탈퇴</button>
                <button onclick="closeUserEditModal() " class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">닫기  </button>
          <button id="saveBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">수정</button>
                <button onclick="openPasswordModal()">내 비밀번호 수정</button>
        </div>
      </div>
    </div>


    <!-- 비밀번호 수정 모달 -->
<div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
    <h2 class="text-lg font-bold mb-4">비밀번호 변경</h2>

    <form id="passwordForm" class="space-y-4">
      <!-- 현재 비밀번호 -->
      <div>
        <label class="block text-sm font-semibold mb-1">현재 비밀번호</label>
        <input type="password" id="currentPassword" class="w-full border p-2 rounded" required>
      </div>

      <!-- 새 비밀번호 -->
      <div>
        <label class="block text-sm font-semibold mb-1">새 비밀번호</label>
        <input type="password" id="newPassword" class="w-full border p-2 rounded" required>
      </div>

      <!-- 새 비밀번호 확인 -->
      <div>
        <label class="block text-sm font-semibold mb-1">새 비밀번호 확인</label>
        <input type="password" id="confirmPassword" class="w-full border p-2 rounded" required>
      </div>
    </form>

    <div class="mt-6 flex justify-between">
      <button onclick="closePasswordModal()" class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400">닫기</button>
      <button onclick="submitPasswordChange()" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">비밀번호 변경</button>
    </div>
  </div>
</div>


    
    <button onclick="loadUserInfo()">내 정보 수정</button>
  </div>





  <script>  // 기본정보 변경 & 회원탈퇴 모달 크스립트

      async function loadUserInfo() {
        try {
          const res = await fetch("/api/users/me"); // 서버에서 사용자 정보 가져옴
          if (!res.ok) {
            alert("사용자 정보를 불러오지 못했습니다.");
            return;
          }
          const user = await res.json(); 
          openUserEditModal(user); // 가져온 정보로 모달 열기
        } catch (e) {
          console.error("에러 발생:", e);
          alert("에러가 발생했습니다.");
        }
      }
    
        // 모달 열기
      function openUserEditModal(user) {
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('nickname').value = user.nickname;
        document.getElementById('phoneNumber').value = user.phoneNumber;

        document.getElementById('userEditModal').classList.remove('hidden');
      }
      // 모달 닫기
      function closeUserEditModal() {
        document.getElementById('userEditModal').classList.add('hidden');
      }

      // 수정 버튼 클릭 시
      document.getElementById('saveBtn').addEventListener('click', async () => {
        const payload = {
          name: document.getElementById('name').value,
          nickname: document.getElementById('nickname').value,
          phoneNumber: document.getElementById('phoneNumber').value,
        };

        const res = await fetch('/api/users/update', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("수정되었습니다.");
          location.reload(); // 또는 모달 닫기
        } else {
          alert("수정 실패");
        }
      });

      // 회원 탈퇴 버튼 클릭 시
      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!confirm("정말로 탈퇴하시겠습니까?")) return;

        const res = await fetch('/api/users/delete', {
          method: 'DELETE'
        });

        if (res.ok) {
          alert("탈퇴 처리되었습니다.");
          location.href = "/loginForm";
        } else {
          alert("탈퇴 실패");
        }
});
  </script>

  <script> // 비밀번호 변경 모달 스크립트

  function openPasswordModal() {
  document.getElementById('passwordModal').classList.remove('hidden');
}

function closePasswordModal() {
  document.getElementById('passwordModal').classList.add('hidden');
}

async function submitPasswordChange() {
  const current = document.getElementById('currentPassword').value;
  const newPass = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (newPass !== confirm) {
    alert("새 비밀번호가 일치하지 않습니다.");
    return;
  }

  const response = await fetch('/api/users/update/password', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      currentPassword: current,
      newPassword: newPass,
      confirmPassword: confirm
    })
  });

  if (response.ok) {
    alert("비밀번호가 성공적으로 변경되었습니다.");
    closePasswordModal();
  } else {
    const result = await response.json();
    alert(result.message || "비밀번호 변경 실패");
  }
}

  </script>
</body>
</html>
