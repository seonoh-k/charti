<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/expertLayout">
<th:block layout:fragment="content">
    <div class="flex flex-1">
        <div class="flex-1 justify-center items-center p-20">
            <div class="flex items-center mb-4">
                <!-- 제목 -->
                <h2 th:text="${matching.title}"
                    class="text-2xl font-bold mr-3">
                </h2>
                <!-- 카테고리 -->
                <span th:text="${matching.category.displayName}"
                      class="text-sm font-medium bg-white px-2 py-1 rounded">
                </span>
            </div>

            <!-- 기본 정보 -->
            <section class="mb-6 border p-4 rounded bg-white">
                <div class="mb-6 p-4 border rounded bg-gray-50">
                    <h2 class="text-lg font-semibold mb-2">자녀 정보</h2>
                    <p><strong>이름:</strong> <span th:text="${matching.child.name}"/></p>
                    <p><strong>성별:</strong>
                        <span th:switch="${matching.child.gender}">
                            <span th:case="'남'">남자</span>
                            <span th:case="'여'">여자</span>
                        </span>
                    </p>
                    <p><strong>나이:</strong> <span th:text="${matching.child.age}"/>세</p>
                    <p><strong>신장:</strong> <span th:text="${matching.child.height}"/></p>
                    <p><strong>체중:</strong> <span th:text="${matching.child.weight}"/></p>
                </div>

                <p><strong>내용</strong></p>
                <div class="mt-2 p-2 bg-gray-50 rounded mb-5"
                     th:text="${matching.content}"/>

                <!-- 문진 질문/답변 -->
                <details class="mb-6 border rounded">
                    <summary class="px-4 py-2 bg-gray-100 cursor-pointer">
                        문진 질문/답변
                    </summary>
                    <div class="p-4 space-y-4">
                        <div th:each="ans : ${matching.answers}">
                            <p class="font-semibold" th:text="${ans.question}"></p>
                            <p th:text="${ans.answer}"></p>
                            <hr/>
                        </div>
                    </div>
                </details>

                <!-- 첨부 이미지 -->
                <div th:if="${photos.size()>0}" class="mb-6">
                    <h2 class="font-semibold mb-2">첨부 이미지</h2>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div th:each="fileName : ${photos}">
                            <img th:src="@{/api/proxy/image(filename='thumbnail/' + ${fileName})}"
                                 th:data-full="@{/api/proxy/image(filename='original/' + ${fileName})}"
                                 class="w-full h-32 object-cover rounded cursor-pointer thumbnail"
                                 th:alt="${fileName}"/>
                        </div>
                    </div>

                    <!-- 모달 -->
                    <div id="image-modal"
                         class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
                        <button id="image-modal-close"
                                class="absolute top-4 right-4 text-white text-2xl font-bold">&times;</button>
                        <img id="image-modal-img" class="max-h-[90%] max-w-[90%] rounded shadow-lg"/>
                    </div>
                </div>
            </section>

            <!-- 이미 답변 완료된 경우 -->
            <div th:if="${matching.status == T(com.example.demo.enums.MatchingStatus).RESPONDED}"
                 class="mb-6 p-4 border rounded bg-green-50">
                <h2 class="font-semibold mb-2">전문가 답변</h2>
                <div th:each="a : ${answers}">
                    <p th:text="${a.content}"></p>
                    <p class="text-sm text-gray-500 mt-1"
                       th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
                </div>
            </div>

            <!-- 아직 답변 전일 때만 폼 보이기 -->
            <form th:if="${matching.status != T(com.example.demo.enums.MatchingStatus).RESPONDED}"
                  th:action="@{/expert/matching/{id}/respond(id=${matching.id})}"
                  th:object="${answerForm}"
                  method="post">
                <div class="mb-4">
                    <label class="block font-semibold mb-1" for="content">답변 내용</label>
                    <textarea id="content"
                              th:field="*{content}"
                              class="w-full border p-2 rounded h-40"
                              placeholder="답변을 입력하세요" required></textarea>
                </div>
                <button type="submit"
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    답변 완료
                </button>
                <div th:if="${param.submitted}">
                    <p class="mt-2 text-green-600">답변이 저장되었습니다.</p>
                </div>
            </form>
        </div>
    </div>

    <!-- 이미지 모달 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          const modal = document.getElementById('image-modal');
          const modalImg = document.getElementById('image-modal-img');
          const btnClose = document.getElementById('image-modal-close');
          document.querySelectorAll('.thumbnail').forEach(el => {
            el.addEventListener('click', () => {
              modalImg.src = el.dataset.full;
              modal.classList.remove('hidden');
              modal.classList.add('flex');
            });
          });
          btnClose.addEventListener('click', () => {
            modal.classList.add('hidden');
            modalImg.src = '';
          });
          modal.addEventListener('click', e => {
            if (e.target === modal) btnClose.click();
          });
        });
    </script>
</th:block>>
</html>
